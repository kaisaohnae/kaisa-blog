# 2. FlatList 기본\n\n```tsx\nimport { FlatList, Text, View } from 'react-native';\n\ntype Item = { id: string; title: string };\n\nexport function PostList({ data }: { data: Item[] }) {\n  return (\n    \u003cFlatList\n      data={data}\n      keyExtractor={(item) =\u003e item.id}\n      renderItem={({ item }) =\u003e (\n        \u003cView style={{ padding: 16 }}\u003e\n          \u003cText\u003e{item.title}\u003c/Text\u003e\n        \u003c/View\u003e\n      )}\n      ItemSeparatorComponent={() =\u003e \u003cView style={{ height: 1, backgroundColor: '#e2e8f0' }} /\u003e}\n      ListEmptyComponent={\u003cText style={{ padding: 24 }}\u003e게시글이 없습니다\u003c/Text\u003e}\n      contentContainerStyle={{ flexGrow: 1 }}\n    /\u003e\n  );\n}\n```\n\n성능 옵션:\n\n```tsx\n\u003cFlatList\n  initialNumToRender={10}\n  windowSize={7}\n  removeClippedSubviews\n  getItemLayout={(_, index) =\u003e ({\n    length: ROW_HEIGHT,\n    offset: ROW_HEIGHT * index,\n    index,\n  })}\n/\u003e\n```\n\n`getItemLayout`은 고정 높이일 때 스크롤 측정 비용을 줄인다.\n\n### 최적화 팁\n\n- `renderItem`은 가능하면 `memo`된 행 컴포넌트\n- 인라인 `() =\u003e {}` / 인라인 style 과다 주의\n- `extraData`로 선택 상태 등 리렌더 트리거\n- 이미지 많으면 `expo-image` + 적절한 크기\n\n```bash\nnpx expo install @shopify/flash-list\n```\n\n---\n\n## 3. Pull to refresh / 무한 스크롤\n\n```tsx\nconst [refreshing, setRefreshing] = useState(false);\n\n\u003cFlatList\n  refreshing={refreshing}\n  onRefresh={async () =\u003e {\n    setRefreshing(true);\n    await refetch();\n    setRefreshing(false);\n  }}\n  onEndReached={loadMore}\n  onEndReachedThreshold={0.3}\n  ListFooterComponent={isFetchingNextPage ? \u003cActivityIndicator /\u003e : null}\n/\u003e\n```\n\n페이지 데이터는 React Query `useInfiniteQuery`와 잘 맞는다 .\n\n---\n\n## 4. Expo Router — 파일 기반 라우팅\n\n```\napp/\n├── _layout.tsx          # 루트 레이아웃\n├── index.tsx            # /\n├── (auth)/\n│   ├── _layout.tsx\n│   ├── login.tsx\n│   └── signup.tsx\n├── (tabs)/\n│   ├── _layout.tsx\n│   ├── index.tsx        # 홈 탭\n│   └── settings.tsx\n└── posts/\n    ├── index.tsx\n    └── [id].tsx         # 동적 세그먼트\n```\n\n```tsx\n// app/_layout.tsx\nimport { Stack } from 'expo-router';\n\nexport default function RootLayout() {\n  return (\n    \u003cStack screenOptions={{ headerShown: false }}\u003e\n      \u003cStack.Screen name=\"(tabs)\" /\u003e\n      \u003cStack.Screen name=\"(auth)\" /\u003e\n      \u003cStack.Screen name=\"posts/[id]\" options={{ headerShown: true, title: 'Post' }} /\u003e\n    \u003c/Stack\u003e\n  );\n}\n```\n\n```tsx\n// app/(tabs)/_layout.tsx\nimport { Tabs } from 'expo-router';\n\nexport default function TabsLayout() {\n  return (\n    \u003cTabs\u003e\n      \u003cTabs.Screen name=\"index\" options={{ title: 'Home' }} /\u003e\n      \u003cTabs.Screen name=\"settings\" options={{ title: 'Settings' }} /\u003e\n    \u003c/Tabs\u003e\n  );\n}\n```\n\n---\n\n## 5. 이동과 파라미터\n\n```tsx\nimport { Link, router, useLocalSearchParams } from 'expo-router';\n\n\u003cLink href={`/posts/${id}`}\u003e열기\u003c/Link\u003e\n\nrouter.push(`/posts/${id}`);\nrouter.replace('/login');\nrouter.back();\n```\n\n```tsx\n// app/posts/[id].tsx\nexport default function PostDetail() {\n  const { id } = useLocalSearchParams\u003c{ id: string }\u003e();\n  return \u003cText\u003ePost {id}\u003c/Text\u003e;\n}\n```\n\n객체 전달이 필요하면 쿼리/전역 상태/미리 fetch된 캐시를 쓰고, 거대한 객체를 라우트 params에 넣지 않는다.\n\nTyped routes: Expo Router의 typed routes 옵션을 켜면 `href` 자동완성이 좋아진다.\n\n---\n\n## 6. 인증 가드 레이아웃\n\n```tsx\n// app/_layout.tsx 개념\nconst { user, isLoading } = useAuth();\n\nif (isLoading) return \u003cSplash /\u003e;\n\nreturn (\n  \u003cStack\u003e\n    \u003cStack.Protected guard={!!user}\u003e\n      \u003cStack.Screen name=\"(tabs)\" /\u003e\n    \u003c/Stack.Protected\u003e\n    \u003cStack.Protected guard={!user}\u003e\n      \u003cStack.Screen name=\"(auth)\" /\u003e\n    \u003c/Stack.Protected\u003e\n  \u003c/Stack\u003e\n);\n```\n\n(버전별 API는 `Redirect` + 세그먼트 분기로도 구현 가능)\n\n```tsx\nif (!user) return \u003cRedirect href=\"/login\" /\u003e;\n```\n\n---\n\n## 7. 딥링크\n\n`app.json`의 `scheme`: `myapp://posts/1`  \nUniversal Links / App Links는 EAS·도메인 검증이 필요 (운영 배포 문서 참고).\n\n---\n\n## 연습\n\n1. `FlatList`로 50개 이상 아이템 리스트를 만든다.\n2. pull-to-refresh와 empty 상태를 구현한다.\n3. Expo Router로 탭 + 상세(`[id]`) 화면을 연결한다.\n4. 로그인 여부에 따라 `(auth)` / `(tabs)`로 분기한다."])</script><script>self.__next_f.push([1,"f:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"리스트·네비게이션 — FlatList와 Expo Router\\\",\\\"description\\\":\\\"가상화 리스트로 성능을 지키고, Expo Router로 타입 안전한 화면 이동을 구성한다.\\\",\\\"datePublished\\\":\\\"2026-08-26\\\",\\\"url\\\":\\\"https://blog.kaisa.co.kr/posts/react-native-04/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa Blog\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa Blog\\\",\\\"url\\\":\\\"https://blog.kaisa.co.kr/\\\"},\\\"articleSection\\\":\\\"react-native\\\",\\\"keywords\\\":\\\"react-native\\\"},{\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Kaisa Blog\\\",\\\"item\\\":\\\"https://blog.kaisa.co.kr/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Posts\\\",\\\"item\\\":\\\"https://blog.kaisa.co.kr/posts/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"리스트·네비게이션 — FlatList와 Expo Router\\\",\\\"item\\\":\\\"https://blog.kaisa.co.kr/posts/react-native-04/\\\"}]}]}\"}}],[\"$\",\"main\",null,{\"className\":\"blog-main\",\"children\":[\"$\",\"div\",null,{\"className\":\"site-shell\",\"children\":[\"$\",\"article\",null,{\"className\":\"blog-post site-shell__inner\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/posts/\",\"className\":\"blog-post__back\",\"children\":\"← 목록으로\"}],[\"$\",\"div\",null,{\"className\":\"blog-post__meta\",\"children\":[[\"$\",\"
