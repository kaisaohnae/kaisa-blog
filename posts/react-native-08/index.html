 void } | null\u003e(null);\n\nexport function ThemeProvider({ children }: { children: React.ReactNode }) {\n  const [mode, setMode] = useState\u003c'light' | 'dark'\u003e('light');\n  const value = useMemo(\n    () =\u003e ({ mode, toggle: () =\u003e setMode((m) =\u003e (m === 'light' ? 'dark' : 'light')) }),\n    [mode],\n  );\n  return \u003cThemeContext.Provider value={value}\u003e{children}\u003c/ThemeContext.Provider\u003e;\n}\n```\n\n주의: value가 자주 바뀌면 구독 컴포넌트가 전부 리렌더.  \n고빈도 상태(스크롤 위치, 매 키입력)는 Context에 두지 말 것.\n\n---\n\n## 3. Zustand — 가벼운 전역\n\n```bash\nnpx expo install zustand\n```\n\n```tsx\nimport { create } from 'zustand';\nimport { persist, createJSONStorage } from 'zustand/middleware';\nimport AsyncStorage from '@react-native-async-storage/async-storage';\n\ntype CartState = {\n  items: Record\u003cstring, number\u003e;\n  add: (id: string) =\u003e void;\n  clear: () =\u003e void;\n};\n\nexport const useCart = create\u003cCartState\u003e()(\n  persist(\n    (set) =\u003e ({\n      items: {},\n      add: (id) =\u003e\n        set((s) =\u003e ({ items: { ...s.items, [id]: (s.items[id] ?? 0) + 1 } })),\n      clear: () =\u003e set({ items: {} }),\n    }),\n    {\n      name: 'cart',\n      storage: createJSONStorage(() =\u003e AsyncStorage),\n    },\n  ),\n);\n```\n\n민감 토큰은 AsyncStorage persist 금지 → SecureStore + Auth 흐름.\n\n셀렉터로 리렌더 최소화:\n\n```tsx\nconst count = useCart((s) =\u003e s.items[id] ?? 0);\n```\n\n---\n\n## 4. 폴더 구조 제안 (Feature-first)\n\n```\nsrc/\n├── app/                 # expo-router 엔트리 (또는 루트 app/)\n├── features/\n│   ├── auth/\n│   │   ├── api.ts\n│   │   ├── hooks.ts\n│   │   ├── screens/\n│   │   └── components/\n│   ├── posts/\n│   └── cart/\n├── components/          # 디자인 시스템급 공용 UI\n├── lib/                 # api client, storage\n├── constants/\n└── types/\n```\n\n화면 파일은 얇게, 비즈니스는 `features/*`로.\n\n---\n\n## 5. 컴포넌트 설계 원칙\n\n- Presentational vs Container를 과도히 나누기보다 **훅으로 로직 분리**\n- props drilling 3단 넘어가면 합성·훅·작은 store 검토\n- 날짜/가격 포맷은 `lib/format.ts`로 일원화\n- 매직 넘버·카피 문자열 상수화 (i18n 대비)\n\n```tsx\n// features/posts/hooks.ts\nexport function usePost(id: string) {\n  return useQuery({\n    queryKey: ['posts', id],\n    queryFn: () =\u003e api\u003cPost\u003e(`/posts/${id}`),\n  });\n}\n```\n\n---\n\n## 6. 에러 경계\n\n```tsx\nimport { ErrorBoundary } from 'react-error-boundary';\n\n\u003cErrorBoundary FallbackComponent={ScreenError} onReset={resetApp}\u003e\n  \u003cApp /\u003e\n\u003c/ErrorBoundary\u003e\n```\n\n치명 렌더 크래시가 흰 화면으로 끝나지 않게.  \n라우트 단위로 경계를 나누면 전체가 죽지 않는다.\n\n---\n\n## 7. 환경·설정\n\n```ts\n// app.config.ts\nimport { ExpoConfig, ConfigContext } from 'expo/config';\n\nexport default ({ config }: ConfigContext): ExpoConfig =\u003e ({\n  ...config,\n  name: 'MyApp',\n  slug: 'my-app',\n  extra: {\n    appEnv: process.env.APP_ENV ?? 'development',\n    eas: { projectId: '...' },\n  },\n});\n```\n\ndev / staging / prod 번들 ID·API URL을 분리한다 (EAS profile).\n\n---\n\n## 8. 품질 도구\n\n```bash\nnpx expo install eslint prettier\n# 또는 expo lint\n```\n\n- TypeScript `strict`\n- ESLint + import order\n- absolute import (`@/`)\n- Husky + lint-staged (팀)\n\n---\n\n## 연습\n\n1. Feature 폴더로 `posts` 모듈을 재배치한다.\n2. Zustand로 장바구니(또는 최근 검색어)를 persist한다.\n3. Theme Context로 라이트/다크를 토글한다.\n4. 라우트 단위 ErrorBoundary를 추가한다."])</script><script>self.__next_f.push([1,"f:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"상태 관리·아키텍처·모듈화\\\",\\\"description\\\":\\\"전역 상태를 최소화하고, Feature 단위 구조와 Zustand/Context 선택 기준을 익힌다.\\\",\\\"datePublished\\\":\\\"2026-08-26\\\",\\\"url\\\":\\\"https://blog.kaisa.co.kr/posts/react-native-08/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa Blog\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa Blog\\\",\\\"url\\\":\\\"https://blog.kaisa.co.kr/\\\"},\\\"articleSection\\\":
