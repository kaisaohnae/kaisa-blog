hildren\":[\"$\",\"$L20\",null,{\"children\":[\"$\",\"$1b\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L21\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n16:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/3kj_mwa7ypr_n.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n17:[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/3nvq7s-jdhde9.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"22:I[55489,[\"/_next/static/chunks/22o2e8l1llles.js\",\"/_next/static/chunks/18x8cntxsqa7x.js\",\"/_next/static/chunks/1zc2_-8y7cq_w.js\",\"/_next/static/chunks/23376vl-bxl5y.js\",\"/_next/static/chunks/3iv45donp3zt0.js\",\"/_next/static/chunks/1jf0sqznr2yfq.js\",\"/_next/static/chunks/1p-4hr1yu7b2y.js\"],\"default\"]\n23:T1b54,"])</script><script>self.__next_f.push([1,"# REST API 설계 — Validation, Problem Details, RestClient\n\n\u003e 요약: Spring MVC 기반 REST API를 명확한 계약·검증·에러 응답·HTTP 클라이언트로 설계한다.\n\n---\n\n---\n\n## 1. 컨트롤러의 역할\n\n컨트롤러는 **HTTP 어댑터**다.\n\n- 요청 파싱 / 검증\n- 애플리케이션 서비스 호출\n- 응답 상태코드·본문 매핑\n\n비즈니스 규칙을 컨트롤러에 넣지 않는다.\n\n```java\n@RestController\n@RequestMapping(\"/api/users\")\n@RequiredArgsConstructor\npublic class UserController {\n\n    private final UserService userService;\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    public UserResponse create(@Valid @RequestBody CreateUserRequest request) {\n        return userService.create(request);\n    }\n\n    @GetMapping(\"/{id}\")\n    public UserResponse get(@PathVariable Long id) {\n        return userService.get(id);\n    }\n}\n```\n\n---\n\n## 2. DTO는 record로\n\n```java\npublic record CreateUserRequest(\n        @NotBlank @Email String email,\n        @NotBlank @Size(max = 50) String name\n) {}\n\npublic record UserResponse(Long id, String email, String name) {}\n```\n\n엔티티를 그대로 노출하지 말 것. 영속성 모델과 API 계약은 분리한다.\n\n---\n\n## 3. Validation\n\n의존성: `spring-boot-starter-validation`\n\n| 어노테이션 | 용도 |\n|-----------|------|\n| `@NotNull` / `@NotBlank` | 필수 |\n| `@Email` | 이메일 |\n| `@Size` / `@Min` / `@Max` | 길이·범위 |\n| `@Pattern` | 정규식 |\n| `@Valid` | 중첩 객체 검증 |\n| `@Validated` | 그룹/메서드 검증 |\n\n쿼리 파라미터 검증:\n\n```java\n@GetMapping\npublic Page\u003cUserResponse\u003e search(\n        @RequestParam @Min(0) int page,\n        @RequestParam @Min(1) @Max(100) int size\n) { ... }\n```\n\n클래스에 `@Validated`를 붙여야 메서드 파라미터 검증이 동작한다.\n\n---\n\n## 4. 상태 코드 가이드\n\n| 상황 | 코드 |\n|------|------|\n| 조회 성공 | 200 |\n| 생성 성공 | 201 + `Location` 헤더 |\n| 삭제/수정 성공(본문 없음) | 204 |\n| 검증 실패 | 400 |\n| 인증 필요 | 401 |\n| 권한 없음 | 403 |\n| 없음 | 404 |\n| 충돌(중복 등) | 409 |\n| 서버 오류 | 500 |\n\n```java\n@PostMapping\npublic ResponseEntity\u003cUserResponse\u003e create(@Valid @RequestBody CreateUserRequest request) {\n    UserResponse created = userService.create(request);\n    URI location = URI.create(\"/api/users/\" + created.id());\n    return ResponseEntity.created(location).body(created);\n}\n```\n\n---\n\n## 5. Problem Details (RFC 7807) — 현대 에러 응답\n\nSpring Boot 3 / Spring Framework 6는 `ProblemDetail`을 지원한다.\n\n```java\n@RestControllerAdvice\npublic class GlobalExceptionHandler {\n\n    @ExceptionHandler(UserNotFoundException.class)\n    ResponseEntity\u003cProblemDetail\u003e handleNotFound(UserNotFoundException ex) {\n        ProblemDetail problem = ProblemDetail.forStatusAndDetail(\n                HttpStatus.NOT_FOUND, ex.getMessage());\n        problem.setTitle(\"User Not Found\");\n        problem.setProperty(\"userId\", ex.getUserId());\n        return ResponseEntity.status(HttpStatus.NOT_FOUND).body(problem);\n    }\n\n    @ExceptionHandler(MethodArgumentNotValidException.class)\n    ResponseEntity\u003cProblemDetail\u003e handleValidation(MethodArgumentNotValidException ex) {\n        ProblemDetail problem = ProblemDetail.forStatus(HttpStatus.BAD_REQUEST);\n        problem.setTitle(\"Validation Failed\");\n        problem.setProperty(\"errors\", ex.getBindingResult().getFieldErrors().stream()\n                .map(fe -\u003e Map.of(\"field\", fe.getField(), \"message\", fe.getDefaultMessage()))\n                .toList());\n        return ResponseEntity.badRequest().body(problem);\n    }\n}\n```\n\n응답 예시:\n\n```json\n{\n  \"type\": \"about:blank\",\n  \"title\": \"Validation Failed\",\n  \"status\": 400,\n  \"detail\": null,\n  \"errors\": [\n    { \"field\": \"email\", \"message\": \"must be a well-formed email address\" }\n  ]\n}\n```\n\n클라이언트와 에러 계약을 통일하면 프론트/모바일 대응이 쉬워진다.\n\n---\n\n## 6. API 버전 전략\n\n실무에서 많이 쓰는 방식:\n\n1. **URL 버전**: `/api/v1/users`\n2. **헤더 버전**: `Accept: application/vnd.example.v1+json`\n3. **하위 호환 진화**: 필드 추가만 하고 breaking change는 새 버전\n\n중소규모에서는 URL 버전이 운영하기 쉽다.\n\n---\n\n## 7. 페이지네이션·정렬\n\nSpring Data의 `Pageable` 활용:\n\n```java\n@GetMapping\npublic Page\u003cUserResponse\u003e list(Pageable pageable) {\n    return userService.list(pageable);\n}\n```\n\n```\nGET /api/users?page=0\u0026size=20\u0026sort=createdAt,desc\n```\n\n응답에 `content`, `totalElements`, `totalPages`가 포함된다.  \n외부 공개 API라면 커스텀 envelope(`items`, `page`, `size`, `total`)로 감싸는 팀도 많다.\n\n---\n\n## 8. RestClient (Boot 3.2+) — RestTemplate 대체\n\n`RestTemplate`은 유지보수 모드에 가깝고, 동기 HTTP는 **`RestClient`** 가 권장된다.  \n리액티브면 `WebClient`.\n\n```java\n@Configuration\npublic class HttpClientConfig {\n\n    @Bean\n    RestClient paymentRestClient(RestClient.Builder builder, PaymentProperties props) {\n        return builder\n                .baseUrl(props.baseUrl())\n                .defaultHeader(HttpHeaders.CONTENT_TYPE, MediaType.APPLICATION_JSON_VALUE)\n                .requestFactory(new JdkClientHttpRequestFactory())\n                .build();\n    }\n}\n```\n\n```java\npublic PaymentResponse charge(ChargeRequest request) {\n    return paymentRestClient.post()\n            .uri(\"/charges\")\n            .body(request)\n            .retrieve()\n            .onStatus(HttpStatusCode::is4xxClientError, (req, res) -\u003e {\n                throw new PaymentRejectedException(\"payment rejected\");\n            })\n            .body(PaymentResponse.class);\n}\n```\n\n타임아웃·재시도는 HTTP 클라이언트 설정 + Resilience4j와 함께 설계한다.\n\n---\n\n## 9. 콘텐츠 협상·JSON 설정\n\n```yaml\nspring:\n  jackson:\n    default-property-inclusion: non_null\n    serialization:\n      write-dates-as-timestamps: false\n    time-zone: Asia/Seoul\n```\n\n날짜는 ISO-8601 문자열(`OffsetDateTime`)을 권장한다.\n\n---\n\n## 10. OpenAPI 문서화\n\n`springdoc-openapi` 사용 예:\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eorg.springdoc\u003c/groupId\u003e\n  \u003cartifactId\u003espringdoc-openapi-starter-webmvc-ui\u003c/artifactId\u003e\n  \u003cversion\u003e2.7.0\u003c/version\u003e\n\u003c/dependency\u003e\n```\n\n- Swagger UI: `/swagger-ui.html`\n- OpenAPI JSON: `/v3/api-docs`\n\nDTO/컨트롤러에 `@Operation`, `@Schema`로 계약을 보강하면 협업 비용이 줄어든다.\n\n---\n\n## 11. 보안·설계 팁\n\n- 민감 필드는 응답에서 제외 (password, token 등)\n- IDOR 방지를 위해 리소스 접근 권한 검사\n- idempotency-key (결제/생성 API)\n- rate limiting은 게이트웨이 또는 필터에서\n\n---\n\n## 연습\n\n1. `POST /api/products` + Bean Validation + 201 Created를 구현한다.\n2. 존재하지 않는 상품 조회 시 `ProblemDetail` 404를 반환한다.\n3. `RestClient`로 공개 API(예: JSONPlaceholder)를 호출하는 서비스를 만든다.\n4. springdoc으로 Swagger UI에서 API를 확인한다."])</script><script>self.__next_f.push([1,"19:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"REST API 설계 — Validation, Problem Details, RestClient\\\",\\\"description\\\":\\\"Spring MVC 기반 REST API를 명확한 계약·검증·에러 응답·HTTP 클라이언트로 설계한다.\\\",\\\"datePublished\\\":\\\"2026-08-26\\\",\\\"url\\\":\\\"https://blog.kaisa.co.kr/posts/spring-boot-03/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa Blog\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa Blog\\
