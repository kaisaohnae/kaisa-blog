t/demo-*.jar app.jar\nEXPOSE 8080\nENTRYPOINT [\"java\",\"-XX:MaxRAMPercentage=75.0\",\"-jar\",\"/app/app.jar\"]\n```\n\n개선 팁:\n\n- **Layered JAR**로 의존성 레이어 캐시 → 이미지 빌드/배포 가속\n- distroless / chiseled 이미지로 공격면 축소\n- non-root 사용자로 실행\n\n### Layertools 예시\n\n```bash\njava -Djarmode=layertools -jar app.jar extract\n```\n\nDockerfile에서 `dependencies` → `spring-boot-loader` → `application` 순으로 COPY.\n\n---\n\n## 4. Docker Compose (로컬 통합)\n\n```yaml\nservices:\n  app:\n    build: .\n    ports:\n      - \"8080:8080\"\n    environment:\n      SPRING_PROFILES_ACTIVE: local\n      DB_URL: jdbc:postgresql://db:5432/demo\n      DB_USER: demo\n      DB_PASSWORD: demo\n    depends_on:\n      db:\n        condition: service_healthy\n  db:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_DB: demo\n      POSTGRES_USER: demo\n      POSTGRES_PASSWORD: demo\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U demo\"]\n      interval: 5s\n      timeout: 5s\n      retries: 5\n```\n\n---\n\n## 5. Kubernetes 최소 스펙 포인트\n\n```yaml\nlivenessProbe:\n  httpGet:\n    path: /actuator/health/liveness\n    port: 8081\nreadinessProbe:\n  httpGet:\n    path: /actuator/health/readiness\n    port: 8081\nresources:\n  requests:\n    cpu: \"250m\"\n    memory: \"512Mi\"\n  limits:\n    memory: \"768Mi\"\n```\n\n- readiness 실패 → 트래픽 차단\n- liveness 실패 → 컨테이너 재시작\n- 메모리 limit 없이 JVM만 올리면 OOMKill 위험이 크다\n\n---\n\n## 6. CI/CD 파이프라인 골격\n\n1. 테스트 (단위 + Testcontainers IT)\n2. 정적 분석 (SpotBugs, Checkstyle, Spotless)\n3. SCA (의존성 취약점: Trivy, Dependabot, Snyk)\n4. 이미지 빌드·서명·스캔\n5. 스테이징 배포 → 스모크 테스트\n6. 프로덕션 (카나리/블루그린)\n\n`main`에 직접 푸시보다 PR + 필수 체크가 안전하다.\n\n---\n\n## 7. GraalVM Native Image\n\nBoot 3는 Native 지원이 정식이다.\n\n```bash\n./mvnw -Pnative native:compile\n```\n\n장점:\n\n- 매우 빠른 기동\n- 낮은 메모리\n\n비용:\n\n- 빌드 시간·복잡도 증가\n- 리플렉션/프록시 설정 필요 가능\n- 일부 라이브러리 비호환\n\n서버리스·스케일-to-zero, CLI, 사이드카에 특히 매력적.  \n상시 트래픽 큰 모놀리스는 JVM + CDS/AppCDS나 일반 최적화로도 충분한 경우가 많다.\n\n---\n\n## 8. 로깅·감사·컴플라이언스\n\n- 액세스 로그 / 감사 로그 분리\n- PII 마스킹\n- 보존 기간 정책\n- 시간대: 서버는 UTC, 표시만 로컬\n\n---\n\n## 9. 프로덕션 체크리스트\n\n### 보안\n\n- [ ] 최신 패치된 Base Image / JDK\n- [ ] Actuator·Swagger 노출 최소화\n- [ ] 시크릿 미커밋\n- [ ] HTTPS / 안전한 CORS\n- [ ] 의존성 취약점 스캔\n\n### 신뢰성\n\n- [ ] graceful shutdown\n- [ ] DB 마이그레이션(Flyway) 자동화\n- [ ] 타임아웃·재시도·서킷브레이커\n- [ ] 헬스 프로브 분리\n- [ ] 백업·복구 훈련 (DB)\n\n### 관측\n\n- [ ] 메트릭 + 알람 (5xx, p99, DB 풀)\n- [ ] 트레이스 샘플링\n- [ ] 구조화 로그 + traceId\n- [ ] 대시보드·런북\n\n### 성능\n\n- [ ] 부하 테스트 결과 문서화\n- [ ] 커넥션 풀·JVM 메모리 검증\n- [ ] 캐시/인덱스 점검\n\n---\n\n## 문서 목록\n\n| 주제 | 한 줄 |\n|------|------|\n| Boot 3 + Java 21 | 프로젝트·프로파일·현대 Java |\n| IoC / Bean | 생성자 주입·타입세이프 설정 |\n| REST | Validation·ProblemDetail·RestClient |\n| JPA | 트랜잭션·N+1·Flyway |\n| Security 6 | FilterChain·JWT/OAuth2 |\n| Test | 슬라이스·Testcontainers |\n| Observability | Actuator·Micrometer·OTel |\n| Async | Virtual Threads·이벤트·Kafka |\n| Resilience | 캐시·Resilience4j·성능 |\n| Ops | Docker·K8s·Native·체크리스트 |\n\n---\n\n## 종합 연습\n\n1. 01~09에서 만든 샘플 API를 Dockerfile로 이미지화한다.\n2. Compose로 app + Postgres를 띄운다.\n3. Actuator health가 healthy인지 확인한다.\n4. 프로덕션 체크리스트를 자신의 앱에 적용해 통과/미통과를 표시한다.\n5. (선택) Native Image 빌드 후 기동 시간을 JVM jar와 비교한다.\n\n---\n\n## 정리\n\nSpring Boot의 최신 기법은 “새 어노테이션 암기”보다 **운영 가능한 기본기**에 가깝다.\n\n- 명확한 API 계약과 에러\n- 안전한 트랜잭션·스키마 관리\n- 측정 가능한 시스템\n- 실패를 전제로 한 타임아웃/격리\n- 재현 가능한 빌드·배포\n\n이 문서들을 바탕으로, 팀 도메인에 맞게 깊이를 더하면 실무 Spring Boot 역량이 빠르게 쌓인다.\n\n추가로 파고들 주제: Spring Authorization Server, Spring Modulith, Spring Batch, R2DBC, Spring Cloud Gateway, GraalVM 심화, ArchUnit 기반 아키텍처 테스트."])</script><script>self.__next_f.push([1,"19:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"운영 배포 — Docker, 설정, Native Image, 프로덕션 체크리스트\\\",\\\"description\\\":\\\"로컬에서 잘 되는 앱을 안전하게 빌드·배포·운영하는 최신 기본기를 정리한다.\\\",\\\"datePublished\\\":\\\"2026-08-26\\\",\\\"url\\\":\\\"https://blog.kaisa.
