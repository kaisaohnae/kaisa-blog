\"}]]}]\n18:T13e2,"])</script><script>self.__next_f.push([1,"# Laravel 11+와 현대 PHP 시작하기\n\n\u003e 요약: Laravel 11/12 + PHP 8.2/8.3 기준으로 프로젝트를 세팅하고, 슬림해진 구조와 최신 관례를 이해한다.\n\n---\n\n---\n\n## 1. 왜 지금 Laravel인가\n\nLaravel은 PHP 웹 앱의 사실상 표준에 가깝다. 최근 버전은 **골격은 얇게, 기능은 패키지로** 가는 방향이다.\n\n| 항목 | Laravel 8~9 | Laravel 11+ |\n|------|-------------|-------------|\n| 기본 구조 | `Http/Kernel`, 다수 설정 파일 | **슬림 스켈레톤**, `bootstrap/app.php` 중심 |\n| PHP | 8.0+ | **8.2+** (8.3 권장) |\n| 라우트 | `RouteServiceProvider` | `bootstrap/app.php`에서 설정 |\n| 미들웨어 | Kernel 등록 | `bootstrap/app.php` / 자동 발견 |\n| 테스트 | PHPUnit 기본 | **Pest** 옵션이 매우 흔함 |\n\n실무 기본선: **PHP 8.3 + Laravel 11/12 + Composer 2**.\n\n---\n\n## 2. 설치\n\n```bash\ncomposer create-project laravel/laravel demo\n# 또는\nlaravel new demo\n\ncd demo\ncp .env.example .env\nphp artisan key:generate\nphp artisan serve\n```\n\n요구 사항: PHP, Composer, DB(SQLite/MySQL/PostgreSQL), Node(프론트 빌드 시).\n\n로컬 올인원:\n\n```bash\n# Laravel Sail (Docker)\nphp artisan sail:install\n./vendor/bin/sail up -d\n```\n\n---\n\n## 3. Laravel 11+ 디렉터리 감각\n\n```\napp/\n├── Http/Controllers/\n├── Models/\n├── Providers/          # 거의 AppServiceProvider만\n└── ...\nbootstrap/\n├── app.php             # ★ 앱 구성의 중심\n└── providers.php\nconfig/                 # 필요한 것만 publish\ndatabase/\n├── migrations/\n├── seeders/\n└── factories/\nroutes/\n├── web.php\n├── console.php\n└── api.php             # 설치 방식에 따라 추가\nresources/\n├── views/\n├── css/\n└── js/\ntests/\n├── Feature/\n└── Unit/\n```\n\n`bootstrap/app.php` 예시 개념:\n\n```php\nreturn Application::configure(basePath: dirname(__DIR__))\n    -\u003ewithRouting(\n        web: __DIR__.'/../routes/web.php',\n        api: __DIR__.'/../routes/api.php',\n        commands: __DIR__.'/../routes/console.php',\n        health: '/up',\n    )\n    -\u003ewithMiddleware(function (Middleware $middleware) {\n        //\n    })\n    -\u003ewithExceptions(function (Exceptions $exceptions) {\n        //\n    })-\u003ecreate();\n```\n\n---\n\n## 4. `.env`와 설정\n\n```env\nAPP_NAME=Demo\nAPP_ENV=local\nAPP_DEBUG=true\nAPP_URL=http://localhost\n\nDB_CONNECTION=sqlite\n# 또는 mysql/pgsql\n\nCACHE_STORE=database\nQUEUE_CONNECTION=database\nSESSION_DRIVER=database\n```\n\n규칙:\n\n- 시크릿은 `.env`만, **커밋 금지**\n- 코드에서는 `config('app.name')` / `env()`는 **config 파일 안에서만**\n- 환경별: `APP_ENV=production`이면 `APP_DEBUG=false` 필수\n\n```bash\nphp artisan config:cache   # 운영\nphp artisan config:clear   # 로컬 변경 후\n```\n\n---\n\n## 5. PHP 8.2+에서 특히 쓸 만한 문법\n\n### readonly / constructor property promotion\n\n```php\nclass CreateUserData\n{\n    public function __construct(\n        public readonly string $email,\n        public readonly string $name,\n    ) {}\n}\n```\n\n### Enum\n\n```php\nenum OrderStatus: string\n{\n    case Pending = 'pending';\n    case Paid = 'paid';\n    case Cancelled = 'cancelled';\n}\n```\n\n### Named arguments, match, nullsafe\n\n```php\n$statusLabel = match ($order-\u003estatus) {\n    OrderStatus::Pending =\u003e '대기',\n    OrderStatus::Paid =\u003e '결제완료',\n    OrderStatus::Cancelled =\u003e '취소',\n};\n```\n\nLaravel의 **Form Request, DTO, Enum cast**와 잘 맞는다.\n\n---\n\n## 6. Artisan — 매일 쓰는 명령\n\n```bash\nphp artisan list\nphp artisan make:model Post -mfs   # model + migration + factory + seeder\nphp artisan make:controller PostController --resource\nphp artisan migrate\nphp artisan route:list\nphp artisan tinker\n```\n\n`tinker`로 Eloquent/컨테이너를 바로 실험하는 습관이 학습 속도를 올린다.\n\n---\n\n## 7. 첫 라우트\n\n```php\n// routes/web.php\nuse Illuminate\\Support\\Facades\\Route;\n\nRoute::get('/api/hello', function () {\n    return response()-\u003ejson(['message' =\u003e 'Hello, Laravel']);\n});\n```\n\n```bash\ncurl http://127.0.0.1:8000/api/hello\n```\n\n---\n\n## 8. 패키지 생태계\n\n| 목적 | 대표 |\n|------|------|\n| 인증 UI | Breeze / Fortify / Jetstream |\n| API 토큰 | Sanctum |\n| 권한 | Policy / Gate (내장), Spatie Permission |\n| 관리자 | Filament |\n| 프론트 | Blade, Livewire, Inertia |\n| 큐 모니터링 | Horizon |\n| 고성능 | Octane |\n\n처음부터 다 깔지 말고, API면 Sanctum, SPA면 Breeze+Inertia 식으로 고른다.\n\n---\n\n## 9. 최신 기법 체크리스트\n\n- [ ] PHP 8.3 + Laravel 11/12\n- [ ] `.env` / `config()` 규약 준수\n- [ ] `bootstrap/app.php` 구조 이해\n- [ ] Enum·readonly로 도메인 명확화\n- [ ] Sail 또는 통일된 로컬 환경\n- [ ] `/up` 헬스 엔드포인트 인지\n\n---\n\n## 연습\n\n1. Laravel 프로젝트를 만들고 `/up`과 커스텀 JSON 라우트를 확인한다.\n2. `.env`에서 SQLite ↔ MySQL/Postgres 중 하나로 DB를 연결한다.\n3. `OrderStatus` Enum을 만들어 `tinker`에서 출력해 본다.\n4. `php artisan route:list`로 등록된 라우트를 확인한다.\n"])</script><script>self.__next_f.push([1,"19:T142f,"])</script><script>self.__next_f.push([1,"# 라우팅·미들웨어·컨트롤러 — 요청 생명주기\n\n\u003e 요약: 요청이 라우트 → 미들웨어 → 컨트롤러로 흐르는 구조를 이해하고, 리소스·단일 액션·미들웨어 그룹을 실무처럼 쓴다.\n\n---\n\n---\n\n## 1. 요청 생명주기 (요약)\n\n1. `public/index.php`\n2. 컨테이너 / HTTP 커널(부트스트랩)\n3. 글로벌·라우트 미들웨어\n4. 라우트 매칭\n5. 컨트롤러 / Closure\n6. 응답 (View, JSON, Redirect, Stream…)\n\n컨트롤러는 **얇게**, 비즈니스는 Action/Service로 빼는 편이 유지보수에 유리하다.\n\n---\n\n## 2. 라우트 기본\n\n```php\nRoute::get('/posts', [PostController::class, 'index']);\nRoute::post('/posts', [PostController::class, 'store']);\nRoute::get('/posts/{post}', [PostController::class, 'show']);\n```\n\n### 라우트 파라미터 \u0026 바인딩\n\n```php\nRoute::get('/posts/{post:slug}', [PostController::class, 'show']);\n```\n\nEloquent 모델이면 기본적으로 `{post}` → `Post::findOrFail($id)`.  \n커스텀 키는 `getRouteKeyName()` 또는 `{post:slug}`.\n\n### 리소스 라우트\n\n```php\nRoute::resource('posts', PostController::class);\nRoute::apiResource('posts', PostController::class); // create/edit 뷰 제외\n```\n\n```bash\nphp artisan route:list --path=posts\n```\n\n---\n\n## 3. 라우트 그룹\n\n```php\nRoute::middleware(['auth', 'verified'])\n    -\u003eprefix('dashboard')\n    -\u003ename('dashboard.')\n    -\u003egroup(function () {\n        Route::get('/', [DashboardController::class, 'index'])-\u003ename('home');\n        Route::resource('posts', PostController::class);\n    });\n```\n\nAPI:\n\n```php\nRoute::middleware('auth:sanctum')\n    -\u003eprefix('api/v1')\n    -\u003egroup(base_path('routes/api.php'));\n```\n\n버전은 URL(`/api/v1`)로 시작하는 팀이 많다.\n\n---\n\n## 4. 컨트롤러 스타일\n\n### 리소스 컨트롤러\n\n```php\nclass PostController extends Controller\n{\n    public function index() { ... }\n    public function store(StorePostRequest $request) { ... }\n    public function show(Post $post) { ... }\n    public function update(UpdatePostRequest $request, Post $post) { ... }\n    public function destroy(Post $post) { ... }\n}\n```\n\n### Invokable (단일 액션) — 추천 패턴\n\n```php\n// php artisan make:controller PublishPostController --invokable\nclass PublishPostController extends Controller\n{\n    public function __invoke(Post $post)\n    {\n        $post-\u003epublish();\n        return redirect()-\u003eroute('posts.show', $post);\n    }\n}\n\nRoute::post('/posts/{post}/publish', PublishPostController::class);\n```\n\n유스케이스가 분명한 엔드포인트는 invokable이 가독성이 좋다.\n\n### 생성자 주입\n\n```php\nclass PostController extends Controller\n{\n    public function __construct(\n        private readonly PostService $posts,\n    ) {}\n}\n```\n\n---\n\n## 5. 미들웨어\n\nLaravel 내장 예: `auth`, `guest`, `throttle`, `verified`, `can`.\n\n커스텀:\n\n```bash\nphp artisan make:middleware EnsureUserIsAdmin\n```\n\n```php\npublic function handle(Request $request, Closure $next): Response\n{\n    if (! $request-\u003euser()?-\u003eisAdmin()) {\n        abort(403);\n    }\n    return $next($request);\n}\n```\n\n등록 (Laravel 11+):\n\n```php\n-\u003ewithMiddleware(function (Middleware $middleware) {\n    $middleware-\u003ealias([\n        'admin' =\u003e \\App\\Http\\Middleware\\EnsureUserIsAdmin::class,\n    ]);\n})\n```\n\n```php\nRoute::middleware('admin')-\u003egroup(...);\n```\n\n### throttle (Rate limit)\n\n```php\nRoute::middleware('throttle:60,1')-\u003egroup(...);\n// 또는\nRateLimiter::for('api', function (Request $request) {\n    return Limit::perMinute(60)-\u003eby($request-\u003euser()?-\u003eid ?: $request-\u003eip());\n});\n```\n\n로그인·결제 API는 더 빡세게.\n\n---\n\n## 6. 응답 유형\n\n```php\nreturn view('posts.show', compact('post'));\nreturn response()-\u003ejson(['data' =\u003e $post], 201);\nreturn redirect()-\u003eroute('posts.index')-\u003ewith('status', 'created');\nreturn back()-\u003ewithErrors([...]);\nreturn to_route('posts.show', $post);\nreturn response()-\u003estreamDownload(...);\n```\n\nAPI는 상태코드와 본문 계약을 명확히 (API Resource 문서와 함께).\n\n---\n\n## 7. CSRF (web)\n\nBlade 폼:\n\n```html\n\u003cform method=\"POST\" action=\"/posts\"\u003e\n    @csrf\n    ...\n\u003c/form\u003e\n```\n\nSPA/API는 Sanctum SPA cookie 또는 토큰 방식을 사용하고, `web` 미들웨어 그룹의 CSRF 규칙을 이해해야 한다.\n\n---\n\n## 8. 예외·abort\n\n```php\nabort(404);\nabort(403, '권한 없음');\nthrow ValidationException::withMessages(['email' =\u003e '이미 사용 중']);\n```\n\n`bootstrap/app.php`의 `withExceptions`에서 JSON/API 에러 포맷을 통일할 수 있다.\n\n```php\n$exceptions-\u003eshouldRenderJsonWhen(function (Request $request, Throwable $e) {\n    return $request-\u003eis('api/*') || $request-\u003eexpectsJson();\n});\n```\n\n---\n\n## 9. 실무 팁\n\n- `route:list`로 충돌·중복 확인\n- 이름 있는 라우트(`-\u003ename()`)만 링크에 사용 — URL 하드코딩 금지\n- 컨트롤러에 쿼리·트랜잭션 장문 금지 → Service/Action\n- `Route::fallback`으로 SPA/404 처리\n\n---\n\n## 연습\n\n1. `apiResource('posts')`와 `route:list`를 확인한다.\n2. `PublishPostController` invokable을 만든다.\n3. `admin` 미들웨어로 삭제 API를 보호한다.\n4. `throttle:10,1`을 로그인 시도 라우트에 건다.\n"])</script><script>self.__next_f.push([1,"1a:T14b7,"])</script><script>self.__next_f.push([1,"# Eloquent ORM과 데이터베이스\n\n\u003e 요약: 마이그레이션·Eloquent 관계·쿼리·트랜잭션을 올바르게 쓰고, N+1과 스키마 관리 함정을 피한다.\n\n---\n\n---\n\n## 1. 마이그레이션이 진실의 원천\n\n```bash\nphp artisan make:model Post -m\n```\n\n```php\nSchema::create('posts', function (Blueprint $table) {\n    $table-\u003eid();\n    $table-\u003eforeignId('user_id')-\u003econstrained()-\u003ecascadeOnDelete();\n    $table-\u003estring('title');\n    $table-\u003estring('slug')-\u003eunique();\n    $table-\u003etext('body');\n    $table-\u003estring('status')-\u003edefault('draft'); // 또는 enum 컬럼\n    $table-\u003etimestamp('published_at')-\u003enullable();\n    $table-\u003etimestamps();\n    $table-\u003esoftDeletes();\n\n    $table-\u003eindex(['status', 'published_at']);\n});\n```\n\n```bash\nphp artisan migrate\nphp artisan migrate:rollback\nphp artisan migrate:fresh --seed   # 로컬만\n```\n\n운영에서 `migrate:fresh` 금지. 팀과 CI는 **마이그레이션 파일 리뷰**를 필수화한다.\n\n---\n\n## 2. 모델 기본\n\n```php\nclass Post extends Model\n{\n    use SoftDeletes;\n\n    protected $fillable = ['title', 'slug', 'body', 'status', 'published_at'];\n\n    protected function casts(): array\n    {\n        return [\n            'published_at' =\u003e 'datetime',\n            'status' =\u003e OrderStatus::class, // 예: PostStatus Enum\n        ];\n    }\n\n    public function user(): BelongsTo\n    {\n        return $this-\u003ebelongsTo(User::class);\n    }\n\n    public function tags(): BelongsToMany\n    {\n        return $this-\u003ebelongsToMany(Tag::class);\n    }\n}\n```\n\n주의:\n\n- `$guarded = []` 전면 허용은 위험 — mass assignment 신중히\n- 비즈니스 변경은 모델 메서드로 (`publish()`, `archive()`)\n- Accessor/Mutator는 `Attribute::make` 사용\n\n```php\nprotected function title(): Attribute\n{\n    return Attribute::make(\n        set: fn (string $value) =\u003e trim($value),\n    );\n}\n```\n\n---\n\n## 3. 관계 치트시트\n\n| 관계 | 메서드 |\n|------|--------|\n| 1:1 | `hasOne` / `belongsTo` |\n| 1:N | `hasMany` / `belongsTo` |\n| N:N | `belongsToMany` |\n| 다형 | `morphMany` / `morphTo` |\n| hasManyThrough | 중간 테이블 경유 |\n\n```php\n$post-\u003euser;\n$user-\u003eposts()-\u003elatest()-\u003epaginate(20);\n$post-\u003etags()-\u003esync([1, 2, 3]);\n```\n\n---\n\n## 4. 쿼리 빌더 / Eloquent 쿼리\n\n```php\nPost::query()\n    -\u003ewhere('status', PostStatus::Published)\n    -\u003ewhere('published_at', '\u003c=', now())\n    -\u003elatest('published_at')\n    -\u003epaginate(20);\n\nPost::query()\n    -\u003ewhen($search, fn ($q, $search) =\u003e $q-\u003ewhere('title', 'like', \"%{$search}%\"))\n    -\u003eget();\n```\n\n집계:\n\n```php\nUser::withCount('posts')-\u003eget();\nPost::where('user_id', $id)-\u003esum('views');\n```\n\n---\n\n## 5. N+1 문제\n\n나쁜 예:\n\n```php\n$posts = Post::all();\nforeach ($posts as $post) {\n    echo $post-\u003euser-\u003ename; // 매 루프 쿼리\n}\n```\n\n좋은 예:\n\n```php\n$posts = Post::with('user', 'tags')-\u003epaginate(20);\n```\n\n지연 로드가 필요할 때:\n\n```php\n$posts-\u003eload('user');\n```\n\n디버그:\n\n```bash\ncomposer require barryvdh/laravel-debugbar --dev\n# 또는\nDB::listen(fn ($q) =\u003e logger($q-\u003esql, $q-\u003ebindings));\n```\n\n`Model::preventLazyLoading(! app()-\u003eisProduction());`  \n→ 로컬/테스트에서 N+1을 예외로 터뜨리는 현대적 기법.\n\n---\n\n## 6. 스코프\n\n```php\npublic function scopePublished(Builder $query): void\n{\n    $query-\u003ewhere('status', PostStatus::Published)\n          -\u003ewhere('published_at', '\u003c=', now());\n}\n\nPost::published()-\u003elatest()-\u003eget();\n```\n\n글로벌 스코프는 남용하지 않기 (잊고 `withoutGlobalScopes` 하다가 사고).\n\n---\n\n## 7. 트랜잭션\n\n```php\nDB::transaction(function () use ($data) {\n    $order = Order::create([...]);\n    $order-\u003eitems()-\u003ecreateMany($data['items']);\n    $order-\u003euser-\u003edecrement('credits', $data['cost']);\n});\n```\n\n여러 쓰기 + 일관성 필요하면 반드시 트랜잭션.  \n긴 트랜잭션 안에 HTTP/메일 호출 넣지 말 것.\n\n---\n\n## 8. Factory \u0026 Seeder\n\n```php\n// database/factories/PostFactory.php\npublic function definition(): array\n{\n    return [\n        'user_id' =\u003e User::factory(),\n        'title' =\u003e fake()-\u003esentence(),\n        'slug' =\u003e fake()-\u003eunique()-\u003eslug(),\n        'body' =\u003e fake()-\u003eparagraphs(3, true),\n        'status' =\u003e PostStatus::Draft,\n    ];\n}\n\npublic function published(): static\n{\n    return $this-\u003estate(fn () =\u003e [\n        'status' =\u003e PostStatus::Published,\n        'published_at' =\u003e now()-\u003esubDay(),\n    ]);\n}\n```\n\n```php\nPost::factory()-\u003ecount(50)-\u003epublished()-\u003ecreate();\n```\n\n테스트와 데모 데이터에 필수.\n\n---\n\n## 9. 성능·인덱스\n\n- `where`/`orderBy`/`foreignId`에 인덱스\n- `select`로 필요 컬럼만\n- 대량 insert: `insert`, `upsert`, chunk\n- `chunkById` / `lazy`로 메모리 보호\n\n```php\nPost::query()-\u003ewhere('status', 'draft')-\u003echunkById(200, function ($posts) {\n    //\n});\n```\n\n---\n\n## 10. Soft delete \u0026 관찰자\n\n```php\n$post-\u003edelete();      // soft\n$post-\u003eforceDelete();\nPost::withTrashed()-\u003efind($id);\n```\n\n```bash\nphp artisan make:observer PostObserver --model=Post\n```\n\n생성 시 slug 자동 생성 등은 Observer/Model boot에서.\n\n---\n\n## 연습\n\n1. `User` 1:N `Post`, N:N `Tag`를 마이그레이션으로 만든다.\n2. `published` 스코프와 factory state를 구현한다.\n3. `preventLazyLoading`을 켜고 N+1을 `with`로 고친다.\n4. 주문 생성 시 트랜잭션으로 order + items를 저장한다.\n"])</script><script>self.__next_f.push([1,"1b:T15e5,"])</script><script>self.__next_f.push([1,"# Validation, Form Request, API Resource\n\n\u003e 요약: 입력 검증을 Form Request로 분리하고, API Resource로 응답 계약을 안정적으로 만든다.\n\n---\n\n---\n\n## 1. 검증은 컨트롤러에 두지 않기\n\n컨트롤러에 `Validator::make`가 길어지면 읽기 어렵다.  \n**Form Request**가 Laravel다운 기본 해법이다.\n\n```bash\nphp artisan make:request StorePostRequest\n```\n\n```php\nclass StorePostRequest extends FormRequest\n{\n    public function authorize(): bool\n    {\n        return $this-\u003euser()?-\u003ecan('create', Post::class) ?? false;\n    }\n\n    public function rules(): array\n    {\n        return [\n            'title' =\u003e ['required', 'string', 'max:120'],\n            'slug' =\u003e ['nullable', 'alpha_dash', 'max:140', 'unique:posts,slug'],\n            'body' =\u003e ['required', 'string'],\n            'tag_ids' =\u003e ['array'],\n            'tag_ids.*' =\u003e ['integer', 'exists:tags,id'],\n        ];\n    }\n\n    public function messages(): array\n    {\n        return [\n            'title.required' =\u003e '제목을 입력하세요.',\n        ];\n    }\n}\n```\n\n```php\npublic function store(StorePostRequest $request)\n{\n    $data = $request-\u003evalidated();\n    // ...\n}\n```\n\n`authorize()`에서 false면 403. Policy와 연결하면 일관된다.\n\n---\n\n## 2. 자주 쓰는 룰\n\n| 룰 | 의미 |\n|----|------|\n| `required`, `nullable` | 필수/선택 |\n| `string`, `integer`, `boolean`, `array` | 타입 |\n| `email`, `url`, `uuid` | 형식 |\n| `max`, `min`, `between` | 범위 |\n| `unique:table,column` | 유일 |\n| `exists:table,id` | FK 존재 |\n| `confirmed` | password_confirmation |\n| `Rule::enum(PostStatus::class)` | Enum |\n| `Rule::unique(...)-\u003eignore($id)` | 수정 시 유일 |\n\n```php\nuse Illuminate\\Validation\\Rule;\n\n'title' =\u003e ['required', Rule::unique('posts')-\u003eignore($this-\u003epost)],\n'status' =\u003e ['required', Rule::enum(PostStatus::class)],\n```\n\n---\n\n## 3. 준비(prepare) / after 훅\n\n```php\nprotected function prepareForValidation(): void\n{\n    $this-\u003emerge([\n        'slug' =\u003e $this-\u003eslug ?: Str::slug($this-\u003etitle ?? ''),\n    ]);\n}\n\npublic function after(): array\n{\n    return [\n        function (Validator $validator) {\n            if ($this-\u003esomethingDangerous()) {\n                $validator-\u003eerrors()-\u003eadd('body', '허용되지 않는 내용');\n            }\n        },\n    ];\n}\n```\n\n---\n\n## 4. API 검증 실패 응답\n\nJSON 요청 시 기본은 422 + `message` + `errors`.\n\n커스텀이 필요하면 `failedValidation` 또는 전역 Exception 렌더링에서 RFC 7807 비슷하게 맞출 수 있다.\n\n```php\n// bootstrap/app.php withExceptions\n$exceptions-\u003erender(function (ValidationException $e, Request $request) {\n    if ($request-\u003eis('api/*')) {\n        return response()-\u003ejson([\n            'title' =\u003e 'Validation Failed',\n            'status' =\u003e 422,\n            'errors' =\u003e $e-\u003eerrors(),\n        ], 422);\n    }\n});\n```\n\n---\n\n## 5. API Resource — 엔티티 직접 노출 금지\n\n```bash\nphp artisan make:resource PostResource\nphp artisan make:resource PostCollection\n```\n\n```php\nclass PostResource extends JsonResource\n{\n    public function toArray(Request $request): array\n    {\n        return [\n            'id' =\u003e $this-\u003eid,\n            'title' =\u003e $this-\u003etitle,\n            'slug' =\u003e $this-\u003eslug,\n            'status' =\u003e $this-\u003estatus-\u003evalue,\n            'author' =\u003e new UserResource($this-\u003ewhenLoaded('user')),\n            'tags' =\u003e TagResource::collection($this-\u003ewhenLoaded('tags')),\n            'published_at' =\u003e $this-\u003epublished_at?-\u003etoIso8601String(),\n        ];\n    }\n}\n```\n\n```php\nreturn new PostResource($post-\u003eload('user', 'tags'));\nreturn PostResource::collection(Post::with('user')-\u003epaginate());\nreturn (new PostResource($post))\n    -\u003eresponse()\n    -\u003esetStatusCode(201);\n```\n\n`whenLoaded`로 N+1과 불필요 노출을 동시에 줄인다.\n\n---\n\n## 6. 페이지네이션 응답\n\n```php\nreturn PostResource::collection(\n    Post::published()-\u003ewith('user')-\u003elatest()-\u003epaginate(20)\n);\n```\n\n기본 구조에 `data`, `links`, `meta`가 포함된다.  \n프론트와 페이지 계약(`meta.current_page` 등)을 문서화해 두자.\n\n커서 페이지네이션:\n\n```php\nPost::published()-\u003eorderBy('id')-\u003ecursorPaginate(20);\n```\n\n피드형 API에 유리하다.\n\n---\n\n## 7. DTO / Data 객체 (선택)\n\n검증된 배열 대신 타입 있는 객체:\n\n```php\nreadonly class StorePostData\n{\n    public function __construct(\n        public string $title,\n        public string $body,\n        public array $tagIds = [],\n    ) {}\n\n    public static function fromRequest(StorePostRequest $request): self\n    {\n        $v = $request-\u003evalidated();\n        return new self($v['title'], $v['body'], $v['tag_ids'] ?? []);\n    }\n}\n```\n\n또는 Spatie Laravel Data 패키지. 팀 규모가 커질수록 도움이 된다.\n\n---\n\n## 8. 파일 업로드 검증\n\n```php\n'cover' =\u003e ['nullable', 'image', 'max:2048', 'dimensions:max_width=2000'],\n```\n\n```php\n$path = $request-\u003efile('cover')-\u003estore('covers', 's3');\n```\n\n공개 디스크 vs 사설 디스크, 바이러스 스캔·MIME 위조 대응은 운영에서 추가 검토.\n\n---\n\n## 9. 실무 체크리스트\n\n- [ ] 모든 쓰기 API에 Form Request\n- [ ] `validated()`만 사용 (`$request-\u003eall()` 금지에 가깝게)\n- [ ] 응답은 Resource\n- [ ] 비밀번호·토큰·내부 ID 미노출\n- [ ] 생성 201 + Location/본문, 삭제는 204 또는 메시지 통일\n\n---\n\n## 연습\n\n1. `StorePostRequest` / `UpdatePostRequest`를 만든다.\n2. `PostResource`로 show/index 응답을 통일한다.\n3. 검증 실패 JSON 포맷을 커스터마이즈한다.\n4. 이미지 업로드 필드 검증 + `storage` 저장을 구현한다.\n"])</script><script>self.__next_f.push([1,"1c:T1291,"])</script><script>self.__next_f.push([1,"# 인증·인가 — Sanctum, Policy, Gate\n\n\u003e 요약: 세션/토큰 인증을 상황에 맞게 고르고, Policy 기반 인가로 리소스 권한을 명확히 한다.\n\n---\n\n---\n\n## 1. 인증 vs 인가\n\n- **인증(Authentication)**: 누구인가\n- **인가(Authorization)**: 무엇을 할 수 있는가\n\nLaravel은 인증 스캐폴딩 + Gate/Policy 인가가 강점이다.\n\n---\n\n## 2. 무엇을 설치할까\n\n| 상황 | 추천 |\n|------|------|\n| Blade 모노리스 | Breeze (Blade) / Fortify |\n| SPA (Vue/React) + 같은 도메인 | Breeze + Sanctum (쿠키) |\n| 모바일/외부 API | Sanctum Personal Access Token |\n| 풀옵션 팀 기능 | Jetstream |\n| 관리자 패널 | Filament (별도 가드) |\n\n일반적인 API: **Sanctum**이 가장 무난하다. Passport는 OAuth2 풀스펙이 필요할 때.\n\n```bash\ncomposer require laravel/sanctum\nphp artisan install:api   # Laravel 버전에 따라\n# 또는 breeze\ncomposer require laravel/breeze --dev\nphp artisan breeze:install\n```\n\n---\n\n## 3. 세션 기반 (웹)\n\n```php\npublic function store(LoginRequest $request)\n{\n    if (! Auth::attempt($request-\u003eonly('email', 'password'), $request-\u003eboolean('remember'))) {\n        throw ValidationException::withMessages([\n            'email' =\u003e '자격 증명이 올바르지 않습니다.',\n        ]);\n    }\n    $request-\u003esession()-\u003eregenerate();\n    return redirect()-\u003eintended('/dashboard');\n}\n```\n\n로그아웃 시 `invalidate` + `regenerateToken`으로 세션 고정 공격 완화.\n\n비밀번호:\n\n```php\n'password' =\u003e ['required', 'confirmed', Password::defaults()],\n```\n\n`AppServiceProvider`에서 `Password::defaults()` 정책을 강화한다.\n\n---\n\n## 4. Sanctum 토큰 API\n\n```php\n// 로그인\n$user = User::where('email', $request-\u003eemail)-\u003efirst();\n\nif (! $user || ! Hash::check($request-\u003epassword, $user-\u003epassword)) {\n    throw ValidationException::withMessages(['email' =\u003e 'Invalid credentials']);\n}\n\n$token = $user-\u003ecreateToken('mobile', ['posts:read', 'posts:write'])-\u003eplainTextToken;\n\nreturn ['token' =\u003e $token];\n```\n\n```php\nRoute::middleware('auth:sanctum')-\u003egroup(function () {\n    Route::apiResource('posts', PostController::class);\n    Route::get('/me', fn (Request $r) =\u003e new UserResource($r-\u003euser()));\n});\n```\n\n클라이언트: `Authorization: Bearer {token}`\n\n토큰 abilities:\n\n```php\nif ($request-\u003euser()-\u003etokenCan('posts:write')) { ... }\n```\n\n로그아웃/철회:\n\n```php\n$request-\u003euser()-\u003ecurrentAccessToken()-\u003edelete();\n```\n\n---\n\n## 5. SPA 인증 (쿠키 + CSRF)\n\nSanctum SPA 방식:\n\n1. 프론트와 API가 공유 가능한 도메인/서브도메인\n2. `/sanctum/csrf-cookie` 선호출\n3. 로그인 후 쿠키 세션으로 `auth:sanctum`\n\nCORS·`SANCTUM_STATEFUL_DOMAINS`·`SESSION_DOMAIN` 설정이 핵심이다.  \n토큰을 localStorage에 두는 방식보다 **HttpOnly 쿠키 세션**이 XSS에 유리한 경우가 많다.\n\n---\n\n## 6. Gate와 Policy\n\n```bash\nphp artisan make:policy PostPolicy --model=Post\n```\n\n```php\nclass PostPolicy\n{\n    public function viewAny(User $user): bool\n    {\n        return true;\n    }\n\n    public function view(?User $user, Post $post): bool\n    {\n        return $post-\u003eisPublished() || $user?-\u003eid === $post-\u003euser_id;\n    }\n\n    public function update(User $user, Post $post): bool\n    {\n        return $user-\u003eid === $post-\u003euser_id || $user-\u003eisAdmin();\n    }\n\n    public function delete(User $user, Post $post): bool\n    {\n        return $this-\u003eupdate($user, $post);\n    }\n}\n```\n\n컨트롤러:\n\n```php\n$this-\u003eauthorize('update', $post);\n// 또는\nGate::authorize('update', $post);\n```\n\n라우트:\n\n```php\nRoute::put('/posts/{post}', ...)-\u003emiddleware('can:update,post');\n```\n\nBlade:\n\n```blade\n@can('update', $post)\n    \u003ca href=\"...\"\u003e수정\u003c/a\u003e\n@endcan\n```\n\nForm Request `authorize()`와 Policy를 맞춰 두면 구멍이 줄어든다.\n\n---\n\n## 7. 역할·권한 패키지\n\n복잡하면 Spatie Laravel Permission:\n\n- `role`: admin, editor\n- `permission`: posts.publish\n- 팀/가드 단위 분리 가능\n\n처음부터 역할만 문자열로 `if ($user-\u003erole === 'admin')` 난립하면 나중에 고통스럽다.  \nPolicy 안에서 role/permission을 읽게 중앙화하자.\n\n---\n\n## 8. 보안 체크리스트\n\n- [ ] `APP_DEBUG=false` (운영)\n- [ ] HTTPS, Secure/HttpOnly/SameSite 쿠키\n- [ ] 로그인 throttle\n- [ ] 비밀번호 해시(bcrypt/argon2) — 직접 해시 금지, `Hash` 파사드\n- [ ] Mass assignment / IDOR: Policy로 소유권 검사\n- [ ] 이메일 인증·비밀번호 재설정 토큰 만료\n- [ ] 관리자 경로 추가 보호\n\n---\n\n## 연습\n\n1. Sanctum으로 로그인/토큰 발급/보호 API를 만든다.\n2. `PostPolicy`로 본인 글만 수정·삭제 가능하게 한다.\n3. 로그인 라우트에 `throttle`을 건다.\n4. `/me` Resource 응답을 구현한다.\n"])</script><script>self.__next_f.push([1,"1d:T10b4,"])</script><script>self.__next_f.push([1,"# 테스트 — PHPUnit, Pest, Feature 테스트\n\n\u003e 요약: Feature/Unit 테스트로 API·인가·DB 동작을 고정하고, Pest 스타일의 가독성 있는 테스트를 익힌다.\n\n---\n\n---\n\n## 1. Laravel 테스트 종류\n\n| 종류 | 용도 |\n|------|------|\n| Unit | 순수 로직, 컨테이너 최소 |\n| Feature | HTTP + DB + 인증 등 통합에 가깝게 |\n| Browser (Dusk) | 실제 브라우저 E2E — 핵심만 |\n\n기본은 **Feature 테스트로 유스케이스를 잠그고**, 복잡한 도메인만 Unit으로 뺀다.\n\n```bash\nphp artisan make:test PostApiTest\nphp artisan make:test PostServiceTest --unit\nphp artisan test\n# Pest\n./vendor/bin/pest\n```\n\n---\n\n## 2. Pest — 사실상 현대 Laravel 기본 감성\n\n```bash\ncomposer require pestphp/pest --dev\ncomposer require pestphp/pest-plugin-laravel --dev\nphp artisan pest:install\n```\n\n```php\nuse App\\Models\\User;\nuse App\\Models\\Post;\nuse function Pest\\Laravel\\actingAs;\nuse function Pest\\Laravel\\getJson;\nuse function Pest\\Laravel\\postJson;\n\nit('lists published posts', function () {\n    Post::factory()-\u003epublished()-\u003ecount(3)-\u003ecreate();\n    Post::factory()-\u003ecount(2)-\u003ecreate(); // draft\n\n    getJson('/api/posts')\n        -\u003eassertOk()\n        -\u003eassertJsonCount(3, 'data');\n});\n\nit('forbids updating others posts', function () {\n    $author = User::factory()-\u003ecreate();\n    $other = User::factory()-\u003ecreate();\n    $post = Post::factory()-\u003efor($author)-\u003ecreate();\n\n    actingAs($other)\n        -\u003eputJson(\"/api/posts/{$post-\u003eid}\", ['title' =\u003e 'Hack'])\n        -\u003eassertForbidden();\n});\n```\n\nPHPUnit 스타일도 여전히 완벽히 지원된다. 팀 합의만 맞으면 된다.\n\n---\n\n## 3. HTTP 断言 핵심\n\n```php\n$response-\u003eassertOk();\n$response-\u003eassertCreated();\n$response-\u003eassertNoContent();\n$response-\u003eassertUnauthorized();\n$response-\u003eassertForbidden();\n$response-\u003eassertUnprocessable();\n$response-\u003eassertJsonPath('data.email', 'a@b.com');\n$response-\u003eassertJsonStructure(['data' =\u003e [['id', 'title']]]);\n$response-\u003eassertJsonValidationErrors(['email']);\n```\n\n---\n\n## 4. DB와 RefreshDatabase\n\n```php\nuses(RefreshDatabase::class);\n```\n\n매 테스트 후 마이그레이션 기반으로 깔끔한 DB.  \n느리면 `DatabaseTransactions` 또는 parallel testing 검토.\n\n```bash\nphp artisan test --parallel\n```\n\nFactory를 테스트의 기본 데이터 소스로 쓴다. 손으로 `insert` 나열하지 않기.\n\n---\n\n## 5. 인증 헬퍼\n\n```php\nactingAs($user);\nactingAs($user, 'sanctum');\n```\n\nSanctum 토큰:\n\n```php\n$token = $user-\u003ecreateToken('test')-\u003eplainTextToken;\n\n$this-\u003ewithToken($token)-\u003egetJson('/api/me')-\u003eassertOk();\n```\n\n---\n\n## 6. 가짜 시간·이벤트·큐·알림\n\n```php\nuse Illuminate\\Support\\Facades\\Event;\nuse Illuminate\\Support\\Facades\\Queue;\nuse Illuminate\\Support\\Facades\\Notification;\nuse Illuminate\\Support\\Carbon;\n\nit('publishes with timestamp', function () {\n    Carbon::setTestNow('2026-01-01 12:00:00');\n    // ...\n});\n\nEvent::fake([PostPublished::class]);\nQueue::fake();\nNotification::fake();\n\n// 실행 후\nEvent::assertDispatched(PostPublished::class);\nQueue::assertPushed(SendWelcomeEmail::class);\nNotification::assertSentTo($user, WelcomeNotification::class);\n```\n\n외부 HTTP: `Http::fake()`.\n\n```php\nHttp::fake([\n    'pay.example.com/*' =\u003e Http::response(['ok' =\u003e true], 200),\n]);\n```\n\n---\n\n## 7. 정책·미들웨어 테스트\n\n인가를 Feature로 고정:\n\n- guest → 401\n- 다른 유저 → 403\n- 소유자 → 200\n- admin → 200\n\n한 번씩만 있어도 보안 회귀를 막는다.\n\n---\n\n## 8. 테스트용 환경\n\n`phpunit.xml` / `Pest.php`:\n\n- `APP_ENV=testing`\n- SQLite `:memory:` 또는 테스트 DB\n- `MAIL_MAILER=array`\n- `QUEUE_CONNECTION=sync` (또는 fake)\n\n`.env.testing`를 두는 팀도 있다.\n\n---\n\n## 9. 좋은 테스트 습관\n\n- 테스트 이름 = 행동/비즈니스 문장\n- Arrange–Act–Assert\n- 한 테스트에 과도한 시나리오 금지\n- 구현 세부(private 메서드)보다 **관찰 가능한 행동** 검증\n- flaky(순서 의존, 시간 의존) 제거\n\n---\n\n## 연습\n\n1. 게시글 생성 성공/검증 실패 Feature 테스트를 작성한다.\n2. Policy 403 시나리오를 고정한다.\n3. `Http::fake`로 외부 결제 클라이언트를 테스트한다.\n4. `Queue::fake`로 환영 메일 Job이 쌓이는지 확인한다.\n"])</script><script>self.__next_f.push([1,"1e:T1249,"])</script><script>self.__next_f.push([1,"# 큐·Job·이벤트·스케줄링\n\n\u003e 요약: 무거운 작업을 큐로 분리하고, 이벤트/리스너·스케줄러·실패 처리까지 운영 가능하게 구성한다.\n\n---\n\n---\n\n## 1. 왜 큐인가\n\n요청 안에서 하지 말 것:\n\n- 메일/SMS\n- 이미지 리사이즈\n- 외부 API 연쇄 호출\n- 대량 CSV 내보내기\n\n요청은 빠르게 끝내고, **Job으로 비동기** 처리한다.\n\n```env\nQUEUE_CONNECTION=database\n# 운영 권장: redis\n```\n\n```bash\nphp artisan queue:table\nphp artisan queue:failed-table\nphp artisan migrate\nphp artisan queue:work\n```\n\n---\n\n## 2. Job 만들기\n\n```bash\nphp artisan make:job SendWelcomeEmail\n```\n\n```php\nclass SendWelcomeEmail implements ShouldQueue\n{\n    use Dispatchable, InteractsWithQueue, Queueable, SerializesModels;\n\n    public function __construct(\n        public User $user,\n    ) {}\n\n    public int $tries = 3;\n    public int $backoff = 10; // seconds\n\n    public function handle(Mailer $mailer): void\n    {\n        $mailer-\u003eto($this-\u003euser)-\u003esend(new WelcomeMail($this-\u003euser));\n    }\n\n    public function failed(?Throwable $e): void\n    {\n        logger()-\u003eerror('welcome mail failed', [\n            'user_id' =\u003e $this-\u003euser-\u003eid,\n            'error' =\u003e $e?-\u003egetMessage(),\n        ]);\n    }\n}\n```\n\n```php\nSendWelcomeEmail::dispatch($user);\nSendWelcomeEmail::dispatch($user)-\u003edelay(now()-\u003eaddMinutes(5));\nSendWelcomeEmail::dispatch($user)-\u003eonQueue('mail');\n```\n\n모델은 `SerializesModels`로 id만 큐에 저장된다. 처리 시점에 다시 조회.\n\n---\n\n## 3. ShouldBeUnique / 멱등성\n\n같은 사용자 환영 메일 중복 방지:\n\n```php\nclass SendWelcomeEmail implements ShouldQueue, ShouldBeUnique\n{\n    public function uniqueId(): string\n    {\n        return (string) $this-\u003euser-\u003eid;\n    }\n}\n```\n\n결제·웹훅 처리는 **idempotency key** 테이블과 함께 설계한다.  \n큐 재시도 = 최소 두 번 실행될 수 있다고 가정.\n\n---\n\n## 4. 이벤트 \u0026 리스너\n\n```bash\nphp artisan make:event OrderPlaced\nphp artisan make:listener SendOrderConfirmation --event=OrderPlaced\n```\n\n```php\nevent(new OrderPlaced($order));\n// 또는\nOrderPlaced::dispatch($order);\n```\n\n리스너를 `ShouldQueue`로 구현하면 이벤트 발행은 가볍고 후처리는 비동기.\n\n도메인 사건 이름(`OrderPlaced`)으로 결합도를 낮추면 서비스가 비대해지는 것을 막을 수 있다.\n\n---\n\n## 5. 트랜잭션 이후 디스패치\n\n```php\nDB::transaction(function () use ($data) {\n    $order = Order::create(...);\n    DB::afterCommit(fn () =\u003e OrderPlaced::dispatch($order));\n});\n```\n\n또는 Job/이벤트에 `AfterCommit` 구현:\n\n```php\nclass SendWelcomeEmail implements ShouldQueue, ShouldDispatchAfterCommit\n```\n\n커밋 전 디스패치 → 워커가 아직 없는 row를 읽는 레이스가 난다.\n\n---\n\n## 6. Horizon (Redis 큐 운영)\n\n```bash\ncomposer require laravel/horizon\nphp artisan horizon:install\nphp artisan horizon\n```\n\n- 큐별 프로세스 수\n- 대기 시간 모니터링\n- 실패 Job UI\n- 밸런싱 전략\n\n운영에서 `queue:work`를 직접 감독하기보다 Supervisor + Horizon 조합이 흔하다.\n\n---\n\n## 7. 실패 처리\n\n```bash\nphp artisan queue:failed\nphp artisan queue:retry all\nphp artisan queue:flush\n```\n\n```php\npublic function retryUntil(): DateTime\n{\n    return now()-\u003eaddHour();\n}\n```\n\n알림: 실패 시 Slack/이메일. Horizon 알림 또는 `failed()` 훅.\n\n---\n\n## 8. 스케줄링\n\n`routes/console.php` (Laravel 11+):\n\n```php\nuse Illuminate\\Support\\Facades\\Schedule;\n\nSchedule::command('reports:daily')-\u003edailyAt('01:00');\nSchedule::job(new PruneOldTokens)-\u003ehourly();\nSchedule::call(fn () =\u003e Cache::forget('homepage'))-\u003eeveryFiveMinutes();\n```\n\n서버 cron은 한 줄만:\n\n```cron\n* * * * * cd /path \u0026\u0026 php artisan schedule:run \u003e\u003e /dev/null 2\u003e\u00261\n```\n\n`withoutOverlapping()`, `onOneServer()`, `runInBackground()`를 상황에 맞게.\n\n---\n\n## 9. 메일·알림\n\n```bash\nphp artisan make:mail WelcomeMail --markdown=mail.welcome\nphp artisan make:notification InvoicePaid\n```\n\n```php\n$user-\u003enotify(new InvoicePaid($invoice));\n```\n\n채널: mail, database, broadcast, slack.  \n로컬은 Mailpit/Log 드라이버.\n\n---\n\n## 10. 실무 팁\n\n- 큐 payload에 큰 파일/HTML 넣지 않기\n- 타임아웃(`$timeout`) 명시\n- 우선순위 큐 분리 (`mail`, `default`, `high`)\n- 로컬: `queue:listen` / Sail\n- 테스트: `Queue::fake()` + 핵심 경로 1~2개는 실제 sync로도\n\n---\n\n## 연습\n\n1. 회원가입 후 `SendWelcomeEmail` Job을 afterCommit으로 보낸다.\n2. `OrderPlaced` 이벤트 + 큐 리스너를 만든다.\n3. 실패를 강제하고 `queue:failed`를 확인한다.\n4. 매일 자정에 임시 파일 정리 스케줄을 등록한다.\n"])</script><script>self.__next_f.push([1,"1f:Teb5,"])</script><script>self.__next_f.push([1,"# 캐시·Redis·성능 최적화\n\n\u003e 요약: 캐시 전략, Redis, 쿼리/응답 최적화를 측정 기반으로 적용한다.\n\n---\n\n---\n\n## 1. 최적화 순서\n\n1. 느린 쿼리 / N+1 제거\n2. 불필요 작업 큐로 이동\n3. 캐시\n4. HTTP 캐시·CDN\n5. Octane / 스케일 아웃\n\n감으로 `Cache::remember`를 Everywhere 하면 무효화 지옥이 된다.\n\n---\n\n## 2. 캐시 드라이버\n\n```env\nCACHE_STORE=redis\nREDIS_CLIENT=phpredis\n```\n\n| 드라이버 | 용도 |\n|----------|------|\n| `array` | 요청 단위(테스트) |\n| `database` | 소규모·단일 서버 |\n| `file` | 간단 로컬 |\n| `redis` | **실무 기본 추천** |\n| `memcached` | 대안 |\n\n---\n\n## 3. 기본 API\n\n```php\n$value = Cache::remember(\"posts.{$id}\", now()-\u003eaddMinutes(10), function () use ($id) {\n    return Post::with('user')-\u003efindOrFail($id);\n});\n\nCache::put('key', $value, 600);\nCache::forever('key', $value);\nCache::forget('posts.'.$id);\nCache::flush(); // 위험 — 운영에서 신중\n```\n\n태그 (Redis/Memcached):\n\n```php\nCache::tags(['posts', 'user:'.$userId])-\u003eput($key, $value, 600);\nCache::tags(['posts'])-\u003eflush();\n```\n\n---\n\n## 4. 모델 / 라우트 캐시\n\n```php\n$posts = Cache::remember('posts.published.page.'.$page, 60, fn () =\u003e\n    Post::published()-\u003ewith('user')-\u003epaginate(20, page: $page)\n);\n```\n\n갱신 시:\n\n```php\npublic function updated(Post $post): void\n{\n    Cache::forget('posts.'.$post-\u003eid);\n    Cache::tags(['posts'])-\u003eflush();\n}\n```\n\nObserver와 함께 무효화 지점을 한곳으로.\n\n### 프레임워크 캐시 (운영)\n\n```bash\nphp artisan config:cache\nphp artisan route:cache\nphp artisan view:cache\nphp artisan event:cache\n```\n\n배포 파이프라인에 포함. 로컬에서 route cache 켜 둔 채 개발하면 혼란.\n\n---\n\n## 5. HTTP 조건부 캐시\n\n```php\nreturn response($content)\n    -\u003eheader('Cache-Control', 'public, max-age=60')\n    -\u003esetEtag(md5($content));\n```\n\nCDN 앞단과 조합. **개인화 응답**에 `public` 캐시 금지.\n\n---\n\n## 6. Redis 활용 범위\n\n- Cache\n- Session\n- Queue\n- Rate limiting\n- Atomic lock\n- Pub/Sub (브로드캐스트)\n\n```php\n$lock = Cache::lock('order:'.$orderId, 10);\n\nif ($lock-\u003eget()) {\n    try {\n        // 임계 구역\n    } finally {\n        $lock-\u003erelease();\n    }\n}\n```\n\n재고 차감 등 경쟁 조건에 사용. 분산 락도 만능은 아니니 DB 제약과 함께.\n\n---\n\n## 7. 쿼리 성능\n\n- `preventLazyLoading`으로 N+1 차단\n- `select` 최소화\n- 인덱스 + `EXPLAIN`\n- `withCount` / 서브쿼리 남용 주의\n- 대량: `chunkById`, `lazyById`, `upsert`\n- `toBase()` / 커서\n\nDebugbar, Telescope(로컬), `clockwork` 등으로 요청당 쿼리 수 감시.\n\n---\n\n## 8. Eager loading 한계 극복\n\n```php\nPost::with([\n    'user:id,name',\n    'tags:id,name',\n])-\u003eget();\n```\n\n조건부:\n\n```php\nPost::with(['comments' =\u003e fn ($q) =\u003e $q-\u003elatest()-\u003elimit(5)])-\u003eget();\n```\n\n---\n\n## 9. Octane (선택)\n\n```bash\ncomposer require laravel/octane\nphp artisan octane:install\nphp artisan octane:start\n```\n\nSwoole/RoadRunner로 앱을 메모리에 상주 → 기동 비용 제거.\n\n주의:\n\n- 요청 간 상태 오염 (static, 싱글톤에 요청 데이터)\n- `Octane::tick`, 리스너로 정리\n- 배포/리로드 전략 필요\n\n트래픽이 크고 CPU가 요청 부트에 쓰일 때 이득.\n\n---\n\n## 10. 측정\n\n- Telescope (local/staging)\n- Debugbar (local)\n- APM: New Relic, Datadog, OpenTelemetry\n- `php artisan about`\n\np95 지연, 쿼리 수, Redis hit ratio, 큐 wait time을 같이 본다.\n\n---\n\n## 연습\n\n1. 게시글 상세를 `Cache::remember` + 수정 시 `forget`으로 구성한다.\n2. Redis lock으로 중복 결제 요청을 막는다.\n3. `route:cache` / `config:cache`를 스테이징에서 검증한다.\n4. 목록 API 쿼리 수를 `with` 전후로 비교한다.\n"])</script><script>self.__next_f.push([1,"20:T1220,"])</script><script>self.__next_f.push([1,"# Blade·Livewire·Inertia와 API 프론트 전략\n\n\u003e 요약: 서버 렌더(Blade/Livewire) vs Inertia vs 순수 API+SPA를 상황별로 선택하고, 각각의 Laravel다운 패턴을 익힌다.\n\n---\n\n---\n\n## 1. 선택 가이드\n\n| 상황 | 추천 |\n|------|------|\n| 관리자·내부툴·폼 많음 | **Filament** 또는 Blade/Livewire |\n| 전통 멀티페이지, SEO 중요 | Blade (+ 점진적 JS) |\n| SPA UX + Laravel 라우팅/검증 유지 | **Inertia** (Vue/React/Svelte) |\n| 모바일 앱 + 웹 분리 | **API (Sanctum) + 별도 프론트** |\n| 실시간 위젯·부분 갱신 | Livewire / Echo+Broadcast |\n\n“전부 React”가 기본값은 아니다. 팀과 제품 성격이 먼저다.\n\n---\n\n## 2. Blade 핵심\n\n```blade\n{{-- resources/views/posts/show.blade.php --}}\n\u003cx-app-layout\u003e\n    \u003cx-slot:title\u003e{{ $post-\u003etitle }}\u003c/x-slot:title\u003e\n\n    \u003carticle\u003e\n        \u003ch1\u003e{{ $post-\u003etitle }}\u003c/h1\u003e\n        \u003cp class=\"meta\"\u003e{{ $post-\u003euser-\u003ename }} · {{ $post-\u003epublished_at?-\u003ediffForHumans() }}\u003c/p\u003e\n        \u003cdiv\u003e{!! $post-\u003erendered_body !!}\u003c/div\u003e\n    \u003c/article\u003e\n\n    @can('update', $post)\n        \u003ca href=\"{{ route('posts.edit', $post) }}\"\u003e수정\u003c/a\u003e\n    @endcan\n\u003c/x-app-layout\u003e\n```\n\n### 컴포넌트\n\n```bash\nphp artisan make:component Alert\n```\n\n```blade\n\u003cx-alert type=\"success\" :message=\"session('status')\" /\u003e\n```\n\n### 레이아웃 / 슬롯 / `@csrf` / `@method('PUT')`\n\nXSS: `{{ $var }}`는 이스케이프, `{!! !!}`는 신뢰된 HTML만.\n\n---\n\n## 3. Vite 자산 파이프라인\n\n```blade\n@vite(['resources/css/app.css', 'resources/js/app.js'])\n```\n\n```bash\nnpm install\nnpm run dev\nnpm run build\n```\n\nLaravel 모던 프론트의 기본은 **Vite**. Mix는 레거시.\n\n---\n\n## 4. Livewire (서버 중심 반응형)\n\n```bash\ncomposer require livewire/livewire\nphp artisan make:livewire PostSearch\n```\n\n```php\nclass PostSearch extends Component\n{\n    public string $q = '';\n\n    public function render()\n    {\n        return view('livewire.post-search', [\n            'posts' =\u003e Post::query()\n                -\u003ewhen($this-\u003eq, fn ($q) =\u003e $q-\u003ewhere('title', 'like', \"%{$this-\u003eq}%\"))\n                -\u003elatest()\n                -\u003epaginate(10),\n        ]);\n    }\n}\n```\n\n```blade\n\u003cdiv\u003e\n    \u003cinput wire:model.live.debounce.300ms=\"q\" /\u003e\n    @foreach ($posts as $post)\n        \u003cdiv wire:key=\"post-{{ $post-\u003eid }}\"\u003e{{ $post-\u003etitle }}\u003c/div\u003e\n    @endforeach\n    {{ $posts-\u003elinks() }}\n\u003c/div\u003e\n```\n\n적합: CRUD 관리 화면, 필터, 위자드.  \n부적합: 오프라인 앱, 극단적 클라이언트 인터랙션.\n\nLivewire 3의 `wire:model.live`, islands, Volt 문법도 팀 스타일에 맞게 검토.\n\n---\n\n## 5. Inertia\n\n```bash\nphp artisan breeze:install vue   # 또는 react\n```\n\n컨트롤러는 JSON이 아니라 **Inertia 응답**:\n\n```php\nreturn Inertia::render('Posts/Show', [\n    'post' =\u003e new PostResource($post),\n]);\n```\n\n프론트 페이지 컴포넌트가 props를 받아 렌더.  \n라우팅·인증·검증은 Laravel이 담당 → “백엔드 분리 비용” 없이 SPA UX.\n\n폼:\n\n```js\nimport { useForm } from '@inertiajs/vue3'\n\nconst form = useForm({ title: '', body: '' })\nform.post('/posts')\n```\n\n검증 에러가 자동으로 공유 props로 전달된다.\n\n---\n\n## 6. 순수 API + SPA/모바일\n\nValidation·Resource·Sanctum 패턴:\n\n- Form Request\n- API Resource\n- Sanctum\n- OpenAPI (scribe / scramble 패키지)\n\n프론트는 Next.js, Nuxt 등 무엇이든.  \nCORS·쿠키 도메인·버전닝(`/api/v1`)을 계약으로 문서화.\n\n---\n\n## 7. 실시간 — Broadcasting / Echo / Reverb\n\n```bash\ncomposer require laravel/reverb\nphp artisan reverb:install\n```\n\n```php\nbroadcast(new OrderStatusUpdated($order))-\u003etoOthers();\n```\n\n프론트: Laravel Echo + Pusher 프로토콜.  \n알림 벨, 채팅, 대시보드 라이브 갱신에 사용.\n\n---\n\n## 8. Filament (관리자)\n\n빠른 어드민:\n\n```bash\ncomposer require filament/filament\nphp artisan filament:install --panels\n```\n\n리소스 기반으로 CRUD·필터·권한을 빠르게.  \n고객용 UI와 관리자 UI를 분리할 때 생산성이 크다.\n\n---\n\n## 9. 실무 조합 예시\n\n1. **마케팅 사이트**: Blade + Vite\n2. **SaaS 앱**: Inertia + Breeze/Fortify + Policy\n3. **내부 어드민**: Filament\n4. **모바일**: Sanctum API\n5. **일부 위젯**: Livewire 또는 Echo\n\n한 제품 안에 여러 전략이 공존해도 된다. 경계를 명확히.\n\n---\n\n## 연습\n\n1. Blade 컴포넌트로 flash alert를 만든다.\n2. Livewire 검색 리스트를 구현한다 **또는** Inertia 페이지 하나를 연결한다.\n3. API Resource와 Inertia props 중 하나로 게시글 상세를 내려준다.\n4. (선택) Reverb로 간단 알림 이벤트를 방송한다.\n"])</script><script>self.__next_f.push([1,"21:T15c0,"])</script><script>self.__next_f.push([1,"# 운영 배포 — Sail, Forge/Vapor, 프로덕션 체크리스트\n\n\u003e 요약: Laravel 앱을 안전하게 빌드·배포·감시하는 운영 기본기를 정리한다.\n\n---\n\n---\n\n## 1. 환경 분리\n\n| ENV | DEBUG | 목적 |\n|-----|-------|------|\n| local | true | 개발 |\n| staging | false 권장 | 배포 리허설 |\n| production | **false** | 운영 |\n\n```env\nAPP_ENV=production\nAPP_DEBUG=false\nAPP_URL=https://example.com\nLOG_CHANNEL=stack\nLOG_LEVEL=info\n```\n\n`.env`는 서버/시크릿 매니저에만. 이미지·저장소에 시크릿 베이크인 금지.\n\n---\n\n## 2. 배포 시 필수 Artisan\n\n```bash\ncomposer install --no-dev --optimize-autoloader\nphp artisan migrate --force\nphp artisan config:cache\nphp artisan route:cache\nphp artisan view:cache\nphp artisan event:cache\nphp artisan storage:link\nnpm ci \u0026\u0026 npm run build\n```\n\n큐 워커·Horizon·스케줄러·Reverb는 **별도 프로세스**로 항상 켜 둔다.\n\n무중단 배포 시:\n\n- `php artisan down --render=\"errors::503\" --retry=60` (필요 시)\n- 심링크 릴리즈 전환 (Envoyer 스타일)\n- `horizon:terminate`로 워커 graceful reload\n\n---\n\n## 3. Laravel Sail (로컬 Docker)\n\n```bash\nphp artisan sail:install\n./vendor/bin/sail up -d\n./vendor/bin/sail artisan migrate\n./vendor/bin/sail npm run dev\n```\n\n팀원 환경 차이를 줄인다. 운영 이미지는 Sail을 그대로 쓰지 않고 **프로덕션 Dockerfile**을 따로 두는 경우가 많다.\n\n---\n\n## 4. 프로덕션 Dockerfile 스케치\n\n```dockerfile\nFROM serversideup/php:8.3-fpm-nginx AS base\n# 또는 공식 php-fpm + nginx/caddy 조합\n\nWORKDIR /var/www/html\nCOPY --chown=www-data:www-data . .\nRUN composer install --no-dev --optimize-autoloader \\\n \u0026\u0026 php artisan storage:link \\\n \u0026\u0026 npm ci \u0026\u0026 npm run build \\\n \u0026\u0026 php artisan view:cache\n```\n\n권장:\n\n- PHP-FPM + Nginx/Caddy\n- non-root\n- healthcheck: `GET /up`\n- 별도 컨테이너/프로세스: `queue`, `scheduler`, `horizon`\n\nKubernetes면 Deployment를 웹/워커/스케줄로 분리.\n\n---\n\n## 5. 호스팅 옵션\n\n| 옵션 | 특징 |\n|------|------|\n| **Laravel Forge** | VPS 프로비저닝, Nginx, SSL, 배포 스크립트 |\n| **Laravel Vapor** | AWS 서버리스 (Lambda) — 스케일·운영 모델이 다름 |\n| **Laravel Cloud** | 공식 클라우드 옵션 (시점별 확인) |\n| 일반 VPS | Supervisor + Nginx + MySQL/Redis 직접 |\n| PaaS | Railway, Render, Fly.io 등 |\n\nForge: 전통 서버 운영에 최적.  \nVapor: 서버리스 제약(파일시스템, 롱런 프로세스)을 이해하고 써야 한다.\n\n---\n\n## 6. Supervisor 예시 (큐)\n\n```ini\n[program:laravel-worker]\nprocess_name=%(program_name)s_%(process_num)02d\ncommand=php /home/app/artisan queue:work redis --sleep=1 --tries=3 --max-time=3600\nautostart=true\nautorestart=true\nnumprocs=2\nuser=www-data\nredirect_stderr=true\nstdout_logfile=/home/app/storage/logs/worker.log\n```\n\nHorizon 사용 시 `artisan horizon`을 관리.\n\nCron:\n\n```cron\n* * * * * www-data cd /home/app \u0026\u0026 php artisan schedule:run \u003e\u003e /dev/null 2\u003e\u00261\n```\n\n---\n\n## 7. 스토리지·파일\n\n- 로컬 `storage`는 컨테이너 재시작 시 유실될 수 있음 → **S3 호환 오브젝트 스토리지**\n- `FILESYSTEM_DISK=s3`\n- 공개 파일은 CDN\n- 백업: DB 스냅샷 + 스토리지 버전닝\n\n---\n\n## 8. 관측·로그\n\n```env\nLOG_CHANNEL=stack\nLOG_STACK=single,stderr\n```\n\n- 구조화 로그(JSON) + 수집기\n- 예외: Flare, Sentry, Bugsnag\n- 메트릭: 호스트/APM\n- Telescope는 운영 전면 노출 금지 (필요 시 강력 보호)\n\n헬스: Laravel 11+ `health: '/up'`  \nDB/Redis까지 보려면 커스텀 health 체크 추가.\n\n---\n\n## 9. 보안 운영 체크리스트\n\n- [ ] `APP_KEY` 유출 시 재발급·세션/암호화 영향 이해\n- [ ] `APP_DEBUG=false`\n- [ ] HTTPS, HSTS\n- [ ] CSRF / CORS / Sanctum 도메인\n- [ ] 의존성 취약점: `composer audit`\n- [ ] `.env`, 백업, 프라이빗 버킷 권한\n- [ ] Rate limit 로그인·민감 API\n- [ ] 관리자 경로·Filament 패널 추가 보호\n- [ ] 업로드 MIME/크기 제한\n\n---\n\n## 문서 목록\n\n| 주제 | 한 줄 |\n|------|------|\n| Laravel 11+ 시작 | 슬림 스켈레톤, PHP 8.3, env |\n| 라우트·미들웨어 | 생명주기, 리소스, throttle |\n| Eloquent | 관계, N+1, 마이그레이션 |\n| Validation·Resource | Form Request, API 계약 |\n| Authz | Sanctum, Policy |\n| Test | Pest/Feature, fake |\n| Queue | Job, Event, Schedule, Horizon |\n| Cache | Redis, lock, Octane |\n| Frontend | Blade, Livewire, Inertia, API |\n| Ops | 배포, Forge/Vapor, 체크리스트 |\n\n---\n\n## 종합 연습\n\n1. Sail로 app + mysql + redis를 띄운다.\n2. 배포 스크립트(캐시·migrate·build)를 문서/스크립트로 만든다.\n3. `queue:work` 또는 Horizon을 켜고 Job을 처리한다.\n4. `APP_DEBUG=false` + `/up` 헬스 + Sentry(또는 로그) 연동을 확인한다.\n5. 위의 보안·운영 체크리스트를 통과/미통과로 표시한다.\n\n---\n\n## 정리\n\n현대 Laravel은 “빠른 CRUD”를 넘어 **검증·인가·큐·캐시·배포**가 한 줄로 이어진 프레임워크다.\n\n- 입력은 Form Request, 출력은 Resource\n- 권한은 Policy\n- 느린 일은 Queue + afterCommit\n- 관측과 실패 재시도 없는 비동기는 미완성\n- 운영 캐시·워커·스케줄러를 배포의 일부로 취급\n\n이 문서들을 바탕으로, 도메인에 Filament·Inertia·Vapor·Event Sourcing 등을 선택적으로 더하면 실무 생산성이 빠르게 오른다.\n\n추가로 파고들 주제: Laravel Pennant(피처 플래그), Folio, Volt, Tenancy, DDD/Action 패턴, Arch 테스트, CI with GitHub Actions.\n"])</script><script>self.__next_f.push([1,"22:Ta57,"])</script><script>self.__next_f.push([1,"# Next.js App Router로 프로젝트 시작하기\n\n\u003e 요약: App Router 기준으로 Next.js 프로젝트를 세팅하고, 디렉터리·렌더 모드·실무 기본선을 정리한다.\n\n---\n\n## 1. 왜 App Router인가\n\nPages Router도 동작하지만, 신규 프로젝트의 기본선은 **App Router**다.\n\n| 항목 | Pages Router | App Router |\n|------|--------------|------------|\n| 라우팅 | `pages/` | `app/` |\n| 레이아웃 | `_app` / `_document` | 중첩 `layout.tsx` |\n| 데이터 | `getServerSideProps` 등 | async Server Component / fetch |\n| 메타 | `next/head` | `metadata` / `generateMetadata` |\n\n실무 기본 조합: **Next.js 15/16 + TypeScript + App Router**.\n\n---\n\n## 2. 생성\n\n```bash\nnpx create-next-app@latest my-app\ncd my-app\nnpm run dev\n```\n\n권장 옵션: TypeScript, ESLint, App Router, `src/` 디렉터리(팀 취향).\n\n---\n\n## 3. 핵심 디렉터리\n\n```\nsrc/app/\n├── layout.tsx      # 루트 레이아웃\n├── page.tsx        # /\n├── posts/\n│   ├── page.tsx    # /posts\n│   └── [slug]/\n│       └── page.tsx\n└── globals.css\n```\n\n- `page.tsx` → 라우트 UI\n- `layout.tsx` → 공통 셸 (네비, 푸터)\n- `loading.tsx` / `error.tsx` → 구간별 UX\n- `not-found.tsx` → 404\n\n---\n\n## 4. 렌더 모드를 먼저 고른다\n\n| 모드 | 언제 |\n|------|------|\n| 정적(SSG/export) | 문서·마케팅·블로그 |\n| 동적(SSR) | 요청마다 다른 개인화 |\n| 혼합 | 목록은 정적, 일부만 동적 |\n\nGitHub Pages처럼 순수 정적이면 `output: 'export'`를 검토한다.  \nAPI Route·미들웨어·ISR 제약이 있으므로 **호스팅과 함께** 결정한다.\n\n```ts\n// next.config.ts\nconst nextConfig = {\n  output: 'export', // 필요할 때만\n  trailingSlash: true,\n};\n```\n\n---\n\n## 5. 첫 페이지\n\n```tsx\n// app/page.tsx\nexport default function HomePage() {\n  return (\n    \u003cmain\u003e\n      \u003ch1\u003eHello, Next.js\u003c/h1\u003e\n    \u003c/main\u003e\n  );\n}\n```\n\n루트 레이아웃:\n\n```tsx\n// app/layout.tsx\nexport const metadata = {\n  title: 'My App',\n  description: 'Next.js app',\n};\n\nexport default function RootLayout({children}: {children: React.ReactNode}) {\n  return (\n    \u003chtml lang=\"ko\"\u003e\n      \u003cbody\u003e{children}\u003c/body\u003e\n    \u003c/html\u003e\n  );\n}\n```\n\n---\n\n## 6. 체크리스트\n\n- [ ] App Router + TypeScript\n- [ ] `layout` / `page` 역할 분리\n- [ ] 정적 vs 동적 배포 전략 문서화\n- [ ] `trailingSlash`·베이스 경로를 호스팅과 맞춤\n\n---\n\n## 연습\n\n1. `create-next-app`으로 프로젝트를 만든다.\n2. `/about` 라우트와 공통 헤더 레이아웃을 추가한다.\n3. 정적 export가 필요한지 팀 기준으로 한 줄 결정한다.\n"])</script><script>self.__next_f.push([1,"23:T8c3,"])</script><script>self.__next_f.push([1,"# 라우팅·레이아웃·동적 세그먼트\n\n\u003e 요약: 파일 기반 라우팅, 동적·캐치올 세그먼트, 중첩 레이아웃으로 URL과 UI 구조를 설계한다.\n\n---\n\n## 1. 기본 규칙\n\n| 파일 | URL |\n|------|-----|\n| `app/page.tsx` | `/` |\n| `app/posts/page.tsx` | `/posts` |\n| `app/posts/[slug]/page.tsx` | `/posts/:slug` |\n| `app/docs/[...slug]/page.tsx` | `/docs/*` |\n\n폴더 이름 = 경로. `page.tsx`가 있어야 그 경로가 공개된다.\n\n---\n\n## 2. 동적 세그먼트\n\n```tsx\n// app/posts/[slug]/page.tsx\ntype Props = {params: Promise\u003c{slug: string}\u003e};\n\nexport default async function PostPage({params}: Props) {\n  const {slug} = await params;\n  return \u003ch1\u003e{slug}\u003c/h1\u003e;\n}\n```\n\nNext.js 15+에서는 **`params`가 Promise**일 수 있다. `await params`로 읽는다.  \n정적 HTML을 만들 때는 `generateStaticParams`와 함께 쓴다 — SEO와 충돌하지 않는다.\n\n```tsx\nexport function generateStaticParams() {\n  return [{slug: 'hello'}, {slug: 'world'}];\n}\n```\n\n---\n\n## 3. 중첩 레이아웃\n\n```tsx\n// app/posts/layout.tsx\nexport default function PostsLayout({children}: {children: React.ReactNode}) {\n  return (\n    \u003cdiv\u003e\n      \u003caside\u003e카테고리\u003c/aside\u003e\n      \u003csection\u003e{children}\u003c/section\u003e\n    \u003c/div\u003e\n  );\n}\n```\n\n레이아웃은 하위 이동 시 **리마운트되지 않는다**. 상태·스크롤 유지에 유리하다.\n\nRoute Group `(site)` / `(manager)`로 URL 없이 레이아웃만 나눌 수 있다.\n\n```\napp/(site)/page.tsx      → /\napp/(manager)/manager/page.tsx → /manager\n```\n\n---\n\n## 4. Link와 이동\n\n```tsx\nimport Link from 'next/link';\n\n\u003cLink href=\"/posts/hello/\"\u003e글 보기\u003c/Link\u003e\n```\n\n`trailingSlash: true`면 링크도 `/posts/hello/`처럼 맞춘다.\n\n소프트 내비: `useRouter().push('/posts/')` (Client Component).\n\n---\n\n## 5. 병렬·인터셉트 (필요할 때)\n\n- `@folder` 병렬 슬롯: 대시보드 다중 패널\n- `(.)photo` 인터셉트: 모달 오버레이 UX\n\n입문 앱은 동적 세그먼트 + 레이아웃만으로 충분한 경우가 많다.\n\n---\n\n## 연습\n\n1. `/posts/[slug]`와 `generateStaticParams` 2개를 만든다.\n2. `(marketing)` / `(app)` 그룹으로 레이아웃을 나눈다.\n3. 모든 내부 링크에 trailing slash 정책을 맞춘다.\n"])</script><script>self.__next_f.push([1,"24:T841,"])</script><script>self.__next_f.push([1,"# Server Component와 Client Component\n\n\u003e 요약: 기본은 서버 컴포넌트로 두고, 상호작용이 필요할 때만 Client Component로 경계를 나눈다.\n\n---\n\n## 1. 기본값 = Server\n\n`app/` 아래 컴포넌트는 기본적으로 **Server Component**다.\n\n할 수 있는 것:\n\n- DB·파일시스템·시크릿 접근\n- `async/await`로 데이터 로드\n- 번들에 안 실려 클라이언트 JS 감소\n\n할 수 없는 것:\n\n- `useState` / `useEffect`\n- 브라우저 API\n- 이벤트 핸들러 (`onClick` 등)\n\n---\n\n## 2. Client가 필요할 때\n\n파일 상단:\n\n```tsx\n'use client';\n\nimport {useState} from 'react';\n\nexport function Counter() {\n  const [n, setN] = useState(0);\n  return \u003cbutton onClick={() =\u003e setN(n + 1)}\u003e{n}\u003c/button\u003e;\n}\n```\n\n규칙: **잎(leaf)에 가깝게** Client를 둔다.  \n페이지 전체를 `'use client'`로 열면 서버의 이점이 사라진다.\n\n---\n\n## 3. 경계 패턴\n\n```tsx\n// app/posts/page.tsx (Server)\nimport {PostFilters} from './post-filters'; // client\nimport {getPosts} from '@/lib/posts';\n\nexport default async function PostsPage() {\n  const posts = await getPosts();\n  return (\n    \u003c\u003e\n      \u003cPostFilters /\u003e\n      \u003cPostList posts={posts} /\u003e\n    \u003c/\u003e\n  );\n}\n```\n\n서버가 데이터를 가져와 직렬화 가능한 props로 Client에 넘긴다.  \n함수·클래스 인스턴스는 props로 넘기지 말 것.\n\n---\n\n## 4. 흔한 실수\n\n| 실수 | 대안 |\n|------|------|\n| 페이지 전체 client | 인터랙션만 분리 |\n| Server에서 `window` | Client로 이동 |\n| Client에서 `fs` | Server/lib에서 읽고 props |\n| 큰 차트 라이브러리를 레이아웃에 | 동적 import / 해당 페이지만 |\n\n---\n\n## 5. 구성 팁\n\n- 폼·테마 토글·검색창 → Client\n- 본문·메타·목록 데이터 → Server\n- 공유 훅이 client면 그걸 import한 트리도 client화됨에 주의\n\n---\n\n## 연습\n\n1. 서버 페이지 + 클라이언트 검색 입력 조합을 만든다.\n2. 불필요하게 `'use client'`인 파일을 찾아 서버로 되돌린다.\n3. Client bundle에 큰 의존성이 들어가는지 빌드 분석으로 확인한다.\n"])</script><script>self.__next_f.push([1,"25:T966,"])</script><script>self.__next_f.push([1,"# 데이터 페칭과 캐시 전략\n\n\u003e 요약: Server Component에서 데이터를 가져오고, fetch 캐시·재검증·정적 데이터 소스를 상황에 맞게 고른다.\n\n---\n\n## 1. 서버에서 가져오기\n\n```tsx\nasync function getPost(slug: string) {\n  const res = await fetch(`https://api.example.com/posts/${slug}`, {\n    next: {revalidate: 60}, // 초 단위 ISR류 재검증\n  });\n  if (!res.ok) throw new Error('Failed');\n  return res.json();\n}\n\nexport default async function Page({params}: {params: Promise\u003c{slug: string}\u003e}) {\n  const {slug} = await params;\n  const post = await getPost(slug);\n  return \u003carticle\u003e{post.title}\u003c/article\u003e;\n}\n```\n\n버전·설정에 따라 `fetch` 기본 캐시 동작이 달라질 수 있다.  \n**명시적 `cache` / `revalidate` / `tags`** 를 팀 표준으로 적는 편이 안전하다.\n\n---\n\n## 2. 옵션 치트시트\n\n| 옵션 | 의미 |\n|------|------|\n| `cache: 'force-cache'` | 가능하면 캐시 |\n| `cache: 'no-store'` | 매 요청 최신 |\n| `next: {revalidate: N}` | N초 후 재검증 |\n| `next: {tags: ['post']}` | 태그 단위 무효화 |\n\n```ts\nimport {revalidateTag} from 'next/cache';\nrevalidateTag('post');\n```\n\n정적 export(`output: 'export'`)에서는 런타임 재검증·서버 API가 제한된다.  \n**빌드 시점에 읽을 수 있는 데이터**(로컬 MD, 공개 API)가 맞다.\n\n---\n\n## 3. 로컬 파일·CMS\n\n```ts\nimport fs from 'node:fs';\nimport path from 'node:path';\n\nexport function loadMarkdown(slug: string) {\n  const file = path.join(process.cwd(), 'content', `${slug}.md`);\n  return fs.readFileSync(file, 'utf8');\n}\n```\n\n블로그·문서 사이트는 MD/MDX + `generateStaticParams` 조합이 SEO·운영에 유리하다.\n\n---\n\n## 4. 클라이언트 페칭은 언제\n\n- 사용자별 실시간 데이터\n- 무한 스크롤·검색 타이핑\n- 브라우저 전용 API\n\n이 경우 React Query 등과 함께 Client Component에서 처리하고,  \n**초기 셸·SEO 본문**은 서버가 담당하는 편이 낫다.\n\n---\n\n## 5. 에러·로딩\n\n```\napp/posts/[slug]/loading.tsx\napp/posts/[slug]/error.tsx\n```\n\n구간별로 스피너·에러 UI를 두면 체감 품질이 올라간다.\n\n---\n\n## 연습\n\n1. `revalidate: 60` fetch와 `no-store` fetch를 비교한다.\n2. `content/` MD를 읽어 목록 페이지를 만든다.\n3. 정적 export 환경이면 “빌드 타임에만 읽기”로 데이터 소스를 정리한다.\n"])</script><script>self.__next_f.push([1,"26:T836,"])</script><script>self.__next_f.push([1,"# SSG·generateStaticParams·정적 export\n\n\u003e 요약: 빌드 타임에 HTML을 고정하는 SSG와 generateStaticParams, output export의 제약까지 정리한다.\n\n---\n\n## 1. 왜 정적 HTML인가\n\n검색·공유 미리보기는 **첫 응답 HTML**을 본다.  \n빌드 때 본문이 들어 있으면 SEO에 유리하고, CDN 캐시도 쉽다.\n\nApp Router에서 동적 경로를 정적화하려면:\n\n```tsx\nexport function generateStaticParams() {\n  return getAllSlugs().map((slug) =\u003e ({slug}));\n}\n```\n\n빌드 로그에 `/posts/[slug]`가 ● (SSG)로 찍히는지 확인한다.\n\n---\n\n## 2. params는 Promise여도 정적이다\n\n```tsx\nexport default async function Page({params}: {params: Promise\u003c{slug: string}\u003e}) {\n  const {slug} = await params;\n  const post = getPost(slug);\n  if (!post) notFound();\n  return \u003cArticle post={post} /\u003e;\n}\n```\n\n`await params`는 Next API일 뿐, 페이지를 CSR로 바꾸지 않는다.  \n`generateStaticParams`가 있으면 **미리 렌더된 HTML**이 나온다.\n\n---\n\n## 3. `output: 'export'`\n\n```ts\nconst nextConfig = {\n  output: 'export',\n  trailingSlash: true,\n};\n```\n\n결과물: `out/` 정적 파일 → GitHub Pages, S3, 일반 웹서버.\n\n제약 예:\n\n- 서버 Runtime Route Handler 제한\n- 미들웨어·ISR·On-demand revalidate 제한\n- 동적 서버만 가능한 기능 사용 불가\n\n가능하면: MD/API를 **빌드 시** 읽어 HTML 생성.\n\n---\n\n## 4. notFound와 누락 경로\n\n```tsx\nimport {notFound} from 'next/navigation';\n\nif (!post) notFound();\n```\n\n`dynamicParams` 설정에 따라 빌드에 없는 slug 처리가 달라진다.  \n문서 사이트는 보통 **알려진 slug만** 빌드한다.\n\n---\n\n## 5. 체크리스트\n\n- [ ] 공개 글 slug가 `generateStaticParams`에 포함\n- [ ] 상세 HTML에 제목·본문·메타가 들어 있음\n- [ ] export면 서버 전용 기능 미사용\n- [ ] sitemap에 동일 URL 반영\n\n---\n\n## 연습\n\n1. 동적 `[slug]` 3개를 SSG로 빌드해 `out/` HTML을 연다.\n2. `await params`로 바꾼 뒤에도 정적 HTML인지 확인한다.\n3. export 모드에서 깨지는 API를 목록으로 적는다.\n"])</script><script>self.__next_f.push([1,"27:T842,"])</script><script>self.__next_f.push([1,"# Metadata·Open Graph·SEO 기본기\n\n\u003e 요약: metadata API와 generateMetadata로 title·description·canonical·OG를 페이지마다 맞춘다.\n\n---\n\n## 1. 정적 metadata\n\n```tsx\n// app/layout.tsx 또는 page.tsx\nexport const metadata = {\n  title: {\n    default: 'Kaisa Blog',\n    template: '%s · Kaisa Blog',\n  },\n  description: '기술 블로그',\n};\n```\n\n하위 페이지 `title: 'Posts'` → `Posts · Kaisa Blog`.\n\n---\n\n## 2. 동적 generateMetadata\n\n```tsx\nexport async function generateMetadata({\n  params,\n}: {\n  params: Promise\u003c{slug: string}\u003e;\n}): Promise\u003cMetadata\u003e {\n  const {slug} = await params;\n  const post = getPost(slug);\n  if (!post) return {};\n  return {\n    title: post.title,\n    description: post.excerpt,\n    alternates: {canonical: `https://blog.example.com/posts/${slug}/`},\n    openGraph: {\n      title: post.title,\n      description: post.excerpt,\n      type: 'article',\n      url: `https://blog.example.com/posts/${slug}/`,\n    },\n  };\n}\n```\n\n목록·홈과 **실제 글 URL이 동일**해야 한다.  \n쿼리 스트링 상세(`/view?slug=`)는 메타·sitemap과 어긋나기 쉽다.\n\n---\n\n## 3. 같이 챙길 것\n\n| 항목 | 역할 |\n|------|------|\n| `robots.txt` | 크롤 허용/차단 |\n| `sitemap.xml` | URL 목록 |\n| JSON-LD | Article / Breadcrumb |\n| OG image | 공유 미리보기 CTR |\n| `lang` | `\u003chtml lang=\"ko\"\u003e` |\n\n```ts\n// app/sitemap.ts\nexport default function sitemap() {\n  return getAllSlugs().map((slug) =\u003e ({\n    url: `https://blog.example.com/posts/${slug}/`,\n    lastModified: new Date(),\n  }));\n}\n```\n\n---\n\n## 4. noindex가 맞는 곳\n\n- 로그인·회원가입\n- 관리자\n- 검색 결과 중복·내부 도구\n\n```ts\nrobots: {index: false, follow: false}\n```\n\n---\n\n## 5. 실수\n\n- 모든 페이지 동일 title\n- canonical이 www/non-www와 불일치\n- 본문은 CSR인데 메타만 정적\n- trailing slash 불일치로 중복 URL\n\n---\n\n## 연습\n\n1. 글 상세에 `generateMetadata` + canonical을 붙인다.\n2. sitemap에 글 URL만 넣고 인증 페이지는 제외/noindex 한다.\n3. 카톡·슬랙에 URL을 붙여 OG 미리보기를 확인한다.\n"])</script><script>self.__next_f.push([1,"28:T90d,"])</script><script>self.__next_f.push([1,"# Route Handler와 Server Actions\n\n\u003e 요약: 앱 내 API(Route Handler)와 폼용 Server Actions의 역할·제약·정적 export와의 관계를 정리한다.\n\n---\n\n## 1. Route Handler\n\n```ts\n// app/api/hello/route.ts\nimport {NextResponse} from 'next/server';\n\nexport async function GET() {\n  return NextResponse.json({ok: true});\n}\n\nexport async function POST(request: Request) {\n  const body = await request.json();\n  return NextResponse.json({received: body});\n}\n```\n\n용도: 웹훅, 외부 클라이언트 API, 서버 전용 프록시.\n\n`output: 'export'`에서는 **지원이 제한**된다. 정적 호스팅이면 백엔드를 별도(Cafe24 API 등)로 두는 편이 흔하다.\n\n---\n\n## 2. Server Actions\n\n```tsx\n// app/contact/actions.ts\n'use server';\n\nexport async function sendMessage(formData: FormData) {\n  const email = String(formData.get('email') || '');\n  // DB / 메일 발송\n  return {ok: true};\n}\n```\n\n```tsx\nimport {sendMessage} from './actions';\n\nexport default function ContactForm() {\n  return (\n    \u003cform action={sendMessage}\u003e\n      \u003cinput name=\"email\" type=\"email\" required /\u003e\n      \u003cbutton type=\"submit\"\u003e보내기\u003c/button\u003e\n    \u003c/form\u003e\n  );\n}\n```\n\n폼·뮤테이션에 적합. 네트워크 왕복을 줄이고 progressive enhancement에 가깝다.\n\n---\n\n## 3. 언제 무엇을\n\n| 상황 | 선택 |\n|------|------|\n| 외부 앱이 호출 | Route Handler / 별도 API |\n| 같은 Next 앱 폼 | Server Action |\n| 순수 정적 사이트 | 외부 API + 클라이언트 또는 빌드 타임만 |\n\n---\n\n## 4. 보안\n\n- Action·Handler 모두 **입력 검증**\n- 쿠키·세션 확인\n- CSRF: Server Actions는 프레임워크 보호가 있으나 팀 정책 확인\n- 시크릿은 서버에만\n\n```ts\nimport {z} from 'zod';\nconst schema = z.object({email: z.string().email()});\n```\n\n---\n\n## 5. 재검증\n\n```ts\n'use server';\nimport {revalidatePath} from 'next/cache';\n\nexport async function updatePost(id: string) {\n  // ...\n  revalidatePath(`/posts/${id}`);\n}\n```\n\n정적 export 환경에서는 런타임 재검증이 어렵다. 배포 파이프라인으로 다시 빌드한다.\n\n---\n\n## 연습\n\n1. `POST /api/echo` Route Handler를 만든다 (Node 런타임 호스팅에서).\n2. 간단한 Server Action 폼을 만든다.\n3. 현재 배포가 export면 “Next API 없이” 설계도를 그린다.\n"])</script><script>self.__next_f.push([1,"29:T951,"])</script><script>self.__next_f.push([1,"# 미들웨어와 인증 경계\n\n\u003e 요약: middleware로 경로 보호·리다이렉트를 다루고, 세션·토큰을 어디에 둘지 실무 기준으로 정리한다.\n\n---\n\n## 1. middleware.ts\n\n```ts\n// middleware.ts\nimport {NextResponse} from 'next/server';\nimport type {NextRequest} from 'next/server';\n\nexport function middleware(request: NextRequest) {\n  const token = request.cookies.get('session')?.value;\n  if (!token \u0026\u0026 request.nextUrl.pathname.startsWith('/manager')) {\n    return NextResponse.redirect(new URL('/login/', request.url));\n  }\n  return NextResponse.next();\n}\n\nexport const config = {\n  matcher: ['/manager/:path*'],\n};\n```\n\n엣지에서 빠르게 경로를 가른다. **무거운 DB 조회**는 넣지 않는 편이 좋다.\n\n---\n\n## 2. 인증 정보 위치\n\n| 저장 | 장점 | 주의 |\n|------|------|------|\n| HttpOnly 쿠키 | XSS에 상대적으로 안전 | CSRF·SameSite |\n| 메모리/상태 | XSS 표면 | 새로고침 시 소실 → 보통 쿠키와 조합 |\n| localStorage | 구현 쉬움 | XSS 위험 |\n\nSPA+별도 API면 쿠키 또는 Bearer.  \nNext 풀스택이면 쿠키 세션 + Server Component에서 검증이 흔하다.\n\n---\n\n## 3. 레이아웃에서 가드\n\n```tsx\n// app/manager/layout.tsx\nimport {redirect} from 'next/navigation';\nimport {getSession} from '@/lib/auth';\n\nexport default async function ManagerLayout({children}: {children: React.ReactNode}) {\n  const session = await getSession();\n  if (!session) redirect('/login/');\n  return \u003cdiv\u003e{children}\u003c/div\u003e;\n}\n```\n\n미들웨어(거친 차단) + 레이아웃/페이지(정확한 권한) **이중**이 안전하다.\n\n---\n\n## 4. 정적 export와의 관계\n\n`output: 'export'`면 미들웨어·서버 세션이 제한될 수 있다.  \n그 경우:\n\n- 관리자 인증은 **클라이언트 + API**\n- 또는 관리자만 별도 서버 호스팅\n\n공개 Posts는 정적, Issues/Manager는 API — 역할 분리와 잘 맞는다.\n\n---\n\n## 5. 체크리스트\n\n- [ ] matcher로 보호 경로 명시\n- [ ] 관리자 API는 서버에서 토큰 재검증\n- [ ] 로그인·회원가입 noindex\n- [ ] 로그아웃아웃 시 쿠키·캐시 정리\n\n---\n\n## 연습\n\n1. `/manager/*` 미들웨어 리다이렉트를 만든다 (Node 호스팅).\n2. 레이아웃에서 세션 없는 사용자를 `redirect` 한다.\n3. export 배포라면 클라이언트 가드 + API 401 처리 흐름을 문서화한다.\n"])</script><script>self.__next_f.push([1,"2a:T6c6,# 이미지·폰트·성능 최적화\n\n\u003e 요약: next/image·next/font와 번들·스트리밍으로 Core Web Vitals에 가까운 기본기를 갖춘다.\n\n---\n\n## 1. next/image\n\n```tsx\nimport Image from 'next/image';\n\n\u003cImage\n  src=\"/hero.jpg\"\n  alt=\"Hero\"\n  width={1200}\n  height={630}\n  priority // LCP 후보만\n/\u003e\n```\n\n이점: 리사이즈·lazy·현대 포맷.  \n`output: 'export'`면 `images.unoptimized: true` 또는 커스텀 로더가 필요할 수 있다.\n\n```ts\nimages: {unoptimized: true}\n```\n\n원격 이미지는 `images.remotePatterns`에 도메인 허용.\n\n---\n\n## 2. next/font\n\n```tsx\nimport {Geist, Geist_Mono} from 'next/font/google';\n\nconst sans = Geist({subsets: ['latin'], variable: '--font-sans'});\n\nexport default function RootLayout({children}: {children: React.ReactNode}) {\n  return (\n    \u003chtml className={sans.variable}\u003e\n      \u003cbody\u003e{children}\u003c/body\u003e\n    \u003c/html\u003e\n  );\n}\n```\n\n빌드 시 폰트를 받아 **레이아웃 시프트·외부 요청**을 줄인다.\n\n---\n\n## 3. 번들\n\n- 큰 라이브러리는 쓰는 페이지/Client에만\n- `dynamic(() =\u003e import(...), {ssr: false})` 는 정말 필요할 때만\n- barrel `index.ts` 과다 re-export 주의\n\n```bash\nnpm run build\n# 라우트별 크기 확인\n```\n\n---\n\n## 4. 스트리밍·로딩 UI\n\n`loading.tsx`와 Suspense로 셸을 먼저 보내고 느린 구간을 채운다.  \n체감 LCP·INP에 도움이 된다.\n\n---\n\n## 5. 측정\n\n- Lighthouse / PageSpeed\n- Web Vitals (LCP, CLS, INP)\n- 실제 장치·3G 스로틀\n\n최적화 전후를 **같은 URL**로 비교한다.\n\n---\n\n## 연습\n\n1. 히어로에 `next/image` + `priority`를 적용한다.\n2. `next/font`로 본문 폰트를 옮긴다.\n3. export 모드면 `unoptimized` 필요 여부를 확인한다.\n2b:T811,# 배포 — Vercel·정적 호스팅·체크리스트\n\n\u003e 요약: Vercel·GitHub Pages 등 배포 선택과 환경변수·캐시·도메인·롤백을 점검 목록으로 정리한다.\n\n---\n\n## 1. 호스팅 선택\n\n| 대상 | 적합 |\n|------|------|\n| Vercel / 유사 PaaS | SSR·Action·ISR·미들웨어 풀활용 |\n| GitHub Pages / S3+CDN | `output: 'export'` 정적 사이트 |\n| Node 서버 / Docker | 커스텀 런타임·사내 인프라 |\n\n기능이 필요하면 호스팅을 먼저 고치고,  \n정적만 필요하면 export로 단순화한다.\n\n---\n\n## 2. 환경변수\n\n```env\nNEXT_PUBLIC_SITE_URL=https://blog.example.com\nNEXT_PUBLIC_API_URL=https://api.example.com\n```\n\n- `NEXT_PUBLIC_*` → 클라이언트 노출\n- 시크릿 → 서버 전용, 저장소 커밋 금지\n- 프리뷰/프로덕션 URL 분리\n\n---\n\n## 3. 정적 export 배포 흐름\n\n```bash\nnpm run build\n# out/ 업로드\n```\n\n- `trailingSlash`와 서버/CDN 설정 일치\n- SPA 폴백보다 **실제 경로별 HTML**이 SEO에 유리\n- 커스텀 도메인 + HTTPS\n\n---\n\n## 4. 프로덕션 체크리스트\n\n### SEO\n\n- [ ] 글 URL이 정적 HTML\n- [ ] sitemap / robots\n- [ ] canonical·OG\n- [ ] 관리자·로그인 noindex\n\n### 신뢰성\n\n- [ ] 환경변수 누락 시 빌드 실패 또는 명확한 에러\n- [ ] 404/500 페이지\n- [ ] 롤백 방법 (이전 배포 재활성화)\n\n### 성능\n\n- [ ] 이미지·폰트 전략\n- [ ] 번들 이상치 없음\n- [ ] 캐시 헤더/CDN\n\n---\n\n## 5. CI 스케치\n\n1. lint / typecheck / test\n2. `next build`\n3. artifact 배포 또는 Vercel 연동\n4. 스모크: `/`, `/posts/`, 대표 글 URL\n\n---\n\n## 정리\n\nNext.js 배포는 “어디서 돌릴지”가 아키텍처다.  \n공개 문서·블로그는 정적 HTML, 동적 이슈·관리자는 API — 역할을 나누면 SEO와 운영을 동시에 가져가기 쉽다.\n\n---\n\n## 연습\n\n1. 현재 프로젝트가 Vercel형인지 export형인지 한 줄로 적는다.\n2. `NEXT_PUBLIC_SITE_URL`이 sitemap·OG에 쓰이는지 확인한다.\n3. 위 체크리스트를 통과/미통과로 표시한다.\n2c:T10fd,"])</script><script>self.__next_f.push([1,"# React Native와 Expo로 시작하기\n\n\u003e 요약: 최신 React Native(New Architecture) + Expo 기준으로 프로젝트를 세팅하고, 네이티브 앱 개발의 기본 지도를 잡는다.\n\n---\n\n---\n\n## 1. React Native란\n\nJavaScript/TypeScript로 **iOS·Android(그리고 웹)** UI를 만드는 프레임워크다.  \n웹의 DOM 대신 **네이티브 뷰**를 그리며, React의 컴포넌트·훅·상태 모델을 그대로 쓴다.\n\n| 구분 | React (Web) | React Native |\n|------|-------------|--------------|\n| 렌더 대상 | HTML/CSS | Native Views |\n| 스타일 | CSS | StyleSheet (Yoga 레이아웃) |\n| 네비게이션 | react-router 등 | Expo Router / React Navigation |\n| 빌드 | Vite/Webpack | Metro + 네이티브 빌드 |\n\n---\n\n## 2. Expo vs Bare RN — 2020년대 후반 기준\n\n실무·학습 모두 **Expo(managed / CNG)** 가 기본 추천이다.\n\n| 항목 | Expo | Bare CLI |\n|------|------|----------|\n| 시작 속도 | 매우 빠름 | 느림 |\n| OTA 업데이트 | EAS Update | 직접 구성 |\n| 네이티브 모듈 | config plugin / prebuild | 수동 연동 |\n| 스토어 빌드 | EAS Build | Xcode/Gradle 직접 |\n\n지금은 “Expo는 토이”가 아니다. **Expo = 프로덕션 RN 툴체인**에 가깝다.\n\n---\n\n## 3. 환경 준비\n\n- Node.js LTS (20+)\n- Git\n- Android Studio (에뮬레이터) / Xcode (macOS, iOS)\n- 실기기: Expo Go 앱\n\n```bash\nnpx create-expo-app@latest my-app\ncd my-app\nnpx expo start\n```\n\n템플릿 선택 시 **TypeScript + Expo Router** 를 고르는 것을 권장한다.\n\n```bash\nnpx create-expo-app@latest my-app -t expo-template-blank-typescript\n# 또는 공식 라우터 템플릿\nnpx create-expo-app@latest my-app --template tabs\n```\n\n---\n\n## 4. 프로젝트 구조 (Expo Router)\n\n```\napp/                 # 파일 기반 라우팅 (페이지)\n├── _layout.tsx\n├── index.tsx\n├── (tabs)/\n└── +not-found.tsx\ncomponents/\nhooks/\nconstants/\nassets/\napp.json | app.config.ts\npackage.json\n```\n\n`app.json` 핵심:\n\n```json\n{\n  \"expo\": {\n    \"name\": \"MyApp\",\n    \"slug\": \"my-app\",\n    \"scheme\": \"myapp\",\n    \"version\": \"1.0.0\",\n    \"orientation\": \"portrait\",\n    \"platforms\": [\"ios\", \"android\"],\n    \"plugins\": []\n  }\n}\n```\n\n---\n\n## 5. New Architecture (간단 이해)\n\nReact Native의 신 아키텍처:\n\n- **Fabric**: 새 렌더러\n- **TurboModules**: 빠른 네이티브 모듈\n- **JSI**: JS↔Native 저수준 인터페이스\n\nExpo SDK 최근 버전은 New Architecture가 기본/권장이다.  \n우선은 “켠다” 정도만 알고, 브릿지 병목이 줄었다는 점만 기억하면 충분하다.\n\n---\n\n## 6. 첫 화면\n\n```tsx\n// app/index.tsx\nimport { Text, View, StyleSheet } from 'react-native';\n\nexport default function HomeScreen() {\n  return (\n    \u003cView style={styles.container}\u003e\n      \u003cText style={styles.title}\u003eHello, React Native\u003c/Text\u003e\n    \u003c/View\u003e\n  );\n}\n\nconst styles = StyleSheet.create({\n  container: {\n    flex: 1,\n    alignItems: 'center',\n    justifyContent: 'center',\n    backgroundColor: '#0f172a',\n  },\n  title: {\n    fontSize: 24,\n    fontWeight: '700',\n    color: '#f8fafc',\n  },\n});\n```\n\n웹처럼 `className`이 기본은 아니다. (NativeWind를 쓰면 Tailwind류 가능 — 스타일·폼 문서 참고)\n\n---\n\n## 7. 개발 루프\n\n```bash\nnpx expo start          # Dev server\n# a: Android / i: iOS / w: web\n# r: reload / j: debugger\n```\n\n- Fast Refresh로 저장 즉시 반영\n- 실기기는 같은 Wi‑Fi 또는 tunnel 모드\n- 로그: 터미널 + React Native DevTools\n\n---\n\n## 8. TypeScript를 기본으로\n\n```tsx\ntype User = {\n  id: string;\n  name: string;\n};\n\nfunction greet(user: User): string {\n  return `Hi, ${user.name}`;\n}\n```\n\nprops·API 응답·네비게이션 파라미터에 타입을 걸면 앱 규모가 커져도 안전하다.\n\n---\n\n## 9. 최신 기법 체크리스트\n\n- [ ] Expo + TypeScript로 시작\n- [ ] Expo Router(파일 기반 라우팅) 사용\n- [ ] `app.config.ts`로 환경별 설정 분리 검토\n- [ ] EAS(빌드/업데이트)를 배포 경로로 염두\n- [ ] 웹 CSS 감각을 StyleSheet/Flex로 재학습\n\n---\n\n## 연습\n\n1. Expo 프로젝트를 만들고 에뮬레이터/실기기에서 실행한다.\n2. 홈 화면에 이름·버전 텍스트를 표시한다.\n3. `app.json`의 `name`, `scheme`을 바꿔 반영을 확인한다.\n4. TypeScript로 `User` 타입과 표시 컴포넌트를 만든다.\n"])</script><script>self.__next_f.push([1,"2d:T12ef,"])</script><script>self.__next_f.push([1,"# 컴포넌트·스타일·레이아웃 — Flex와 StyleSheet\n\n\u003e 요약: RN 핵심 컴포넌트와 Flexbox 레이아웃, StyleSheet 패턴, 안전한 스타일 작성법을 익힌다.\n\n---\n\n---\n\n## 1. 핵심 컴포넌트\n\n| 컴포넌트 | 역할 | 웹 대응 |\n|----------|------|---------|\n| `View` | 컨테이너 | `div` |\n| `Text` | 텍스트 (필수) | `span/p` |\n| `Image` | 이미지 | `img` |\n| `Pressable` | 터치 | `button` |\n| `ScrollView` | 스크롤 영역 | 스크롤 div |\n| `TextInput` | 입력 | `input` |\n| `FlatList` | 긴 리스트 | 가상화 리스트 |\n\n**텍스트는 반드시 `Text` 안**. `View` 직하 문자열은 에러다.\n\n```tsx\nimport { View, Text, Pressable } from 'react-native';\n\nexport function CounterButton({ onPress, label }: { onPress: () =\u003e void; label: string }) {\n  return (\n    \u003cPressable\n      onPress={onPress}\n      style={({ pressed }) =\u003e [styles.btn, pressed \u0026\u0026 styles.pressed]}\n    \u003e\n      \u003cText style={styles.label}\u003e{label}\u003c/Text\u003e\n    \u003c/Pressable\u003e\n  );\n}\n```\n\n`Button`은 스타일 제약이 커서 실무에선 `Pressable`/`TouchableOpacity`를 더 쓴다.\n\n---\n\n## 2. StyleSheet\n\n```tsx\nimport { StyleSheet } from 'react-native';\n\nconst styles = StyleSheet.create({\n  card: {\n    padding: 16,\n    borderRadius: 12,\n    backgroundColor: '#fff',\n  },\n  title: {\n    fontSize: 18,\n    fontWeight: '600',\n  },\n});\n```\n\n특징:\n\n- 단위는 **dp** (px 아님). 숫자만 쓰면 됨\n- 상속이 CSS처럼 자유롭지 않음 — `Text`는 부모 `Text` 스타일을 일부 상속\n- 배열로 병합: `style={[styles.card, compact \u0026\u0026 styles.compact, { marginTop: 8 }]}`\n\n---\n\n## 3. Flexbox — RN의 레이아웃 언어\n\n기본: `flexDirection: 'column'` (웹과 다름!).\n\n```tsx\nconst styles = StyleSheet.create({\n  row: {\n    flexDirection: 'row',\n    alignItems: 'center',\n    justifyContent: 'space-between',\n    gap: 8,\n  },\n  grow: {\n    flex: 1,\n  },\n});\n```\n\n자주 쓰는 속성:\n\n- `justifyContent`: 주축 정렬\n- `alignItems`: 교차축 정렬\n- `flex`: 남은 공간 비율\n- `gap` / `rowGap` / `columnGap`\n- `position: 'absolute'` + `top/left/right/bottom`\n\n화면 가득:\n\n```tsx\n{ flex: 1 }  // 부모가 높이를 가질 때\n```\n\nSafe Area:\n\n```tsx\nimport { SafeAreaView } from 'react-native-safe-area-context';\n\n\u003cSafeAreaView style={{ flex: 1 }}\u003e...\u003c/SafeAreaView\u003e\n```\n\n노치·홈 인디케이터를 피하려면 `safe-area-context`가 사실상 필수다.\n\n---\n\n## 4. 이미지\n\n```tsx\n// 로컬\n\u003cImage source={require('../assets/logo.png')} style={{ width: 120, height: 40 }} /\u003e\n\n// 원격\n\u003cImage\n  source={{ uri: 'https://example.com/avatar.png' }}\n  style={{ width: 64, height: 64, borderRadius: 32 }}\n/\u003e\n```\n\n원격 이미지는 **width/height**가 필요하다.  \n성능·캐시: `expo-image` 권장.\n\n```bash\nnpx expo install expo-image\n```\n\n```tsx\nimport { Image } from 'expo-image';\n\n\u003cImage\n  source=\"https://example.com/pic.jpg\"\n  style={{ width: '100%', height: 200 }}\n  contentFit=\"cover\"\n  transition={200}\n/\u003e\n```\n\n---\n\n## 5. 스크롤과 키보드\n\n짧은 폼:\n\n```tsx\nimport { KeyboardAvoidingView, Platform, ScrollView } from 'react-native';\n\n\u003cKeyboardAvoidingView\n  style={{ flex: 1 }}\n  behavior={Platform.OS === 'ios' ? 'padding' : undefined}\n\u003e\n  \u003cScrollView contentContainerStyle={{ padding: 16 }}\u003e\n    {/* TextInput들 */}\n  \u003c/ScrollView\u003e\n\u003c/KeyboardAvoidingView\u003e\n```\n\n긴 리스트는 `ScrollView` + `map` 금지 → **FlatList**.\n\n---\n\n## 6. 플랫폼별 분기\n\n```tsx\nimport { Platform, StyleSheet } from 'react-native';\n\nconst styles = StyleSheet.create({\n  shadow: Platform.select({\n    ios: {\n      shadowColor: '#000',\n      shadowOpacity: 0.15,\n      shadowRadius: 8,\n      shadowOffset: { width: 0, height: 4 },\n    },\n    android: { elevation: 4 },\n    default: {},\n  }),\n});\n```\n\n파일 분기: `Button.ios.tsx` / `Button.android.tsx`.\n\n---\n\n## 7. 디자인 토큰\n\n```tsx\n// constants/theme.ts\nexport const colors = {\n  bg: '#0f172a',\n  card: '#1e293b',\n  text: '#f8fafc',\n  muted: '#94a3b8',\n  primary: '#38bdf8',\n} as const;\n\nexport const spacing = { xs: 4, sm: 8, md: 16, lg: 24, xl: 32 } as const;\n```\n\n하드코딩 색/간격을 줄이면 다크모드·리브랜드가 쉬워진다.\n\n### NativeWind (선택)\n\nTailwind 문법을 쓰고 싶다면 NativeWind. 팀 합의 후 도입.  \n기본 학습은 StyleSheet을 먼저 탄탄히.\n\n---\n\n## 8. 접근성 기본\n\n```tsx\n\u003cPressable\n  accessibilityRole=\"button\"\n  accessibilityLabel=\"장바구니에 추가\"\n  onPress={onAdd}\n\u003e\n  \u003cText\u003e추가\u003c/Text\u003e\n\u003c/Pressable\u003e\n```\n\n터치 영역 최소 ~44pt, 대비 충분한 색.\n\n---\n\n## 연습\n\n1. 카드 UI(이미지·제목·가격·버튼)를 Flex로 만든다.\n2. `SafeAreaView` + 헤더/본문/하단 CTA 레이아웃을 구성한다.\n3. iOS/Android 그림자를 `Platform.select`로 맞춘다.\n4. `expo-image`로 원격 이미지를 표시한다.\n"])</script><script>self.__next_f.push([1,"2e:T12e5,"])</script><script>self.__next_f.push([1,"# 상태·훅·폼 — 사용자 입력과 데이터 흐름\n\n\u003e 요약: `useState`/`useEffect`/`useRef`와 폼 패턴, 파생 상태 함정을 이해하고 실무적인 입력 UX를 만든다.\n\n---\n\n---\n\n## 1. 상태는 어디에 두나\n\n| 범위 | 수단 |\n|------|------|\n| 한 컴포넌트 UI | `useState` |\n| 부모→자식 공유 | props 내리기 / 합성 |\n| 화면 멀리 공유 | Context, Zustand 등 |\n| 서버 데이터 | TanStack Query 등 |\n| 폼 다수 필드 | `react-hook-form` |\n\n서버에서 온 데이터를 `useState`+`useEffect`로 수동 동기화하는 패턴은 최신 실무에서 지양한다.\n\n---\n\n## 2. useState / 파생 값\n\n```tsx\nconst [count, setCount] = useState(0);\nconst doubled = count * 2; // state로 두지 말 것\n```\n\n객체 업데이트:\n\n```tsx\nsetUser((prev) =\u003e ({ ...prev, name }));\n```\n\n---\n\n## 3. TextInput 패턴\n\n```tsx\nimport { useState } from 'react';\nimport { TextInput, Text, View } from 'react-native';\n\nexport function LoginForm({ onSubmit }: { onSubmit: (email: string, password: string) =\u003e void }) {\n  const [email, setEmail] = useState('');\n  const [password, setPassword] = useState('');\n  const [error, setError] = useState\u003cstring | null\u003e(null);\n\n  const handleSubmit = () =\u003e {\n    if (!email.includes('@')) {\n      setError('이메일 형식을 확인하세요');\n      return;\n    }\n    setError(null);\n    onSubmit(email.trim(), password);\n  };\n\n  return (\n    \u003cView style={{ gap: 12 }}\u003e\n      \u003cTextInput\n        value={email}\n        onChangeText={setEmail}\n        placeholder=\"email\"\n        autoCapitalize=\"none\"\n        keyboardType=\"email-address\"\n        textContentType=\"emailAddress\"\n        style={inputStyle}\n      /\u003e\n      \u003cTextInput\n        value={password}\n        onChangeText={setPassword}\n        placeholder=\"password\"\n        secureTextEntry\n        textContentType=\"password\"\n        style={inputStyle}\n      /\u003e\n      {error ? \u003cText style={{ color: 'tomato' }}\u003e{error}\u003c/Text\u003e : null}\n      \u003cPressable onPress={handleSubmit}\u003e{/* ... */}\u003c/Pressable\u003e\n    \u003c/View\u003e\n  );\n}\n```\n\niOS/Android 자동완성·비밀번호 매니저 대응에 `textContentType` / `autoComplete`가 도움이 된다.\n\n---\n\n## 4. useRef — DOM 대신 인스턴스\n\n```tsx\nconst inputRef = useRef\u003cTextInput\u003e(null);\n\n\u003cTextInput ref={inputRef} /\u003e\n// 다음 필드로\ninputRef.current?.focus();\n```\n\n렌더와 무관한 타임스탬프·이전 값 보관에도 사용.\n\n---\n\n## 5. useEffect — 구독과 정리\n\n```tsx\nuseEffect(() =\u003e {\n  const sub = AppState.addEventListener('change', onChange);\n  return () =\u003e sub.remove();\n}, []);\n```\n\n안티패턴:\n\n```tsx\n// 서버 fetch를 매번 이렇게만 구성하지 말 것\nuseEffect(() =\u003e {\n  fetch('/api').then(...).then(setData);\n}, []);\n```\n\n→ React Query / SWR이 캐시·재시도·포커스 리패치를 대신한다 .\n\n---\n\n## 6. react-hook-form + zod (권장)\n\n```bash\nnpx expo install react-hook-form zod @hookform/resolvers\n```\n\n```tsx\nimport { useForm, Controller } from 'react-hook-form';\nimport { z } from 'zod';\nimport { zodResolver } from '@hookform/resolvers/zod';\n\nconst schema = z.object({\n  email: z.string().email(),\n  password: z.string().min(8),\n});\n\ntype FormValues = z.infer\u003ctypeof schema\u003e;\n\nexport function SignupForm() {\n  const { control, handleSubmit, formState: { errors } } = useForm\u003cFormValues\u003e({\n    resolver: zodResolver(schema),\n    defaultValues: { email: '', password: '' },\n  });\n\n  return (\n    \u003c\u003e\n      \u003cController\n        control={control}\n        name=\"email\"\n        render={({ field: { onChange, onBlur, value } }) =\u003e (\n          \u003cTextInput value={value} onBlur={onBlur} onChangeText={onChange} /\u003e\n        )}\n      /\u003e\n      {errors.email \u0026\u0026 \u003cText\u003e{errors.email.message}\u003c/Text\u003e}\n      \u003cPressable onPress={handleSubmit((data) =\u003e console.log(data))} /\u003e\n    \u003c/\u003e\n  );\n}\n```\n\n검증 스키마를 서버와 공유하면 풀스택 계약이 단단해진다.\n\n---\n\n## 7. 키보드·UX\n\n- `returnKeyType=\"next\" | \"done\"`\n- `onSubmitEditing`으로 다음 필드 focus\n- `Keyboard.dismiss()`\n- `keyboardShouldPersistTaps=\"handled\"` on ScrollView\n- 로딩 중 버튼 비활성 + 스피너\n\n```tsx\nimport { ActivityIndicator } from 'react-native';\n\n{loading ? \u003cActivityIndicator /\u003e : \u003cText\u003e로그인\u003c/Text\u003e}\n```\n\n---\n\n## 8. 커스텀 훅\n\n```tsx\nfunction useToggle(initial = false) {\n  const [on, setOn] = useState(initial);\n  const toggle = useCallback(() =\u003e setOn((v) =\u003e !v), []);\n  return { on, toggle, setOn };\n}\n```\n\nUI 로직이 반복되면 훅으로 추출. 다만 성급한 추상화는 피한다.\n\n---\n\n## 연습\n\n1. 로그인 폼(이메일·비밀번호·에러·로딩)을 만든다.\n2. zod + react-hook-form으로 회원가입 검증을 붙인다.\n3. `useRef`로 비밀번호 필드 자동 포커스를 구현한다.\n4. `useToggle` 커스텀 훅으로 비밀번호 표시/숨김을 만든다.\n"])</script><script>self.__next_f.push([1,"2f:T1361,"])</script><script>self.__next_f.push([1,"# 리스트·네비게이션 — FlatList와 Expo Router\n\n\u003e 요약: 가상화 리스트로 성능을 지키고, Expo Router로 타입 안전한 화면 이동을 구성한다.\n\n---\n\n---\n\n## 1. ScrollView vs FlatList vs SectionList\n\n| 컴포넌트 | 언제 |\n|----------|------|\n| `ScrollView` | 짧은 고정 콘텐츠 |\n| `FlatList` | **긴 동종 리스트** (기본 선택) |\n| `SectionList` | 섹션 헤더가 있는 목록 |\n| `FlashList` | 더 공격적인 성능 (Shopify) |\n\n```tsx\n// 금지: 수천 개 map + ScrollView\n{items.map((item) =\u003e \u003cRow key={item.id} item={item} /\u003e)}\n```\n\n---\n\n## 2. FlatList 기본\n\n```tsx\nimport { FlatList, Text, View } from 'react-native';\n\ntype Item = { id: string; title: string };\n\nexport function PostList({ data }: { data: Item[] }) {\n  return (\n    \u003cFlatList\n      data={data}\n      keyExtractor={(item) =\u003e item.id}\n      renderItem={({ item }) =\u003e (\n        \u003cView style={{ padding: 16 }}\u003e\n          \u003cText\u003e{item.title}\u003c/Text\u003e\n        \u003c/View\u003e\n      )}\n      ItemSeparatorComponent={() =\u003e \u003cView style={{ height: 1, backgroundColor: '#e2e8f0' }} /\u003e}\n      ListEmptyComponent={\u003cText style={{ padding: 24 }}\u003e게시글이 없습니다\u003c/Text\u003e}\n      contentContainerStyle={{ flexGrow: 1 }}\n    /\u003e\n  );\n}\n```\n\n성능 옵션:\n\n```tsx\n\u003cFlatList\n  initialNumToRender={10}\n  windowSize={7}\n  removeClippedSubviews\n  getItemLayout={(_, index) =\u003e ({\n    length: ROW_HEIGHT,\n    offset: ROW_HEIGHT * index,\n    index,\n  })}\n/\u003e\n```\n\n`getItemLayout`은 고정 높이일 때 스크롤 측정 비용을 줄인다.\n\n### 최적화 팁\n\n- `renderItem`은 가능하면 `memo`된 행 컴포넌트\n- 인라인 `() =\u003e {}` / 인라인 style 과다 주의\n- `extraData`로 선택 상태 등 리렌더 트리거\n- 이미지 많으면 `expo-image` + 적절한 크기\n\n```bash\nnpx expo install @shopify/flash-list\n```\n\n---\n\n## 3. Pull to refresh / 무한 스크롤\n\n```tsx\nconst [refreshing, setRefreshing] = useState(false);\n\n\u003cFlatList\n  refreshing={refreshing}\n  onRefresh={async () =\u003e {\n    setRefreshing(true);\n    await refetch();\n    setRefreshing(false);\n  }}\n  onEndReached={loadMore}\n  onEndReachedThreshold={0.3}\n  ListFooterComponent={isFetchingNextPage ? \u003cActivityIndicator /\u003e : null}\n/\u003e\n```\n\n페이지 데이터는 React Query `useInfiniteQuery`와 잘 맞는다 .\n\n---\n\n## 4. Expo Router — 파일 기반 라우팅\n\n```\napp/\n├── _layout.tsx          # 루트 레이아웃\n├── index.tsx            # /\n├── (auth)/\n│   ├── _layout.tsx\n│   ├── login.tsx\n│   └── signup.tsx\n├── (tabs)/\n│   ├── _layout.tsx\n│   ├── index.tsx        # 홈 탭\n│   └── settings.tsx\n└── posts/\n    ├── index.tsx\n    └── [id].tsx         # 동적 세그먼트\n```\n\n```tsx\n// app/_layout.tsx\nimport { Stack } from 'expo-router';\n\nexport default function RootLayout() {\n  return (\n    \u003cStack screenOptions={{ headerShown: false }}\u003e\n      \u003cStack.Screen name=\"(tabs)\" /\u003e\n      \u003cStack.Screen name=\"(auth)\" /\u003e\n      \u003cStack.Screen name=\"posts/[id]\" options={{ headerShown: true, title: 'Post' }} /\u003e\n    \u003c/Stack\u003e\n  );\n}\n```\n\n```tsx\n// app/(tabs)/_layout.tsx\nimport { Tabs } from 'expo-router';\n\nexport default function TabsLayout() {\n  return (\n    \u003cTabs\u003e\n      \u003cTabs.Screen name=\"index\" options={{ title: 'Home' }} /\u003e\n      \u003cTabs.Screen name=\"settings\" options={{ title: 'Settings' }} /\u003e\n    \u003c/Tabs\u003e\n  );\n}\n```\n\n---\n\n## 5. 이동과 파라미터\n\n```tsx\nimport { Link, router, useLocalSearchParams } from 'expo-router';\n\n\u003cLink href={`/posts/${id}`}\u003e열기\u003c/Link\u003e\n\nrouter.push(`/posts/${id}`);\nrouter.replace('/login');\nrouter.back();\n```\n\n```tsx\n// app/posts/[id].tsx\nexport default function PostDetail() {\n  const { id } = useLocalSearchParams\u003c{ id: string }\u003e();\n  return \u003cText\u003ePost {id}\u003c/Text\u003e;\n}\n```\n\n객체 전달이 필요하면 쿼리/전역 상태/미리 fetch된 캐시를 쓰고, 거대한 객체를 라우트 params에 넣지 않는다.\n\nTyped routes: Expo Router의 typed routes 옵션을 켜면 `href` 자동완성이 좋아진다.\n\n---\n\n## 6. 인증 가드 레이아웃\n\n```tsx\n// app/_layout.tsx 개념\nconst { user, isLoading } = useAuth();\n\nif (isLoading) return \u003cSplash /\u003e;\n\nreturn (\n  \u003cStack\u003
