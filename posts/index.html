e\n    \u003cStack.Protected guard={!!user}\u003e\n      \u003cStack.Screen name=\"(tabs)\" /\u003e\n    \u003c/Stack.Protected\u003e\n    \u003cStack.Protected guard={!user}\u003e\n      \u003cStack.Screen name=\"(auth)\" /\u003e\n    \u003c/Stack.Protected\u003e\n  \u003c/Stack\u003e\n);\n```\n\n(버전별 API는 `Redirect` + 세그먼트 분기로도 구현 가능)\n\n```tsx\nif (!user) return \u003cRedirect href=\"/login\" /\u003e;\n```\n\n---\n\n## 7. 딥링크\n\n`app.json`의 `scheme`: `myapp://posts/1`  \nUniversal Links / App Links는 EAS·도메인 검증이 필요 (운영 배포 문서 참고).\n\n---\n\n## 연습\n\n1. `FlatList`로 50개 이상 아이템 리스트를 만든다.\n2. pull-to-refresh와 empty 상태를 구현한다.\n3. Expo Router로 탭 + 상세(`[id]`) 화면을 연결한다.\n4. 로그인 여부에 따라 `(auth)` / `(tabs)`로 분기한다.\n"])</script><script>self.__next_f.push([1,"30:T128f,"])</script><script>self.__next_f.push([1,"# 네트워킹 — Fetch, React Query, 에러 처리\n\n\u003e 요약: API 클라이언트를 정리하고, TanStack Query로 캐시·로딩·에러·재시도를 표준화한다.\n\n---\n\n---\n\n## 1. 서버 상태 vs 클라이언트 상태\n\n- **서버 상태**: 게시글 목록, 프로필, 설정(서버 원본) → React Query\n- **클라이언트 상태**: 모달 open, 토글, 마법사 단계 → useState/Zustand\n\n둘을 `useState` 하나로 섞으면 로딩/캐시/동기화 버그가 는다.\n\n---\n\n## 2. fetch 래퍼\n\n```tsx\n// lib/api.ts\nconst API_URL = process.env.EXPO_PUBLIC_API_URL;\n\nexport class ApiError extends Error {\n  constructor(\n    public status: number,\n    message: string,\n    public body?: unknown,\n  ) {\n    super(message);\n  }\n}\n\nexport async function api\u003cT\u003e(\n  path: string,\n  options: RequestInit \u0026 { token?: string } = {},\n): Promise\u003cT\u003e {\n  const { token, headers, ...rest } = options;\n\n  const res = await fetch(`${API_URL}${path}`, {\n    ...rest,\n    headers: {\n      'Content-Type': 'application/json',\n      ...(token ? { Authorization: `Bearer ${token}` } : {}),\n      ...headers,\n    },\n  });\n\n  if (!res.ok) {\n    const body = await res.json().catch(() =\u003e undefined);\n    throw new ApiError(res.status, 'Request failed', body);\n  }\n\n  if (res.status === 204) return undefined as T;\n  return res.json() as Promise\u003cT\u003e;\n}\n```\n\nExpo 환경변수: `EXPO_PUBLIC_*` 만 클라이언트에 노출. 비밀키는 넣지 말 것.\n\n```env\nEXPO_PUBLIC_API_URL=https://api.example.com\n```\n\n---\n\n## 3. TanStack Query 세팅\n\n```bash\nnpx expo install @tanstack/react-query\n```\n\n```tsx\n// app/_layout.tsx\nimport { QueryClient, QueryClientProvider } from '@tanstack/react-query';\n\nconst queryClient = new QueryClient({\n  defaultOptions: {\n    queries: {\n      staleTime: 30_000,\n      retry: 1,\n    },\n  },\n});\n\nexport default function RootLayout() {\n  return (\n    \u003cQueryClientProvider client={queryClient}\u003e\n      {/* Stack / Slot */}\n    \u003c/QueryClientProvider\u003e\n  );\n}\n```\n\n---\n\n## 4. useQuery / useMutation\n\n```tsx\nimport { useQuery, useMutation, useQueryClient } from '@tanstack/react-query';\n\nfunction usePosts() {\n  return useQuery({\n    queryKey: ['posts'],\n    queryFn: () =\u003e api\u003cPost[]\u003e('/posts'),\n  });\n}\n\nfunction useCreatePost() {\n  const qc = useQueryClient();\n  return useMutation({\n    mutationFn: (input: CreatePostInput) =\u003e\n      api\u003cPost\u003e('/posts', { method: 'POST', body: JSON.stringify(input), token }),\n    onSuccess: () =\u003e qc.invalidateQueries({ queryKey: ['posts'] }),\n  });\n}\n```\n\n화면:\n\n```tsx\nconst { data, isPending, isError, error, refetch } = usePosts();\n\nif (isPending) return \u003cActivityIndicator /\u003e;\nif (isError) return \u003cErrorView message={error.message} onRetry={refetch} /\u003e;\nreturn \u003cPostList data={data} /\u003e;\n```\n\n---\n\n## 5. 무한 스크롤\n\n```tsx\nconst {\n  data,\n  fetchNextPage,\n  hasNextPage,\n  isFetchingNextPage,\n} = useInfiniteQuery({\n  queryKey: ['posts', 'infinite'],\n  initialPageParam: 1,\n  queryFn: ({ pageParam }) =\u003e api\u003cPostPage\u003e(`/posts?page=${pageParam}`),\n  getNextPageParam: (last) =\u003e last.nextPage ?? undefined,\n});\n\nconst items = data?.pages.flatMap((p) =\u003e p.items) ?? [];\n```\n\n`FlatList`의 `onEndReached`와 연결.\n\n---\n\n## 6. 포커스·온라인 리패치\n\nRN에서는 앱 포커스 이벤트를 Query에 알려주면 좋다.\n\n```tsx\nimport { focusManager } from '@tanstack/react-query';\nimport { AppState } from 'react-native';\n\nfocusManager.setEventListener((handleFocus) =\u003e {\n  const sub = AppState.addEventListener('change', (state) =\u003e {\n    handleFocus(state === 'active');\n  });\n  return () =\u003e sub.remove();\n});\n```\n\n---\n\n## 7. 인증 토큰과 401\n\n- 토큰은 `expo-secure-store`에 저장 (SecureStore)\n- `api()`에서 401 → 토큰 갱신 또는 로그아웃 로그아웃\n- Query `queryFn`이 토큰을 읽도록 훅에서 주입\n\n```tsx\nuseQuery({\n  queryKey: ['me'],\n  queryFn: () =\u003e api('/me', { token }),\n  enabled: !!token,\n});\n```\n\n---\n\n## 8. UX 상태 설계\n\n| 상태 | UI |\n|------|----|\n| pending (최초) | 스켈레톤/스피너 |\n| error | 메시지 + 재시도 |\n| empty | 빈 화면 CTA |\n| fetching (백그라운드) | 리스트 유지 + 약한 인디케이터 |\n| mutation pending | 버튼 비활성 |\n\n에러를 `alert()`만으로 처리하지 말고, 화면 수준 폴백을 둔다.\n\n---\n\n## 9. 개발 도구\n\n- TanStack Query Devtools (웹 쪽에 가깝지만 로깅으로 대체 가능)\n- 네트워크: Charles / Proxyman / Flipper 대안들\n- API 타입: openapi-typescript로 클라이언트 타입 생성\n\n---\n\n## 연습\n\n1. `api()` 헬퍼와 `ApiError`를 만든다.\n2. 게시글 목록 `useQuery` + 에러/로딩 UI를 구현한다.\n3. 생성 `useMutation` 후 목록 invalidate.\n4. `useInfiniteQuery` + FlatList 무한 스크롤을 연결한다.\n"])</script><script>self.__next_f.push([1,"31:T1644,"])</script><script>self.__next_f.push([1,"# 인증·보안 저장소·디바이스 권한\n\n\u003e 요약: 토큰 안전 저장, 세션 복구, 생체인증·앱 권한(카메라/앨범/알림)의 현대적 패턴을 익힌다.\n\n---\n\n---\n\n## 1. 하지 말 것 / 할 것\n\n| 금지 | 권장 |\n|------|------|\n| AsyncStorage에 access token 평문 (민감) | **SecureStore** / Keychain |\n| 소스에 API 시크릿 | 백엔드만 보유 |\n| 로그에 토큰·PII | 마스킹 |\n| 모든 권한 앱 시작 시 요청 | **필요 시점(just-in-time)** 요청 |\n\n---\n\n## 2. Expo SecureStore\n\n```bash\nnpx expo install expo-secure-store\n```\n\n```tsx\nimport * as SecureStore from 'expo-secure-store';\n\nconst TOKEN_KEY = 'access_token';\n\nexport async function saveToken(token: string) {\n  await SecureStore.setItemAsync(TOKEN_KEY, token);\n}\n\nexport async function loadToken() {\n  return SecureStore.getItemAsync(TOKEN_KEY);\n}\n\nexport async function clearToken() {\n  await SecureStore.deleteItemAsync(TOKEN_KEY);\n}\n```\n\n큰 JSON blob·리프레시 로직은 설계를 단순하게.  \n웹 타깃이 있으면 SecureStore 미지원 → Platform 분기 또는 쿠키 세션.\n\n---\n\n## 3. Auth Provider 패턴\n\n```tsx\ntype AuthState = {\n  user: User | null;\n  token: string | null;\n  isLoading: boolean;\n  signIn: (email: string, password: string) =\u003e Promise\u003cvoid\u003e;\n  signOut: () =\u003e Promise\u003cvoid\u003e;\n};\n\nconst AuthContext = createContext\u003cAuthState | null\u003e(null);\n\nexport function AuthProvider({ children }: { children: React.ReactNode }) {\n  const [token, setToken] = useState\u003cstring | null\u003e(null);\n  const [user, setUser] = useState\u003cUser | null\u003e(null);\n  const [isLoading, setIsLoading] = useState(true);\n\n  useEffect(() =\u003e {\n    (async () =\u003e {\n      const t = await loadToken();\n      if (t) {\n        setToken(t);\n        try {\n          setUser(await api\u003cUser\u003e('/me', { token: t }));\n        } catch {\n          await clearToken();\n        }\n      }\n      setIsLoading(false);\n    })();\n  }, []);\n\n  const signIn = async (email: string, password: string) =\u003e {\n    const res = await api\u003c{ token: string; user: User }\u003e('/auth/login', {\n      method: 'POST',\n      body: JSON.stringify({ email, password }),\n    });\n    await saveToken(res.token);\n    setToken(res.token);\n    setUser(res.user);\n  };\n\n  const signOut = async () =\u003e {\n    await clearToken();\n    setToken(null);\n    setUser(null);\n  };\n\n  return (\n    \u003cAuthContext.Provider value={{ user, token, isLoading, signIn, signOut }}\u003e\n      {children}\n    \u003c/AuthContext.Provider\u003e\n  );\n}\n\nexport function useAuth() {\n  const ctx = useContext(AuthContext);\n  if (!ctx) throw new Error('AuthProvider missing');\n  return ctx;\n}\n```\n\n스플래시: `isLoading` 동안 라우트 가드를 보류해 깜빡임을 줄인다.  \n`expo-splash-screen`으로 네이티브 스플래시를 유지할 수 있다.\n\n---\n\n## 4. OAuth / 소셜 로그인\n\n```bash\nnpx expo install expo-auth-session expo-web-browser expo-crypto\n```\n\nAuthSession + 백엔드 교환 코드 방식이 안전하다.  \n클라이언트에서 곧장 장기 시크릿을 쓰지 말고, **인가 코드를 서버에 전달**해 토큰을 받는다.\n\n---\n\n## 5. 생체 인증 (선택)\n\n```bash\nnpx expo install expo-local-authentication\n```\n\n```tsx\nimport * as LocalAuthentication from 'expo-local-authentication';\n\nconst ok = await LocalAuthentication.authenticateAsync({\n  promptMessage: '잠금 해제',\n});\nif (ok.success) {\n  // 앱 잠금 해제 / 민감 화면\n}\n```\n\n생체정보는 로컬 잠금용. 서버 로그인 대체로 착각하지 말 것.\n\n---\n\n## 6. 권한 — 카메라·미디어·알림\n\n```bash\nnpx expo install expo-image-picker expo-camera expo-notifications\n```\n\n```tsx\nimport * as ImagePicker from 'expo-image-picker';\n\nconst perm = await ImagePicker.requestMediaLibraryPermissionsAsync();\nif (!perm.granted) {\n  // 설정 앱으로 유도하는 UI\n  return;\n}\n\nconst result = await ImagePicker.launchImageLibraryAsync({\n  mediaTypes: ['images'],\n  quality: 0.8,\n});\n```\n\n권한 거부 시:\n\n1. 왜 필요한지 설명 (pre-prompt)\n2. 시스템 다이얼로그\n3. 거부되면 설정 이동 안내 (`Linking.openSettings()`)\n\n`app.json` / config plugins에 용도 설명 문자열(usage description) 필수.\n\n```json\n{\n  \"expo\": {\n    \"plugins\": [\n      [\n        \"expo-image-picker\",\n        {\n          \"photosPermission\": \"프로필 사진을 업로드하려면 사진첩 접근이 필요합니다.\"\n        }\n      ]\n    ],\n    \"ios\": {\n      \"infoPlist\": {\n        \"NSCameraUsageDescription\": \"게시글에 사진을 찍기 위해 카메라가 필요합니다.\"\n      }\n    }\n  }\n}\n```\n\n---\n\n## 7. 푸시 알림 (개요)\n\n```tsx\nimport * as Notifications from 'expo-notifications';\nimport Constants from 'expo-constants';\n\nconst { status } = await Notifications.requestPermissionsAsync();\nconst token = (\n  await Notifications.getExpoPushTokenAsync({\n    projectId: Constants.expoConfig?.extra?.eas?.projectId,\n  })\n).data;\n// token을 서버에 등록\n```\n\n실기기에서 테스트. 에뮬레이터 제약이 있다.  \n알림 탭 → 딥링크 라우팅은 딥링크·배포 설정과 연결한다.\n\n---\n\n## 8. 보안 체크리스트\n\n- [ ] 토큰 SecureStore\n- [ ] HTTPS만\n- [ ] 인증서 핀닝은 고보안 앱에서 검토\n- [ ] jailbreak/root 탐지는 필요 시(과도한 신뢰 금지)\n- [ ] 스크린샷 방지 등은 OS별 한계 이해\n- [ ] 로그아웃아웃 시 쿼리 캐시 clear\n\n```tsx\nqueryClient.clear();\n```\n\n---\n\n## 연습\n\n1. SecureStore 기반 로그인/자동 로그인/로그아웃을 구현한다.\n2. `AuthProvider` + Router 가드를 연결한다.\n3. 이미지 피커 권한 플로우(거절 안내 포함)를 만든다.\n4. (선택) 앱 포그라운드 복귀 시 생체 잠금을 추가한다.\n"])</script><script>self.__next_f.push([1,"32:T127b,"])</script><script>self.__next_f.push([1,"# 애니메이션·제스처·사용자 경험\n\n\u003e 요약: Reanimated와 Gesture Handler로 부드러운 60fps 인터랙션을 만들고, 접근성·햅틱까지 챙긴다.\n\n---\n\n---\n\n## 1. 왜 RN Animated만으로 부족한가\n\n구 `Animated` API도 쓸 수 있지만, 복잡한 제스처·UI 스레드는 **react-native-reanimated** + **react-native-gesture-handler**가 사실상 표준이다.  \nExpo 템플릿에 이미 포함되는 경우가 많다.\n\n```bash\nnpx expo install react-native-reanimated react-native-gesture-handler react-native-safe-area-context\n```\n\nBabel 플러그인(`reanimated/plugin`은 **마지막**)과 루트에서 GestureHandlerRootView가 필요하다.\n\n```tsx\nimport { GestureHandlerRootView } from 'react-native-gesture-handler';\n\nexport default function Root() {\n  return \u003cGestureHandlerRootView style={{ flex: 1 }}\u003e{/* app */}\u003c/GestureHandlerRootView\u003e;\n}\n```\n\n---\n\n## 2. Reanimated 기본\n\n```tsx\nimport Animated, {\n  useSharedValue,\n  useAnimatedStyle,\n  withSpring,\n} from 'react-native-reanimated';\nimport { Pressable } from 'react-native';\n\nexport function BounceButton({ children }: { children: React.ReactNode }) {\n  const scale = useSharedValue(1);\n\n  const style = useAnimatedStyle(() =\u003e ({\n    transform: [{ scale: scale.value }],\n  }));\n\n  return (\n    \u003cPressable\n      onPressIn={() =\u003e {\n        scale.value = withSpring(0.96);\n      }}\n      onPressOut={() =\u003e {\n        scale.value = withSpring(1);\n      }}\n    \u003e\n      \u003cAnimated.View style={style}\u003e{children}\u003c/Animated.View\u003e\n    \u003c/Pressable\u003e\n  );\n}\n```\n\n핵심 개념:\n\n- `useSharedValue`: UI 스레드에서 읽히는 값\n- `useAnimatedStyle`: 공유 값 → 스타일\n- `withTiming` / `withSpring` / `withSequence`\n- worklet: `'worklet';` 지시로 UI 스레드 실행\n\nJS 스레드 `setState`로 매 프레임 애니메이션 하면 버벅인다.\n\n---\n\n## 3. 제스처\n\n```tsx\nimport { Gesture, GestureDetector } from 'react-native-gesture-handler';\nimport Animated, { useSharedValue, useAnimatedStyle } from 'react-native-reanimated';\n\nexport function Draggable() {\n  const x = useSharedValue(0);\n  const y = useSharedValue(0);\n\n  const pan = Gesture.Pan().onChange((e) =\u003e {\n    x.value += e.changeX;\n    y.value += e.changeY;\n  });\n\n  const style = useAnimatedStyle(() =\u003e ({\n    transform: [{ translateX: x.value }, { translateY: y.value }],\n  }));\n\n  return (\n    \u003cGestureDetector gesture={pan}\u003e\n      \u003cAnimated.View style={[{ width: 80, height: 80, backgroundColor: '#38bdf8' }, style]} /\u003e\n    \u003c/GestureDetector\u003e\n  );\n}\n```\n\n실무 패턴: 하단 시트, 스와이프 삭제, 핀치 줌, 카드 스택.\n\n```tsx\nGesture.Simultaneous(pan, pinch);\nGesture.Exclusive(native, swipe);\n```\n\n---\n\n## 4. 레이아웃 애니메이션\n\n리스트 추가/삭제 시:\n\n```tsx\nimport Animated, { LinearTransition, FadeIn, FadeOut } from 'react-native-reanimated';\n\n\u003cAnimated.View\n  entering={FadeIn}\n  exiting={FadeOut}\n  layout={LinearTransition}\n\u003e\n  ...\n\u003c/Animated.View\u003e\n```\n\n과도한 진입 애니메이션은 피로감을 준다. **의미 있는 피드백**에만.\n\n---\n\n## 5. 내비 전환\n\nExpo Router / React Navigation의 native stack은 플랫폼 전환이 기본으로 좋다.  \n커스텀이 필요하면 shared element / 커스텀 트랜지션을 제한적으로.\n\n모달:\n\n```tsx\n\u003cStack.Screen\n  name=\"compose\"\n  options={{ presentation: 'modal' }}\n/\u003e\n```\n\n---\n\n## 6. 햅틱·사운드\n\n```bash\nnpx expo install expo-haptics\n```\n\n```tsx\nimport * as Haptics from 'expo-haptics';\n\nawait Haptics.impactAsync(Haptics.ImpactFeedbackStyle.Light);\nawait Haptics.notificationAsync(Haptics.NotificationFeedbackType.Success);\n```\n\n성공/삭제/토글에 약하게. 남발 금지.\n\n---\n\n## 7. 스켈레톤·낙관적 UI\n\n- 로딩: 스피너보다 **스켈레톤**이 체감이 좋음\n- mutation: 낙관적 업데이트 + 실패 롤백 (React Query)\n- 버튼: pressed 스케일·opacity\n\n```tsx\nstyle={({ pressed }) =\u003e [{ opacity: pressed ? 0.7 : 1 }]}\n```\n\n---\n\n## 8. 접근성 \u0026 모션 감소\n\n```tsx\nimport { AccessibilityInfo } from 'react-native';\nimport { reduceMotion } from 'react-native-reanimated'; // 버전별 API 확인\n```\n\nOS “동작 줄이기”가 켜져 있으면 큰 애니메이션을 스킵하는 것이 좋다.  \n스크린 리더용 `accessibilityLabel`, 포커스 순서도 함께.\n\n---\n\n## 9. 성능 주의\n\n- 애니메이션 중 무거운 JS 금지\n- `console.log` 남발 금지 (특히 worklet)\n- 이미지·섀도우 과다 주의\n- `memo`로 리스트 행 보호\n\n---\n\n## 연습\n\n1. Pressable 스프링 스케일 버튼을 만든다.\n2. 스와이프로 삭제할 수 있는 리스트 행을 구현한다.\n3. 모달 화면 `presentation: 'modal'`을 추가한다.\n4. 주요 CTA에 햅틱 피드백을 붙인다.\n"])</script><script>self.__next_f.push([1,"33:T1112,"])</script><script>self.__next_f.push([1,"# 상태 관리·아키텍처·모듈화\n\n\u003e 요약: 전역 상태를 최소화하고, Feature 단위 구조와 Zustand/Context 선택 기준을 익힌다.\n\n---\n\n---\n\n## 1. 상태 배치 우선순위\n\n1. 로컬 `useState`\n2. URL/라우트 파라미터 (공유 가능·북마크 가능한 UI)\n3. React Query (서버 상태)\n4. Context (드문 저빈도 전역: theme, auth 세션)\n5. Zustand/Jotai 등 (클라이언트 전역이 명확할 때)\n6. Redux Toolkit (이미 팀 표준이거나 매우 복잡한 클라이언트 워크플로)\n\n**모든 것을 Redux에 넣지 않는다.** RN 신입 프로젝트가 가장 많이 하는 실수다.\n\n---\n\n## 2. Context — 언제 OK\n\n```tsx\nconst ThemeContext = createContext\u003c{ mode: 'light' | 'dark'; toggle: () =\u003e void } | null\u003e(null);\n\nexport function ThemeProvider({ children }: { children: React.ReactNode }) {\n  const [mode, setMode] = useState\u003c'light' | 'dark'\u003e('light');\n  const value = useMemo(\n    () =\u003e ({ mode, toggle: () =\u003e setMode((m) =\u003e (m === 'light' ? 'dark' : 'light')) }),\n    [mode],\n  );\n  return \u003cThemeContext.Provider value={value}\u003e{children}\u003c/ThemeContext.Provider\u003e;\n}\n```\n\n주의: value가 자주 바뀌면 구독 컴포넌트가 전부 리렌더.  \n고빈도 상태(스크롤 위치, 매 키입력)는 Context에 두지 말 것.\n\n---\n\n## 3. Zustand — 가벼운 전역\n\n```bash\nnpx expo install zustand\n```\n\n```tsx\nimport { create } from 'zustand';\nimport { persist, createJSONStorage } from 'zustand/middleware';\nimport AsyncStorage from '@react-native-async-storage/async-storage';\n\ntype CartState = {\n  items: Record\u003cstring, number\u003e;\n  add: (id: string) =\u003e void;\n  clear: () =\u003e void;\n};\n\nexport const useCart = create\u003cCartState\u003e()(\n  persist(\n    (set) =\u003e ({\n      items: {},\n      add: (id) =\u003e\n        set((s) =\u003e ({ items: { ...s.items, [id]: (s.items[id] ?? 0) + 1 } })),\n      clear: () =\u003e set({ items: {} }),\n    }),\n    {\n      name: 'cart',\n      storage: createJSONStorage(() =\u003e AsyncStorage),\n    },\n  ),\n);\n```\n\n민감 토큰은 AsyncStorage persist 금지 → SecureStore + Auth 흐름.\n\n셀렉터로 리렌더 최소화:\n\n```tsx\nconst count = useCart((s) =\u003e s.items[id] ?? 0);\n```\n\n---\n\n## 4. 폴더 구조 제안 (Feature-first)\n\n```\nsrc/\n├── app/                 # expo-router 엔트리 (또는 루트 app/)\n├── features/\n│   ├── auth/\n│   │   ├── api.ts\n│   │   ├── hooks.ts\n│   │   ├── screens/\n│   │   └── components/\n│   ├── posts/\n│   └── cart/\n├── components/          # 디자인 시스템급 공용 UI\n├── lib/                 # api client, storage\n├── constants/\n└── types/\n```\n\n화면 파일은 얇게, 비즈니스는 `features/*`로.\n\n---\n\n## 5. 컴포넌트 설계 원칙\n\n- Presentational vs Container를 과도히 나누기보다 **훅으로 로직 분리**\n- props drilling 3단 넘어가면 합성·훅·작은 store 검토\n- 날짜/가격 포맷은 `lib/format.ts`로 일원화\n- 매직 넘버·카피 문자열 상수화 (i18n 대비)\n\n```tsx\n// features/posts/hooks.ts\nexport function usePost(id: string) {\n  return useQuery({\n    queryKey: ['posts', id],\n    queryFn: () =\u003e api\u003cPost\u003e(`/posts/${id}`),\n  });\n}\n```\n\n---\n\n## 6. 에러 경계\n\n```tsx\nimport { ErrorBoundary } from 'react-error-boundary';\n\n\u003cErrorBoundary FallbackComponent={ScreenError} onReset={resetApp}\u003e\n  \u003cApp /\u003e\n\u003c/ErrorBoundary\u003e\n```\n\n치명 렌더 크래시가 흰 화면으로 끝나지 않게.  \n라우트 단위로 경계를 나누면 전체가 죽지 않는다.\n\n---\n\n## 7. 환경·설정\n\n```ts\n// app.config.ts\nimport { ExpoConfig, ConfigContext } from 'expo/config';\n\nexport default ({ config }: ConfigContext): ExpoConfig =\u003e ({\n  ...config,\n  name: 'MyApp',\n  slug: 'my-app',\n  extra: {\n    appEnv: process.env.APP_ENV ?? 'development',\n    eas: { projectId: '...' },\n  },\n});\n```\n\ndev / staging / prod 번들 ID·API URL을 분리한다 (EAS profile).\n\n---\n\n## 8. 품질 도구\n\n```bash\nnpx expo install eslint prettier\n# 또는 expo lint\n```\n\n- TypeScript `strict`\n- ESLint + import order\n- absolute import (`@/`)\n- Husky + lint-staged (팀)\n\n---\n\n## 연습\n\n1. Feature 폴더로 `posts` 모듈을 재배치한다.\n2. Zustand로 장바구니(또는 최근 검색어)를 persist한다.\n3. Theme Context로 라이트/다크를 토글한다.\n4. 라우트 단위 ErrorBoundary를 추가한다.\n"])</script><script>self.__next_f.push([1,"34:Tf29,"])</script><script>self.__next_f.push([1,"# 테스트·디버깅·성능\n\n\u003e 요약: 컴포넌트/통합 테스트와 디버깅 도구를 쓰고, 리스트·렌더·번들 성능을 체계적으로 개선한다.\n\n---\n\n---\n\n## 1. 테스트 피라미드 (RN)\n\n| 종류 | 도구 | 목적 |\n|------|------|------|\n| 단위 | Jest + Testing Library | 컴포넌트·훅·포맷터 |\n| 컴포넌트 | `@testing-library/react-native` | 사용자 관점 UI |\n| E2E | Maestro / Detox | 핵심 플로우 |\n\nExpo는 Jest 프리셋 설정이 잘 문서화되어 있다.\n\n```bash\nnpx expo install jest-expo @testing-library/react-native --dev\n```\n\n---\n\n## 2. Testing Library 예\n\n```tsx\nimport { render, screen, userEvent } from '@testing-library/react-native';\nimport { LoginForm } from '../LoginForm';\n\ntest('validates email', async () =\u003e {\n  const user = userEvent.setup();\n  const onSubmit = jest.fn();\n\n  render(\u003cLoginForm onSubmit={onSubmit} /\u003e);\n\n  await user.type(screen.getByPlaceholderText('email'), 'not-an-email');\n  await user.type(screen.getByPlaceholderText('password'), 'password123');\n  await user.press(screen.getByText('로그인'));\n\n  expect(screen.getByText(/이메일/i)).toBeTruthy();\n  expect(onSubmit).not.toHaveBeenCalled();\n});\n```\n\n쿼리 우선순위: **접근성 역할/라벨** → 텍스트 → testID(최후).\n\n```tsx\n\u003cPressable accessibilityRole=\"button\" accessibilityLabel=\"장바구니 담기\" /\u003e\n```\n\n---\n\n## 3. 네비·Query 테스트\n\n- `QueryClient`를 테스트용으로 감싸 `retry: false`\n- Expo Router는 공식 테스트 가이드/`renderRouter` 유틸 참고\n- SecureStore·fetch는 mock\n\n```tsx\njest.mock('expo-secure-store', () =\u003e ({\n  getItemAsync: jest.fn(),\n  setItemAsync: jest.fn(),\n  deleteItemAsync: jest.fn(),\n}));\n```\n\n---\n\n## 4. E2E — Maestro\n\nYAML 플로우로 실기기/에뮬 조작:\n\n```yaml\nappId: com.example.myapp\n---\n- launchApp\n- tapOn: '로그인'\n- inputText: 'user@example.com'\n- tapOn: '제출'\n- assertVisible: '홈'\n```\n\nDetox는 더 강력하지만 설정 비용이 크다. 팀 규모에 맞게.\n\n---\n\n## 5. 디버깅\n\n- React Native DevTools (최신 RN)\n- `console.log` 남발 대신 구조화 로그\n- 네트워크: API 로깅 미들웨어 (개발만)\n- 에러: Log 박스 / LogRocket·Sentry\n\n```bash\nnpx expo start\n# shift+m 등 개발 메뉴 (환경별)\n```\n\nTypeError 스택이 minified면 source map이 있는 빌드 프로파일 사용.\n\n---\n\n## 6. 성능 — 측정이 먼저\n\n의심 가는 것부터 최적화하지 말고:\n\n1. JS FPS / UI FPS\n2. 불필요 리렌더 (why-did-you-render, memo 검토)\n3. 리스트 가상화\n4. 이미지 크기·포맷\n5. 번들 크기\n\n### 리스트\n\n- FlatList/FlashList\n- 안정적 `keyExtractor`\n- 행 `React.memo`\n- 이미지 다운샘플\n\n### 리렌더\n\n```tsx\nconst selectCount = (s: CartState) =\u003e s.items[id] ?? 0;\nconst count = useCart(selectCount);\n```\n\n컨텍스트 value `useMemo`, 콜백 `useCallback`은 **측정 후** 필요한 곳에.\n\n### 이미지·애니메이션\n\n- `expo-image`\n- Reanimated (UI 스레드)\n- 무거운 blur/shadow 절제\n\n---\n\n## 7. 번들·기동\n\n```bash\nnpx expo export --dump-sourcemap\n# 또는 번들 분석 도구\n```\n\n- 과도한 barrel `index.ts` re-export 주의\n- 큰 라이브러리 대체/지연 로딩\n- Hermes 엔진 (Expo 기본에 가깝게)\n\n기동 최적화: 스플래시 동안 필수 데이터만, 나머지는 화면 단위 fetch.\n\n---\n\n## 8. 모니터링\n\n```bash\nnpx expo install @sentry/react-native\n```\n\n- 크래시·논크래시 예외\n- 릴리즈 버전 매핑 (EAS build number)\n- 브레드크럼: 화면 전환, API 실패\n- 개인정보 스크러빙\n\n---\n\n## 연습\n\n1. LoginForm 단위 테스트 2개(성공/실패)를 작성한다.\n2. SecureStore·fetch를 mock한 Auth 훅 테스트를 만든다.\n3. FlashList/FlatList 행을 memo로 최적화하고 스크롤을 비교한다.\n4. (선택) Maestro로 로그인→홈 플로우를 자동화한다.\n"])</script><script>self.__next_f.push([1,"35:T14ef,"])</script><script>self.__next_f.push([1,"# EAS 빌드·스토어 배포·OTA\n\n\u003e 요약: EAS Build/Submit/Update로 스토어 출시와 OTA 핫픽스 파이프라인을 구성하고, 프로덕션 체크리스트를 점검한다.\n\n---\n\n---\n\n## 1. 로컬 빌드 vs EAS\n\n| 방식 | 설명 |\n|------|------|\n| Expo Go | 프로토타입 — 커스텀 네이티브 제한 |\n| Development Build | 실기기에서 네이티브 모듈 포함 개발 |\n| EAS Build | 클라우드에서 IPA/AAB 생성 (**실무 기본**) |\n| 로컬 prebuild | `npx expo prebuild` 후 Xcode/Gradle |\n\n```bash\nnpm i -g eas-cli\neas login\neas build:configure\n```\n\n---\n\n## 2. Development Build\n\nExpo Go로 부족하면:\n\n```bash\nnpx expo install expo-dev-client\neas build --profile development --platform android\n```\n\n팀원에게 같은 네이티브 바이너리를 배포하고, JS는 Metro로 개발.\n\n---\n\n## 3. eas.json 프로파일\n\n```json\n{\n  \"cli\": { \"version\": \"\u003e= 12.0.0\" },\n  \"build\": {\n    \"development\": {\n      \"developmentClient\": true,\n      \"distribution\": \"internal\"\n    },\n    \"preview\": {\n      \"distribution\": \"internal\",\n      \"android\": { \"buildType\": \"apk\" }\n    },\n    \"production\": {\n      \"autoIncrement\": true\n    }\n  },\n  \"submit\": {\n    \"production\": {}\n  }\n}\n```\n\n환경변수:\n\n```bash\neas secret:create\n# 또는 EAS env\n```\n\n`EXPO_PUBLIC_API_URL`을 프로파일별로 다르게.\n\n---\n\n## 4. 스토어 제출\n\n```bash\neas build --platform ios --profile production\neas build --platform android --profile production\neas submit --platform ios\neas submit --platform android\n```\n\n준비물:\n\n- Apple Developer / App Store Connect\n- Google Play Console\n- 아이콘·스플래시·스크린샷·개인정보 고지\n- 번들 ID / applicationId 확정 (나중에 바꾸기 어려움)\n\n`app.json`:\n\n```json\n{\n  \"expo\": {\n    \"ios\": { \"bundleIdentifier\": \"com.example.myapp\" },\n    \"android\": { \"package\": \"com.example.myapp\", \"versionCode\": 1 },\n    \"version\": \"1.0.0\"\n  }\n}\n```\n\n버전: 사용자 보이는 `version` + 스토어 빌드 번호(autoIncrement 추천).\n\n---\n\n## 5. OTA — EAS Update\n\n네이티브 코드 변경이 없으면 JS/에셋만 OTA로 배포 가능.\n\n```bash\nnpx expo install expo-updates\neas update --branch production --message \"Fix checkout crash\"\n```\n\n주의:\n\n- 네이티브 모듈 추가/권한/SDK 업은 **스토어 빌드** 필요\n- runtimeVersion 정책으로 호환 바이너리에만 업데이트\n- 강제 업데이트 UX(너무 오래된 바이너리) 설계\n\n```json\n{\n  \"expo\": {\n    \"runtimeVersion\": { \"policy\": \"appVersion\" },\n    \"updates\": { \"url\": \"https://u.expo.dev/...\" }\n  }\n}\n```\n\n---\n\n## 6. CI (GitHub Actions 개념)\n\n1. PR: lint + test typecheck\n2. `main`: preview build (internal)\n3. 태그/릴리즈: production build + submit\n4. 핫픽스: `eas update`\n\n시크릿: `EXPO_TOKEN`, 스토어 키.\n\n---\n\n## 7. 딥링크·유니버설 링크\n\n- Custom scheme: `myapp://`\n- HTTPS App Links / Universal Links: 도메인 association 파일\n- 알림·마케팅 링크 → `router.push`\n\n스토어 심사·이메일 매직링크에서 중요.\n\n---\n\n## 8. 앱 크기·정책\n\n- Play: AAB 업로드\n- 불필요 권한 제거 (심사 리스크)\n- 개인정보 안전 라벨 / Privacy Manifest (iOS)\n- 계정 삭제 기능 (스토어 요구인 경우)\n- 암호화/수출 규정 질문 응답\n\n---\n\n## 9. 프로덕션 체크리스트\n\n### 제품\n\n- [ ] 빈/로딩/에러/오프라인 UI\n- [ ] 인증 만료·토큰 갱신\n- [ ] 딥링크·푸시 진입점\n- [ ] 접근성 라벨 주요 CTA\n\n### 기술\n\n- [ ] `APP`/API 환경 분리\n- [ ] SecureStore 토큰\n- [ ] Sentry(또는 동급) + 소스맵\n- [ ] 프로덕션 로그에 시크릿 없음\n- [ ] New Architecture / Hermes 확인\n\n### 배포\n\n- [ ] EAS production 빌드 성공\n- [ ] 내부 테스트 트랙\n- [ ] OTA 브랜치 전략 문서화\n- [ ] 롤백 방법 (이전 update / 스토어 이전 빌드)\n\n---\n\n## 문서 목록\n\n| 주제 | 한 줄 |\n|------|------|\n| Expo 시작 | RN + Expo + TS |\n| UI | Flex, StyleSheet, Image |\n| 상태·폼 | hooks, RHF, zod |\n| 리스트·라우팅 | FlatList, Expo Router |\n| 네트워크 | fetch, React Query |\n| 인증·권한 | SecureStore, permissions |\n| 모션 | Reanimated, Gesture |\n| 아키텍처 | Zustand, feature 구조 |\n| 품질 | Test, perf, Sentry |\n| 출시 | EAS Build/Submit/Update |\n\n---\n\n## 종합 연습\n\n1. EAS project를 연결하고 `preview` APK/내부 배포를 만든다.\n2. production 프로파일로 빌드 번호 autoIncrement를 확인한다.\n3. `eas update`로 카피 수정 OTA를 배포한다.\n4. 프로덕션 체크리스트를 통과/미통과로 표시한다.\n5. (선택) GitHub Actions에서 typecheck + test를 PR에 건다.\n\n---\n\n## 정리\n\n현대 React Native는 **Expo + TypeScript + Expo Router + React Query + EAS** 조합이 기본축이다.\n\n- UI는 Flex와 명확한 컴포넌트\n- 서버 상태는 Query, 클라이언트 전역은 최소\n- 토큰은 SecureStore, 권한은 필요 시점에\n- 애니메이션은 UI 스레드\n- 출시는 EAS, 핫픽스는 OTA(단, 네이티브 변경은 스토어)\n\n이 문서들을 바탕으로, 도메인에 맞게 결제·지도·오프라인(SQLite/WatermelonDB)·실시간(웹소켓)을 얹으면 실무 앱으로 확장할 수 있다.\n\n추가로 파고들 주제: Expo Modules API(커스텀 네이티브), Skia, React Native Web, Brownfield(기존 네이티브에 RN 삽입), Detox CI.\n"])</script><script>self.__next_f.push([1,"36:T19ae,"])</script><script>self.__next_f.push([1,"# Spring Boot 3와 Java 21 시작하기\n\n\u003e 요약: Spring Boot 3.x + Java 17/21 기준으로 프로젝트를 올바르게 세팅하고, 최신 생태계의 기본 개념을 잡는다.\n\n---\n\n---\n\n## 1. 왜 지금 Spring Boot인가\n\nSpring Boot는 **관례 기반(Convention over Configuration)** 으로 애플리케이션을 빠르게 기동하고, 운영에 필요한 기능을 starter로 조합하는 프레임워크다.\n\n2022년 이후의 큰 변화:\n\n| 항목 | Spring Boot 2.x | Spring Boot 3.x |\n|------|-----------------|-----------------|\n| Java | 8+ | **17 필수**, 21 권장 |\n| Jakarta EE | `javax.*` | **`jakarta.*`** |\n| 기본 서블릿 | Servlet 4 | Servlet 5/6 |\n| Native | 실험적 | GraalVM Native 정식 |\n| Observability | Micrometer 1.x | Micrometer 1.x + Observation API |\n\n실무에서는 **Java 21 LTS + Spring Boot 3.3~3.4+** 조합을 기본선으로 잡는 것이 일반적이다.\n\n---\n\n## 2. 프로젝트 생성 (권장 방법)\n\n### 2.1 start.spring.io\n\n[https://start.spring.io](https://start.spring.io)에서:\n\n- **Project**: Maven 또는 Gradle (Kotlin DSL 권장하는 팀도 많음)\n- **Language**: Java\n- **Spring Boot**: 최신 안정 버전\n- **Packaging**: Jar\n- **Java**: 21\n- **Dependencies** (최소 세트):\n  - Spring Web\n  - Spring Data JPA\n  - Validation\n  - Lombok (선택 — 팀 합의 후)\n  - H2 / PostgreSQL Driver\n\n### 2.2 CLI\n\n```bash\n# Spring Boot CLI 또는 curl로 생성\ncurl https://start.spring.io/starter.zip \\\n  -d type=maven-project \\\n  -d language=java \\\n  -d bootVersion=3.4.0 \\\n  -d javaVersion=21 \\\n  -d dependencies=web,data-jpa,validation,h2 \\\n  -o demo.zip\n```\n\n### 2.3 IDE\n\nIntelliJ IDEA / VS Code / Cursor 모두 start.spring.io 연동 또는 로컬 템플릿으로 생성 가능.\n\n---\n\n## 3. 표준 디렉터리 구조\n\n```\nsrc/main/java/com/example/demo/\n├── DemoApplication.java          # @SpringBootApplication\n├── config/                       # @Configuration, Bean 정의\n├── domain/                       # 엔티티, 도메인 서비스\n├── application/                  # 유스케이스 / 애플리케이션 서비스\n├── adapter/\n│   ├── web/                      # Controller, DTO\n│   ├── persistence/              # JPA Repository 구현\n│   └── external/                 # 외부 API 클라이언트\n└── common/                       # 예외, 유틸\n\nsrc/main/resources/\n├── application.yml\n├── application-local.yml\n├── application-prod.yml\n└── db/migration/                 # Flyway/Liquibase (권장)\n```\n\n\u003e 팁: 패키지를 `controller/service/repository`로만 나누는 것보다, **도메인/어댑터(헥사고날)** 방향으로 조금씩 옮기면 규모가 커져도 유지보수가 수월하다.\n\n---\n\n## 4. `@SpringBootApplication`이 하는 일\n\n```java\n@SpringBootApplication\npublic class DemoApplication {\n    public static void main(String[] args) {\n        SpringApplication.run(DemoApplication.class, args);\n    }\n}\n```\n\n내부적으로 다음이 합쳐진 메타 어노테이션이다.\n\n1. `@SpringBootConfiguration` — 설정 클래스\n2. `@EnableAutoConfiguration` — classpath 기반 자동 구성\n3. `@ComponentScan` — 현재 패키지 이하 컴포넌트 스캔\n\n자동 구성은 `META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports`에 등록된 클래스들이 조건을 만족할 때 활성화된다.\n\n---\n\n## 5. 설정: `application.yml` 모범 사례\n\n```yaml\nspring:\n  application:\n    name: demo\n  profiles:\n    active: local\n\nserver:\n  port: 8080\n\nmanagement:\n  endpoints:\n    web:\n      exposure:\n        include: health,info,metrics,prometheus\n  endpoint:\n    health:\n      probes:\n        enabled: true   # k8s liveness/readiness\n\nlogging:\n  level:\n    root: INFO\n    com.example.demo: DEBUG\n```\n\n### 프로파일 분리\n\n| 파일 | 용도 |\n|------|------|\n| `application.yml` | 공통 |\n| `application-local.yml` | 로컬 DB, 상세 로그 |\n| `application-test.yml` | 테스트 |\n| `application-prod.yml` | 운영 (시크릿은 환경변수/시크릿 매니저) |\n\n시크릿은 파일에 넣지 말고:\n\n```yaml\nspring:\n  datasource:\n    url: ${DB_URL}\n    username: ${DB_USER}\n    password: ${DB_PASSWORD}\n```\n\n---\n\n## 6. Java 21에서 특히 유용한 문법\n\nSpring Boot 3 코드베이스에서 자주 쓰이는 현대 Java 기능:\n\n### Record (DTO에 최적)\n\n```java\npublic record CreateUserRequest(String email, String name) {}\npublic record UserResponse(Long id, String email, String name) {}\n```\n\n### Sealed class (도메인 이벤트/결과 타입)\n\n```java\npublic sealed interface PaymentResult\n    permits PaymentResult.Success, PaymentResult.Failed {\n\n    record Success(String transactionId) implements PaymentResult {}\n    record Failed(String reason) implements PaymentResult {}\n}\n```\n\n### Pattern matching / switch\n\n```java\nString message = switch (result) {\n    case PaymentResult.Success s -\u003e \"OK: \" + s.transactionId();\n    case PaymentResult.Failed f -\u003e \"FAIL: \" + f.reason();\n};\n```\n\n### Virtual Threads (Spring Boot 3.2+)\n\n```yaml\nspring:\n  threads:\n    virtual:\n      enabled: true\n```\n\n블로킹 I/O가 많은 REST/JDBC 서비스에서 처리량을 크게 올릴 수 있다. (Virtual Threads 문서 참고)\n\n---\n\n## 7. 첫 API 한 줄로 이해하기\n\n```java\n@RestController\n@RequestMapping(\"/api/hello\")\npublic class HelloController {\n\n    @GetMapping\n    public Map\u003cString, String\u003e hello() {\n        return Map.of(\"message\", \"Hello, Spring Boot 3\");\n    }\n}\n```\n\n실행 후:\n\n```bash\ncurl http://localhost:8080/api/hello\n```\n\n---\n\n## 8. 빌드 \u0026 실행\n\n### Maven\n\n```bash\n./mvnw spring-boot:run\n./mvnw -DskipTests package\njava -jar target/demo-0.0.1-SNAPSHOT.jar\n```\n\n### Gradle\n\n```bash\n./gradlew bootRun\n./gradlew bootJar\njava -jar build/libs/demo-0.0.1-SNAPSHOT.jar\n```\n\n---\n\n## 9. 최신 기법 체크리스트\n\n- [ ] Java 21 LTS 사용\n- [ ] `javax.*` → `jakarta.*` 마이그레이션 완료\n- [ ] YAML + 프로파일 + 환경변수로 설정 분리\n- [ ] Actuator health/probes 활성화\n- [ ] DTO는 record 우선 검토\n- [ ] 패키지 구조를 도메인 중심으로 설계\n- [ ] Virtual Threads 도입 여부 검토 (I/O 바운드 서비스)\n\n---\n\n## 연습\n\n1. start.spring.io로 Web + Validation + Actuator 프로젝트를 만든다.\n2. `GET /api/health-demo` 엔드포인트를 추가하고 record로 응답한다.\n3. `local` / `prod` 프로파일을 나누고, `prod`에서는 로그 레벨을 INFO로 맞춘다.\n4. Actuator `/actuator/health`가 200을 반환하는지 확인한다.\n"])</script><script>self.__next_f.push([1,"37:T1897,"])</script><script>self.__next_f.push([1,"# IoC, Bean, Configuration — 현대적인 의존성 주입\n\n\u003e 요약: Spring IoC 컨테이너의 핵심을 이해하고, 생성자 주입·구성 클래스·조건부 Bean 등 실무 패턴을 익힌다.\n\n---\n\n---\n\n## 1. IoC와 DI란\n\n- **IoC (Inversion of Control)**: 객체 생성·생명주기 제어권을 프레임워크가 가진다.\n- **DI (Dependency Injection)**: 필요한 의존성을 외부에서 주입받는다.\n\n직접 `new`로 조립하면 테스트·교체가 어렵고, Spring은 **Bean**으로 등록된 객체를 조립한다.\n\n---\n\n## 2. Bean이 되는 방법\n\n| 방식 | 언제 쓰나 |\n|------|-----------|\n| `@Component` / `@Service` / `@Repository` / `@Controller` | 직접 만든 클래스 |\n| `@Bean` in `@Configuration` | 외부 라이브러리 객체, 세밀한 생성 제어 |\n| `@ConfigurationProperties` + `@EnableConfigurationProperties` | 타입 세이프 설정 바인딩 |\n| Auto-configuration | starter가 자동 등록 |\n\n```java\n@Service\npublic class OrderService {\n    private final OrderRepository orderRepository;\n    private final PaymentClient paymentClient;\n\n    // 생성자 1개면 @Autowired 생략 가능 (권장)\n    public OrderService(OrderRepository orderRepository, PaymentClient paymentClient) {\n        this.orderRepository = orderRepository;\n        this.paymentClient = paymentClient;\n    }\n}\n```\n\n---\n\n## 3. 주입 방식 — 무엇을 쓸까\n\n### 생성자 주입 (권장, 사실상 표준)\n\n```java\n@Service\n@RequiredArgsConstructor  // Lombok 사용 시\npublic class UserService {\n    private final UserRepository userRepository;\n}\n```\n\n장점:\n\n- `final`로 불변성 보장\n- 순환 의존성을 초기에 발견\n- 테스트에서 목 객체를 생성자로 넣기 쉬움\n\n### 필드 주입 (비권장)\n\n```java\n@Autowired\nprivate UserRepository userRepository; // 테스트·불변성 약함\n```\n\n### Setter 주입\n\n선택적 의존성일 때만 드물게 사용.\n\n---\n\n## 4. `@Configuration`과 `@Bean`\n\n```java\n@Configuration\npublic class AppConfig {\n\n    @Bean\n    Clock clock() {\n        return Clock.systemUTC();\n    }\n\n    @Bean\n    ObjectMapper objectMapper() {\n        return JsonMapper.builder()\n                .addModule(new JavaTimeModule())\n                .disable(SerializationFeature.WRITE_DATES_AS_TIMESTAMPS)\n                .build();\n    }\n}\n```\n\n`@Configuration`은 CGLIB 프록시로 `@Bean` 메서드 간 호출을 싱글톤으로 보장한다.  \n가벼운 설정만 필요하면 `@Configuration(proxyBeanMethods = false)` (Lite mode)를 쓰면 기동이 빨라진다.\n\n---\n\n## 5. 스코프\n\n| Scope | 설명 |\n|-------|------|\n| `singleton` (기본) | 컨테이너당 1개 |\n| `prototype` | 요청마다 새 인스턴스 |\n| `request` | HTTP 요청당 1개 |\n| `session` | HTTP 세션당 1개 |\n\n```java\n@Bean\n@Scope(\"prototype\")\npublic ReportBuilder reportBuilder() {\n    return new ReportBuilder();\n}\n```\n\n대부분의 서비스/리포지토리는 **singleton**이면 충분하다. 상태를 필드에 두지 말 것.\n\n---\n\n## 6. 조건부 Bean (실무에서 자주 씀)\n\n```java\n@Bean\n@ConditionalOnProperty(name = \"app.mail.enabled\", havingValue = \"true\")\nMailSender mailSender(MailProperties props) {\n    return new SmtpMailSender(props);\n}\n\n@Bean\n@ConditionalOnMissingBean(MailSender.class)\nMailSender noopMailSender() {\n    return new NoopMailSender();\n}\n```\n\n기타:\n\n- `@ConditionalOnClass`\n- `@ConditionalOnWebApplication`\n- `@Profile(\"local\")`\n\n```java\n@Service\n@Profile(\"!prod\")\npublic class FakePaymentClient implements PaymentClient { ... }\n```\n\n---\n\n## 7. `@ConfigurationProperties` (하드코딩 설정 금지)\n\n```java\n@ConfigurationProperties(prefix = \"app.payment\")\npublic record PaymentProperties(\n        String baseUrl,\n        Duration timeout,\n        int maxRetries\n) {}\n```\n\n```yaml\napp:\n  payment:\n    base-url: https://pay.example.com\n    timeout: 3s\n    max-retries: 2\n```\n\n```java\n@Configuration\n@EnableConfigurationProperties(PaymentProperties.class)\npublic class PaymentConfig {\n\n    @Bean\n    PaymentClient paymentClient(PaymentProperties props, RestClient.Builder builder) {\n        return new HttpPaymentClient(\n                builder.baseUrl(props.baseUrl())\n                        .build(),\n                props\n        );\n    }\n}\n```\n\nBoot 3에서는 **record + `@ConfigurationProperties`** 조합이 깔끔하다.  \nIDE 자동완성을 위해 `spring-boot-configuration-processor`를 annotationProcessor로 추가하면 좋다.\n\n---\n\n## 8. 인터페이스 기반 설계\n\n```java\npublic interface NotificationPort {\n    void send(String to, String message);\n}\n\n@Service\npublic class EmailNotificationAdapter implements NotificationPort { ... }\n```\n\n테스트:\n\n```java\n@SpringBootTest\n@Import(TestNotificationConfig.class)\nclass OrderServiceIT { ... }\n```\n\n의존성을 구현체가 아닌 **포트(인터페이스)** 에 두면 교체·테스트가 쉬워진다.\n\n---\n\n## 9. 순환 의존성\n\nBoot 2에서는 경고, Boot 3에서는 **기본적으로 금지**에 가깝다.\n\n해결:\n\n1. 설계 분리 (공통 로직을 제3 서비스로)\n2. 이벤트(`ApplicationEventPublisher`)로 결합도 낮추기\n3. `@Lazy`는 최후 수단\n\n---\n\n## 10. 생명주기 콜백\n\n```java\n@Component\npublic class CacheWarmer {\n\n    @PostConstruct\n    void warm() {\n        // 기동 직후\n    }\n\n    @PreDestroy\n    void shutdown() {\n        // 종료 직전\n    }\n}\n```\n\n또는:\n\n```java\n@Bean(initMethod = \"start\", destroyMethod = \"stop\")\nMyWorker myWorker() { return new MyWorker(); }\n```\n\n리소스 정리는 `destroyMethod` / `@PreDestroy` / `DisposableBean`을 명확히.\n\n---\n\n## 11. 최신 기법 요약\n\n- 생성자 주입 + `final`이 기본\n- 설정은 `@ConfigurationProperties`로 타입 세이프하게\n- 외부 연동 Bean은 `@Configuration`에서 조립\n- `@Profile` / `@ConditionalOn*`으로 환경별 구현 교체\n- 순환 참조는 구조로 해결\n- Lite `@Configuration(proxyBeanMethods = false)`로 기동 최적화 가능\n\n---\n\n## 연습\n\n1. `AppProperties(record)`를 만들고 `app.greeting` 값을 주입받아 API로 반환한다.\n2. `Clock` Bean을 등록하고 서비스에서 “지금 시각”을 출력한다. 테스트에서는 고정 `Clock`으로 교체한다.\n3. `local` 프로필에만 동작하는 `DevBanner` 컴포넌트를 만든다.\n"])</script><script>self.__next_f.push([1,"38:T1b55,"])</script><script>self.__next_f.push([1,"# REST API 설계 — Validation, Problem Details, RestClient\n\n\u003e 요약: Spring MVC 기반 REST API를 명확한 계약·검증·에러 응답·HTTP 클라이언트로 설계한다.\n\n---\n\n---\n\n## 1. 컨트롤러의 역할\n\n컨트롤러는 **HTTP 어댑터**다.\n\n- 요청 파싱 / 검증\n- 애플리케이션 서비스 호출\n- 응답 상태코드·본문 매핑\n\n비즈니스 규칙을 컨트롤러에 넣지 않는다.\n\n```java\n@RestController\n@RequestMapping(\"/api/users\")\n@RequiredArgsConstructor\npublic class UserController {\n\n    private final UserService userService;\n\n    @PostMapping\n    @ResponseStatus(HttpStatus.CREATED)\n    public UserResponse create(@Valid @RequestBody CreateUserRequest request) {\n        return userService.create(request);\n    }\n\n    @GetMapping(\"/{id}\")\n    public UserResponse get(@PathVariable Long id) {\n        return userService.get(id);\n    }\n}\n```\n\n---\n\n## 2. DTO는 record로\n\n```java\npublic record CreateUserRequest(\n        @NotBlank @Email String email,\n        @NotBlank @Size(max = 50) String name\n) {}\n\npublic record UserResponse(Long id, String email, String name) {}\n```\n\n엔티티를 그대로 노출하지 말 것. 영속성 모델과 API 계약은 분리한다.\n\n---\n\n## 3. Validation\n\n의존성: `spring-boot-starter-validation`\n\n| 어노테이션 | 용도 |\n|-----------|------|\n| `@NotNull` / `@NotBlank` | 필수 |\n| `@Email` | 이메일 |\n| `@Size` / `@Min` / `@Max` | 길이·범위 |\n| `@Pattern` | 정규식 |\n| `@Valid` | 중첩 객체 검증 |\n| `@Validated` | 그룹/메서드 검증 |\n\n쿼리 파라미터 검증:\n\n```java\n@GetMapping\npublic Page\u003cUserResponse\u003e search(\n        @RequestParam @Min(0) int page,\n        @RequestParam @Min(1) @Max(100) int size\n) { ... }\n```\n\n클래스에 `@Validated`를 붙여야 메서드 파라미터 검증이 동작한다.\n\n---\n\n## 4. 상태 코드 가이드\n\n| 상황 | 코드 |\n|------|------|\n| 조회 성공 | 200 |\n| 생성 성공 | 201 + `Location` 헤더 |\n| 삭제/수정 성공(본문 없음) | 204 |\n| 검증 실패 | 400 |\n| 인증 필요 | 401 |\n| 권한 없음 | 403 |\n| 없음 | 404 |\n| 충돌(중복 등) | 409 |\n| 서버 오류 | 500 |\n\n```java\n@PostMapping\npublic ResponseEntity\u003cUserResponse\u003e create(@Valid @RequestBody CreateUserRequest request) {\n    UserResponse created = userService.create(request);\n    URI location = URI.create(\"/api/users/\" + created.id());\n    return ResponseEntity.created(location).body(created);\n}\n```\n\n---\n\n## 5. Problem Details (RFC 7807) — 현대 에러 응답\n\nSpring Boot 3 / Spring Framework 6는 `ProblemDetail`을 지원한다.\n\n```java\n@RestControllerAdvice\npublic class GlobalExceptionHandler {\n\n    @ExceptionHandler(UserNotFoundException.class)\n    ResponseEntity\u003cProblemDetail\u003e handleNotFound(UserNotFoundException ex) {\n        ProblemDetail problem = ProblemDetail.forStatusAndDetail(\n                HttpStatus.NOT_FOUND, ex.getMessage());\n        problem.setTitle(\"User Not Found\");\n        problem.setProperty(\"userId\", ex.getUserId());\n        return ResponseEntity.status(HttpStatus.NOT_FOUND).body(problem);\n    }\n\n    @ExceptionHandler(MethodArgumentNotValidException.class)\n    ResponseEntity\u003cProblemDetail\u003e handleValidation(MethodArgumentNotValidException ex) {\n        ProblemDetail problem = ProblemDetail.forStatus(HttpStatus.BAD_REQUEST);\n        problem.setTitle(\"Validation Failed\");\n        problem.setProperty(\"errors\", ex.getBindingResult().getFieldErrors().stream()\n                .map(fe -\u003e Map.of(\"field\", fe.getField(), \"message\", fe.getDefaultMessage()))\n                .toList());\n        return ResponseEntity.badRequest().body(problem);\n    }\n}\n```\n\n응답 예시:\n\n```json\n{\n  \"type\": \"about:blank\",\n  \"title\": \"Validation Failed\",\n  \"status\": 400,\n  \"detail\": null,\n  \"errors\": [\n    { \"field\": \"email\", \"message\": \"must be a well-formed email address\" }\n  ]\n}\n```\n\n클라이언트와 에러 계약을 통일하면 프론트/모바일 대응이 쉬워진다.\n\n---\n\n## 6. API 버전 전략\n\n실무에서 많이 쓰는 방식:\n\n1. **URL 버전**: `/api/v1/users`\n2. **헤더 버전**: `Accept: application/vnd.example.v1+json`\n3. **하위 호환 진화**: 필드 추가만 하고 breaking change는 새 버전\n\n중소규모에서는 URL 버전이 운영하기 쉽다.\n\n---\n\n## 7. 페이지네이션·정렬\n\nSpring Data의 `Pageable` 활용:\n\n```java\n@GetMapping\npublic Page\u003cUserResponse\u003e list(Pageable pageable) {\n    return userService.list(pageable);\n}\n```\n\n```\nGET /api/users?page=0\u0026size=20\u0026sort=createdAt,desc\n```\n\n응답에 `content`, `totalElements`, `totalPages`가 포함된다.  \n외부 공개 API라면 커스텀 envelope(`items`, `page`, `size`, `total`)로 감싸는 팀도 많다.\n\n---\n\n## 8. RestClient (Boot 3.2+) — RestTemplate 대체\n\n`RestTemplate`은 유지보수 모드에 가깝고, 동기 HTTP는 **`RestClient`** 가 권장된다.  \n리액티브면 `WebClient`.\n\n```java\n@Configuration\npublic class HttpClientConfig {\n\n    @Bean\n    RestClient paymentRestClient(RestClient.Builder builder, PaymentProperties props) {\n        return builder\n                .baseUrl(props.baseUrl())\n                .defaultHeader(HttpHeaders.CONTENT_TYPE, MediaType.APPLICATION_JSON_VALUE)\n                .requestFactory(new JdkClientHttpRequestFactory())\n                .build();\n    }\n}\n```\n\n```java\npublic PaymentResponse charge(ChargeRequest request) {\n    return paymentRestClient.post()\n            .uri(\"/charges\")\n            .body(request)\n            .retrieve()\n            .onStatus(HttpStatusCode::is4xxClientError, (req, res) -\u003e {\n                throw new PaymentRejectedException(\"payment rejected\");\n            })\n            .body(PaymentResponse.class);\n}\n```\n\n타임아웃·재시도는 HTTP 클라이언트 설정 + Resilience4j와 함께 설계한다.\n\n---\n\n## 9. 콘텐츠 협상·JSON 설정\n\n```yaml\nspring:\n  jackson:\n    default-property-inclusion: non_null\n    serialization:\n      write-dates-as-timestamps: false\n    time-zone: Asia/Seoul\n```\n\n날짜는 ISO-8601 문자열(`OffsetDateTime`)을 권장한다.\n\n---\n\n## 10. OpenAPI 문서화\n\n`springdoc-openapi` 사용 예:\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eorg.springdoc\u003c/groupId\u003e\n  \u003cartifactId\u003espringdoc-openapi-starter-webmvc-ui\u003c/artifactId\u003e\n  \u003cversion\u003e2.7.0\u003c/version\u003e\n\u003c/dependency\u003e\n```\n\n- Swagger UI: `/swagger-ui.html`\n- OpenAPI JSON: `/v3/api-docs`\n\nDTO/컨트롤러에 `@Operation`, `@Schema`로 계약을 보강하면 협업 비용이 줄어든다.\n\n---\n\n## 11. 보안·설계 팁\n\n- 민감 필드는 응답에서 제외 (password, token 등)\n- IDOR 방지를 위해 리소스 접근 권한 검사\n- idempotency-key (결제/생성 API)\n- rate limiting은 게이트웨이 또는 필터에서\n\n---\n\n## 연습\n\n1. `POST /api/products` + Bean Validation + 201 Created를 구현한다.\n2. 존재하지 않는 상품 조회 시 `ProblemDetail` 404를 반환한다.\n3. `RestClient`로 공개 API(예: JSONPlaceholder)를 호출하는 서비스를 만든다.\n4. springdoc으로 Swagger UI에서 API를 확인한다.\n"])</script><script>self.__next_f.push([1,"39:T1b02,"])</script><script>self.__next_f.push([1,"# Spring Data JPA와 영속성 계층\n\n\u003e 요약: JPA 엔티티·리포지토리·트랜잭션을 올바르게 다루고, N+1·마이그레이션·성능 함정을 피한다.\n\n---\n\n---\n\n## 1. 계층 역할\n\n| 계층 | 책임 |\n|------|------|\n| Entity | 비즈니스 상태와 불변식 |\n| Repository | 영속성 추상화 |\n| Service (`@Transactional`) | 유스케이스 단위 트랜잭션 |\n| Controller | HTTP만 |\n\n---\n\n## 2. 엔티티 기본 패턴\n\n```java\n@Entity\n@Table(name = \"users\")\n@Getter\n@NoArgsConstructor(access = AccessLevel.PROTECTED)\npublic class User {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, unique = true, length = 100)\n    private String email;\n\n    @Column(nullable = false, length = 50)\n    private String name;\n\n    @CreatedDate\n    @Column(nullable = false, updatable = false)\n    private Instant createdAt;\n\n    @LastModifiedDate\n    private Instant updatedAt;\n\n    public static User create(String email, String name) {\n        User user = new User();\n        user.email = email;\n        user.name = name;\n        return user;\n    }\n\n    public void rename(String name) {\n        if (name == null || name.isBlank()) {\n            throw new IllegalArgumentException(\"name required\");\n        }\n        this.name = name;\n    }\n}\n```\n\n핵심:\n\n- 기본 생성자는 `protected`\n- setter 남발 금지 — 의미 있는 도메인 메서드 제공\n- equals/hashCode는 **식별자 기준**으로 신중히 ( Lombok `@EqualsAndHashCode` 무분별 사용 주의)\n\nAuditing 활성화:\n\n```java\n@Configuration\n@EnableJpaAuditing\npublic class JpaConfig {}\n```\n\n---\n\n## 3. Spring Data Repository\n\n```java\npublic interface UserRepository extends JpaRepository\u003cUser, Long\u003e {\n    Optional\u003cUser\u003e findByEmail(String email);\n    boolean existsByEmail(String email);\n\n    @Query(\"select u from User u where u.name like %:keyword%\")\n    List\u003cUser\u003e searchByName(@Param(\"keyword\") String keyword);\n}\n```\n\n파생 쿼리 메서드 → JPQL `@Query` → `Specification` / QueryDSL 순으로 복잡도를 올린다.\n\n### 수정·삭제 쿼리\n\n```java\n@Modifying(clearAutomatically = true, flushAutomatically = true)\n@Query(\"update User u set u.name = :name where u.id = :id\")\nint rename(@Param(\"id\") Long id, @Param(\"name\") String name);\n```\n\n벌크 업데이트 후 영속성 컨텍스트와 DB 불일치에 주의.\n\n---\n\n## 4. 트랜잭션\n\n```java\n@Service\n@RequiredArgsConstructor\n@Transactional(readOnly = true)\npublic class UserService {\n\n    private final UserRepository userRepository;\n\n    public UserResponse get(Long id) {\n        return userRepository.findById(id)\n                .map(UserMapper::toResponse)\n                .orElseThrow(() -\u003e new UserNotFoundException(id));\n    }\n\n    @Transactional\n    public UserResponse create(CreateUserRequest request) {\n        if (userRepository.existsByEmail(request.email())) {\n            throw new DuplicateEmailException(request.email());\n        }\n        User saved = userRepository.save(User.create(request.email(), request.name()));\n        return UserMapper.toResponse(saved);\n    }\n}\n```\n\n권장:\n\n- 클래스 기본: `readOnly = true`\n- 쓰기 메서드만 `@Transactional`\n- 트랜잭션 경계는 **애플리케이션 서비스**\n- 컨트롤러/`@Repository` 기본 메서드에 비즈니스 트랜잭션을 두지 않기\n\n전파(Propagation)·격리 수준은 기본값으로 대부분 충분하다. 특별한 동시성 이슈가 있을 때만 조정.\n\n---\n\n## 5. 연관관계와 지연 로딩\n\n```java\n@ManyToOne(fetch = FetchType.LAZY, optional = false)\n@JoinColumn(name = \"user_id\")\nprivate User user;\n\n@OneToMany(mappedBy = \"order\", cascade = CascadeType.ALL, orphanRemoval = true)\nprivate List\u003cOrderLine\u003e lines = new ArrayList\u003c\u003e();\n```\n\n규칙:\n\n- 모든 연관은 **LAZY**가 기본 전략\n- `EAGER`는 성능 사고의 주범\n- 양방향은 편의 메서드로 양쪽을 맞춘다\n\n```java\npublic void addLine(OrderLine line) {\n    lines.add(line);\n    line.setOrder(this);\n}\n```\n\n---\n\n## 6. N+1 문제와 해결\n\n증상: 목록 조회 후 연관 엔티티 접근 시 쿼리가 N번 추가.\n\n해결:\n\n### fetch join\n\n```java\n@Query(\"select o from Order o join fetch o.user where o.id = :id\")\nOptional\u003cOrder\u003e findWithUser(@Param(\"id\") Long id);\n```\n\n### EntityGraph\n\n```java\n@EntityGraph(attributePaths = {\"lines\"})\nOptional\u003cOrder\u003e findWithLinesById(Long id);\n```\n\n### DTO 프로젝션 (읽기 전용에 최적)\n\n```java\n@Query(\"\"\"\n    select new com.example.demo.order.OrderSummary(o.id, u.email, o.totalAmount)\n    from Order o join o.user u\n    where o.status = :status\n    \"\"\")\nList\u003cOrderSummary\u003e findSummaries(OrderStatus status);\n```\n\nOpen Session In View(`spring.jpa.open-in-view`)는 Boot 기본이 true인데, **운영에서는 false 권장**.\n\n```yaml\nspring:\n  jpa:\n    open-in-view: false\n```\n\n뷰/컨트롤러에서 지연 로딩이 터지면 설계를 고치는 편이 맞다.\n\n---\n\n## 7. 스키마 관리 — Flyway / Liquibase\n\n`ddl-auto: update`는 로컬 장난감용. 운영은 **마이그레이션 도구**가 정답.\n\n```yaml\nspring:\n  jpa:\n    hibernate:\n      ddl-auto: validate\n  flyway:\n    enabled: true\n```\n\n```\ndb/migration/\n  V1__create_users.sql\n  V2__create_orders.sql\n```\n\n```sql\n-- V1__create_users.sql\nCREATE TABLE users (\n    id BIGSERIAL PRIMARY KEY,\n    email VARCHAR(100) NOT NULL UNIQUE,\n    name VARCHAR(50) NOT NULL,\n    created_at TIMESTAMPTZ NOT NULL,\n    updated_at TIMESTAMPTZ\n);\n```\n\n---\n\n## 8. 낙관적 락\n\n동시 수정 충돌 방지:\n\n```java\n@Version\nprivate Long version;\n```\n\n충돌 시 `OptimisticLockException` → 409 또는 재시도 정책.\n\n---\n\n## 9. 성능·운영 설정\n\n```yaml\nspring:\n  datasource:\n    hikari:\n      maximum-pool-size: 10\n      minimum-idle: 2\n      connection-timeout: 3000\n  jpa:\n    properties:\n      hibernate:\n        jdbc:\n          batch_size: 50\n        order_inserts: true\n        order_updates: true\n```\n\n로컬에서 SQL 확인:\n\n```yaml\nlogging:\n  level:\n    org.hibernate.SQL: DEBUG\n    org.hibernate.orm.jdbc.bind: TRACE  # Boot 3 / Hibernate 6\n```\n\n`spring.jpa.show-sql=true`만으로는 바인딩 파라미터가 안 보인다.\n\n---\n\n## 10. Soft delete / 공통 베이스\n\n```java\n@MappedSuperclass\n@EntityListeners(AuditingEntityListener.class)\npublic abstract class BaseEntity {\n    @CreatedDate private Instant createdAt;\n    @LastModifiedDate private Instant updatedAt;\n}\n```\n\n소프트 삭제는 `@SQLRestriction` / `@SoftDelete`(Hibernate 6.4+) 또는 명시적 `deletedAt` 필드로 처리.\n\n---\n\n## 연습\n\n1. `User`, `Post` (User 1:N Post) 엔티티와 리포지토리를 만든다.\n2. 게시글 목록 + 작성자 이메일을 **fetch join 또는 DTO 쿼리**로 N+1 없이 조회한다.\n3. Flyway로 테이블을 생성하고 `ddl-auto: validate`로 맞춘다.\n4. `open-in-view: false`에서 지연 로딩 예외가 안 나는지 확인한다.\n"])</script><script>self.__next_f.push([1,"3a:T1bf5,"])</script><script>self.__next_f.push([1,"# Spring Security 6 — 인증·인가·OAuth2·JWT\n\n\u003e 요약: Spring Security 6의 SecurityFilterChain 기반으로 API 인증·인가를 설계하고, JWT/OAuth2 패턴을 이해한다.\n\n---\n\n---\n\n## 1. Security 6에서 달라진 점\n\n- `WebSecurityConfigurerAdapter` **삭제** → `SecurityFilterChain` `@Bean`\n- `antMatchers` → `requestMatchers`\n- 기본 세션 정책·CSRF 설정이 API 서버 관점에서 재설계 필요\n- Method Security: `@EnableMethodSecurity`\n\n---\n\n## 2. 최소 Security 설정 (세션 없는 API)\n\n```java\n@Configuration\n@EnableWebSecurity\n@EnableMethodSecurity\npublic class SecurityConfig {\n\n    @Bean\n    SecurityFilterChain securityFilterChain(HttpSecurity http) throws Exception {\n        http\n            .csrf(csrf -\u003e csrf.disable()) // 쿠키 세션 안 쓰면 보통 disable\n            .sessionManagement(sm -\u003e\n                sm.sessionCreationPolicy(SessionCreationPolicy.STATELESS))\n            .authorizeHttpRequests(auth -\u003e auth\n                .requestMatchers(\"/actuator/health\", \"/api/auth/**\", \"/v3/api-docs/**\", \"/swagger-ui/**\")\n                    .permitAll()\n                .requestMatchers(HttpMethod.GET, \"/api/posts/**\").permitAll()\n                .anyRequest().authenticated()\n            )\n            .httpBasic(Customizer.withDefaults()); // 데모용. 실무는 JWT/OAuth2\n\n        return http.build();\n    }\n\n    @Bean\n    PasswordEncoder passwordEncoder() {\n        return new BCryptPasswordEncoder();\n    }\n}\n```\n\n비밀번호는 반드시 `PasswordEncoder`로 해시. 평문 저장 금지.\n\n---\n\n## 3. UserDetailsService\n\n```java\n@Service\n@RequiredArgsConstructor\npublic class CustomUserDetailsService implements UserDetailsService {\n\n    private final UserAccountRepository repository;\n\n    @Override\n    public UserDetails loadUserByUsername(String username) throws UsernameNotFoundException {\n        UserAccount account = repository.findByEmail(username)\n                .orElseThrow(() -\u003e new UsernameNotFoundException(username));\n\n        return User.builder()\n                .username(account.getEmail())\n                .password(account.getPasswordHash())\n                .roles(account.getRole().name()) // ROLE_ 접두사 자동\n                .build();\n    }\n}\n```\n\n---\n\n## 4. JWT 기반 인증 (실무에서 흔한 API 패턴)\n\n흐름:\n\n1. `POST /api/auth/login` → access token (+ refresh token)\n2. 클라이언트: `Authorization: Bearer \u003ctoken\u003e`\n3. 필터에서 토큰 검증 → `SecurityContext`에 Authentication 설정\n\n### 토큰 발급 (개요)\n\n```java\npublic String createAccessToken(String subject, Collection\u003cString\u003e roles) {\n    Instant now = Instant.now();\n    return Jwts.builder()\n            .subject(subject)\n            .claim(\"roles\", roles)\n            .issuedAt(Date.from(now))\n            .expiration(Date.from(now.plus(15, ChronoUnit.MINUTES)))\n            .signWith(secretKey)\n            .compact();\n}\n```\n\n권장 사항:\n\n- Access Token: 짧은 TTL (5~15분)\n- Refresh Token: HttpOnly 쿠키 또는 안전한 저장소 + 회전(rotation)\n- 비밀키는 환경변수/시크릿 매니저\n- 라이브러리: `jjwt` 또는 `spring-security-oauth2-jose` (Nimbus)\n\n### JwtAuthFilter 스케치\n\n```java\n@Component\n@RequiredArgsConstructor\npublic class JwtAuthFilter extends OncePerRequestFilter {\n\n    private final JwtTokenProvider tokenProvider;\n\n    @Override\n    protected void doFilterInternal(HttpServletRequest request, HttpServletResponse response,\n                                    FilterChain filterChain) throws ServletException, IOException {\n        String token = resolveBearer(request);\n        if (token != null \u0026\u0026 tokenProvider.valid(token)) {\n            Authentication auth = tokenProvider.toAuthentication(token);\n            SecurityContextHolder.getContext().setAuthentication(auth);\n        }\n        filterChain.doFilter(request, response);\n    }\n}\n```\n\n필터를 `SecurityFilterChain`에 `UsernamePasswordAuthenticationFilter` 앞에 추가한다.\n\n---\n\n## 5. 메서드 레벨 인가\n\n```java\n@PreAuthorize(\"hasRole('ADMIN')\")\n@DeleteMapping(\"/{id}\")\npublic void delete(@PathVariable Long id) { ... }\n\n@PreAuthorize(\"#email == authentication.name or hasRole('ADMIN')\")\n@GetMapping(\"/me/{email}\")\npublic UserResponse me(@PathVariable String email) { ... }\n```\n\nURL 매처만으로 부족한 리소스 소유권 검사는 메서드 보안 + 서비스 가드로 처리.\n\n---\n\n## 6. OAuth2 Login / Resource Server\n\n### Resource Server (JWT 검증을 표준으로)\n\nAuthorization Server(Keycloak, Auth0, Cognito, Spring Authorization Server)가 발급한 JWT를 검증:\n\n```yaml\nspring:\n  security:\n    oauth2:\n      resourceserver:\n        jwt:\n          issuer-uri: https://auth.example.com/realms/demo\n```\n\n```java\nhttp.oauth2ResourceServer(oauth2 -\u003e oauth2.jwt(Customizer.withDefaults()));\n```\n\n직접 JWT 파서를 짜기보다, 가능하면 **OAuth2 Resource Server** 표준을 쓰는 편이 안전하다.\n\n### OAuth2 Login (소셜 로그인 웹앱)\n\n```yaml\nspring:\n  security:\n    oauth2:\n      client:\n        registration:\n          google:\n            client-id: ${GOOGLE_CLIENT_ID}\n            client-secret: ${GOOGLE_CLIENT_SECRET}\n            scope: openid, profile, email\n```\n\n---\n\n## 7. CORS\n\nSPA와 분리 배포 시:\n\n```java\n@Bean\nCorsConfigurationSource corsConfigurationSource() {\n    CorsConfiguration config = new CorsConfiguration();\n    config.setAllowedOrigins(List.of(\"https://app.example.com\"));\n    config.setAllowedMethods(List.of(\"GET\", \"POST\", \"PUT\", \"PATCH\", \"DELETE\"));\n    config.setAllowedHeaders(List.of(\"*\"));\n    config.setAllowCredentials(true);\n\n    UrlBasedCorsConfigurationSource source = new UrlBasedCorsConfigurationSource();\n    source.registerCorsConfiguration(\"/api/**\", config);\n    return source;\n}\n```\n\n`*` origin + credentials 조합은 브라우저에서 거부된다. 명시적 origin을 쓴다.\n\n---\n\n## 8. 보안 헤더·운영 체크리스트\n\n- HTTPS 강제 (리버스 프록시/로드밸런서 포함)\n- CSRF: 쿠키 세션 사용 시에만 신경 깊게 활성화\n- XSS: JSON API라도 응답 콘텐츠 타입 명확히\n- 브루트포스: 로그인 rate limit\n- 권한 상승 테스트 자동화\n- Actuator 엔드포인트 노출 최소화 + 인증\n\n```yaml\nmanagement:\n  endpoints:\n    web:\n      exposure:\n        include: health,info,prometheus\n```\n\n---\n\n## 9. 테스트\n\n```java\n@WebMvcTest(controllers = UserController.class)\n@Import(SecurityConfig.class)\nclass UserControllerSecurityTest {\n\n    @Autowired MockMvc mockMvc;\n\n    @Test\n    @WithMockUser(roles = \"USER\")\n    void userCannotDelete() throws Exception {\n        mockMvc.perform(delete(\"/api/users/1\"))\n                .andExpect(status().isForbidden());\n    }\n}\n```\n\n`@WithMockUser`, `@WithSecurityContext`로 인가 시나리오를 단위 테스트한다.\n\n---\n\n## 연습\n\n1. `SecurityFilterChain`으로 `/api/public/**`만 허용, 나머지는 인증 필수로 만든다.\n2. 회원가입 시 BCrypt로 비밀번호를 저장한다.\n3. JWT 로그인 + Bearer 인증 필터를 구현하거나, Resource Server + issuer-uri로 구성한다.\n4. `@PreAuthorize`로 ADMIN 전용 삭제 API를 만든다.\n"])</script><script>self.__next_f.push([1,"3b:T16ce,"])</script><script>self.__next_f.push([1,"# 테스트 — JUnit 5, MockMvc, Testcontainers\n\n\u003e 요약: 단위·슬라이스·통합 테스트를 균형 있게 구성하고, Testcontainers로 실제에 가까운 DB/미들웨어 검증을 한다.\n\n---\n\n---\n\n## 1. 테스트 피라미드 (Spring 관점)\n\n| 종류 | 도구 | 속도 | 목적 |\n|------|------|------|------|\n| 단위 | JUnit + Mockito | 매우 빠름 | 도메인/서비스 로직 |\n| 슬라이스 | `@WebMvcTest`, `@DataJpaTest` | 빠름 | 계층 경계 |\n| 통합 | `@SpringBootTest` + Testcontainers | 느림 | 실제 조립 검증 |\n| E2E | RestAssured / 브라우저 | 가장 느림 | 핵심 시나리오만 |\n\n모든 것을 `@SpringBootTest`로 올리면 CI가 느려지고 실패 원인 추적이 어렵다.\n\n---\n\n## 2. 단위 테스트\n\n```java\nclass OrderServiceTest {\n\n    @Test\n    void rejectsEmptyItems() {\n        OrderRepository repo = mock(OrderRepository.class);\n        OrderService service = new OrderService(repo);\n\n        assertThatThrownBy(() -\u003e service.create(new CreateOrderRequest(List.of())))\n                .isInstanceOf(InvalidOrderException.class);\n    }\n}\n```\n\n순수 도메인/서비스는 Spring 컨텍스트 없이 테스트하는 것이 최선이다.\n\n---\n\n## 3. `@WebMvcTest` — 컨트롤러 슬라이스\n\n```java\n@WebMvcTest(UserController.class)\n@Import(GlobalExceptionHandler.class)\nclass UserControllerTest {\n\n    @Autowired MockMvc mockMvc;\n    @MockitoBean UserService userService; // Boot 3.4+ (이전: @MockBean)\n\n    @Test\n    void createUser() throws Exception {\n        given(userService.create(any()))\n                .willReturn(new UserResponse(1L, \"a@b.com\", \"Ann\"));\n\n        mockMvc.perform(post(\"/api/users\")\n                        .contentType(MediaType.APPLICATION_JSON)\n                        .content(\"\"\"\n                            {\"email\":\"a@b.com\",\"name\":\"Ann\"}\n                            \"\"\"))\n                .andExpect(status().isCreated())\n                .andExpect(jsonPath(\"$.email\").value(\"a@b.com\"));\n    }\n}\n```\n\nSecurity가 켜져 있으면 `@AutoConfigureMockMvc(addFilters = false)` 또는 `@WithMockUser`를 사용한다.\n\n---\n\n## 4. `@DataJpaTest` — 영속성 슬라이스\n\n```java\n@DataJpaTest\n@AutoConfigureTestDatabase(replace = AutoConfigureTestDatabase.Replace.NONE)\n@Import(TestcontainersConfig.class)\nclass UserRepositoryTest {\n\n    @Autowired UserRepository userRepository;\n\n    @Test\n    void findByEmail() {\n        userRepository.save(User.create(\"a@b.com\", \"Ann\"));\n\n        assertThat(userRepository.findByEmail(\"a@b.com\")).isPresent();\n    }\n}\n```\n\nH2로 대체하면 운영 DB(PostgreSQL)와 方言 차이가 난다. **중요한 쿼리는 Testcontainers + 실제 DB**가 안전하다.\n\n---\n\n## 5. Testcontainers (최신 표준)\n\n의존성:\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eorg.springframework.boot\u003c/groupId\u003e\n  \u003cartifactId\u003espring-boot-testcontainers\u003c/artifactId\u003e\n  \u003cscope\u003etest\u003c/scope\u003e\n\u003c/dependency\u003e\n\u003cdependency\u003e\n  \u003cgroupId\u003eorg.testcontainers\u003c/groupId\u003e\n  \u003cartifactId\u003epostgresql\u003c/artifactId\u003e\n  \u003cscope\u003etest\u003c/scope\u003e\n\u003c/dependency\u003e\n\u003cdependency\u003e\n  \u003cgroupId\u003eorg.testcontainers\u003c/groupId\u003e\n  \u003cartifactId\u003ejunit-jupiter\u003c/artifactId\u003e\n  \u003cscope\u003etest\u003c/scope\u003e\n\u003c/dependency\u003e\n```\n\n```java\n@TestConfiguration(proxyBeanMethods = false)\npublic class TestcontainersConfig {\n\n    @Bean\n    @ServiceConnection\n    PostgreSQLContainer\u003c?\u003e postgres() {\n        return new PostgreSQLContainer\u003c\u003e(\"postgres:16-alpine\");\n    }\n}\n```\n\n```java\n@SpringBootTest\n@Import(TestcontainersConfig.class)\nclass UserServiceIT {\n\n    @Autowired UserService userService;\n\n    @Test\n    void createAndGet() {\n        UserResponse created = userService.create(new CreateUserRequest(\"a@b.com\", \"Ann\"));\n        assertThat(userService.get(created.id()).email()).isEqualTo(\"a@b.com\");\n    }\n}\n```\n\n`@ServiceConnection`(Boot 3.1+)이 datasource URL을 자동 연결한다. 수동 `@DynamicPropertySource`보다 간결하다.\n\nKafka, Redis, LocalStack도 동일 패턴으로 붙일 수 있다.\n\n---\n\n## 6. `@SpringBootTest` + MockMvc / TestRestTemplate / RestTestClient\n\n```java\n@SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)\nclass ApiIT {\n\n    @Autowired MockMvc mockMvc; // @AutoConfigureMockMvc 필요\n    // 또는\n    @Autowired TestRestTemplate restTemplate;\n}\n```\n\nBoot 3.4+에서는 `RestTestClient`도 선택지로 떠올랐다. 팀 표준에 맞춘다.\n\n---\n\n## 7. 테스트 데이터\n\n- 테스트마다 독립: `@Transactional` 롤백 또는 컨테이너 재사용 + 클리닝\n- Fixture 빌더 / 팩토리 메서드\n- `@Sql(\"/test-data.sql\")`는 간단할 때만\n\n```java\nstatic User user(String email) {\n    return User.create(email, email.split(\"@\")[0]);\n}\n```\n\n---\n\n## 8. AssertJ \u0026 가독성\n\n```java\nassertThat(result)\n    .extracting(UserResponse::email, UserResponse::name)\n    .containsExactly(\"a@b.com\", \"Ann\");\n```\n\nJUnit `assertEquals`보다 AssertJ 체인이 실패 메시지가 좋다.\n\n---\n\n## 9. 비동기·시간·외부 API\n\n| 대상 | 기법 |\n|------|------|\n| 시간 | `Clock` Bean 주입 후 고정 |\n| 외부 HTTP | WireMock / MockWebServer |\n| 메시지 | Testcontainers Kafka / Embedded |\n| 파일 | `@TempDir` |\n\n```java\n@Bean\n@Primary\nClock fixedClock() {\n    return Clock.fixed(Instant.parse(\"2026-01-01T00:00:00Z\"), ZoneOffset.UTC);\n}\n```\n\n---\n\n## 10. CI에서 안정적으로\n\n- Docker 사용 가능 러너 필요 (Testcontainers)\n- 컨테이너 재사용: `testcontainers.reuse.enable=true` (로컬)\n- 병렬 테스트 시 포트/리소스 충돌 주의\n- flaky 테스트는 재시도로 숨기지 말고 원인 제거\n\n---\n\n## 연습\n\n1. 서비스 단위 테스트 2개 작성 (성공/실패).\n2. `@WebMvcTest`로 validation 400 응답을 검증한다.\n3. Testcontainers PostgreSQL로 리포지토리/서비스 IT를 작성한다.\n4. `@ServiceConnection`으로 datasource 자동 연결을 확인해 본다.\n"])</script><script>self.__next_f.push([1,"3c:T166f,"])</script><script>self.__next_f.push([1,"# Observability — Actuator, Micrometer, OpenTelemetry\n\n\u003e 요약: 헬스체크·메트릭·트레이싱·구조화 로그로 “왜 느리고 어디서 깨졌는지”를 관측 가능하게 만든다.\n\n---\n\n---\n\n## 1. Observability 3本柱\n\n1. **Logs** — 이벤트 기록 (무엇을 했나)\n2. **Metrics** — 집계 수치 (얼마나/얼마나 자주)\n3. **Traces** — 요청 단위 분산 추적 (어디서 시간이 갔나)\n\nSpring Boot 3는 **Micrometer Observation API**로 메트릭과 트레이스를 같은 계측에서 뽑아낸다.\n\n---\n\n## 2. Actuator 기본\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eorg.springframework.boot\u003c/groupId\u003e\n  \u003cartifactId\u003espring-boot-starter-actuator\u003c/artifactId\u003e\n\u003c/dependency\u003e\n```\n\n```yaml\nmanagement:\n  endpoints:\n    web:\n      exposure:\n        include: health,info,metrics,prometheus,loggers\n  endpoint:\n    health:\n      show-details: when_authorized\n      probes:\n        enabled: true\n  info:\n    env:\n      enabled: true\n\ninfo:\n  app:\n    name: demo\n    version: 1.0.0\n```\n\n주요 엔드포인트:\n\n| Path | 용도 |\n|------|------|\n| `/actuator/health` | 생존/준비 |\n| `/actuator/health/liveness` | k8s liveness |\n| `/actuator/health/readiness` | k8s readiness |\n| `/actuator/metrics` | 메트릭 목록 |\n| `/actuator/prometheus` | Prometheus 스크rape |\n| `/actuator/info` | 앱 정보 |\n\n운영에서는 Actuator를 별도 포트/인증으로 보호하는 것이 일반적이다.\n\n```yaml\nmanagement:\n  server:\n    port: 8081\n```\n\n---\n\n## 3. 커스텀 Health Indicator\n\n```java\n@Component\npublic class PaymentGatewayHealthIndicator implements HealthIndicator {\n\n    private final PaymentClient client;\n\n    public PaymentGatewayHealthIndicator(PaymentClient client) {\n        this.client = client;\n    }\n\n    @Override\n    public Health health() {\n        try {\n            client.ping();\n            return Health.up().withDetail(\"payment\", \"reachable\").build();\n        } catch (Exception e) {\n            return Health.down(e).build();\n        }\n    }\n}\n```\n\n외부 의존성 실패를 readiness에 반영할지, 별도 게이지로만 볼지는 팀 정책으로 정한다.  \n과도한 외부 ping은 헬스체크 자체가 장애 포인트가 될 수 있다.\n\n---\n\n## 4. Micrometer 메트릭\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eio.micrometer\u003c/groupId\u003e\n  \u003cartifactId\u003emicrometer-registry-prometheus\u003c/artifactId\u003e\n\u003c/dependency\u003e\n```\n\n```java\n@Service\npublic class CheckoutService {\n\n    private final Counter checkoutCounter;\n    private final Timer checkoutTimer;\n\n    public CheckoutService(MeterRegistry registry) {\n        this.checkoutCounter = registry.counter(\"checkout.completed\");\n        this.checkoutTimer = registry.timer(\"checkout.latency\");\n    }\n\n    public void checkout(Order order) {\n        checkoutTimer.record(() -\u003e {\n            // business logic\n            checkoutCounter.increment();\n        });\n    }\n}\n```\n\n### Observation API (권장)\n\n```java\nservice.observe(\"order.create\", () -\u003e orderService.create(request));\n```\n\n또는:\n\n```java\nObservation.createNotStarted(\"order.create\", observationRegistry)\n    .lowCardinalityKeyValue(\"type\", \"online\")\n    .observe(() -\u003e orderService.create(request));\n```\n\nHTTP 서버/클라이언트, DataSource 등은 Boot가 기본 계측한다.\n\n---\n\n## 5. 분산 추적 (OpenTelemetry)\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eio.micrometer\u003c/groupId\u003e\n  \u003cartifactId\u003emicrometer-tracing-bridge-otel\u003c/artifactId\u003e\n\u003c/dependency\u003e\n\u003cdependency\u003e\n  \u003cgroupId\u003eio.opentelemetry\u003c/groupId\u003e\n  \u003cartifactId\u003eopentelemetry-exporter-otlp\u003c/artifactId\u003e\n\u003c/dependency\u003e\n```\n\n```yaml\nmanagement:\n  tracing:\n    sampling:\n      probability: 1.0   # 운영은 0.05~0.2부터\n  otlp:\n    tracing:\n      endpoint: http://localhost:4318/v1/traces\n\nlogging:\n  pattern:\n    level: \"%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]\"\n```\n\nZipkin/Jaeger/Grafana Tempo 등으로 트레이스를 시각화한다.  \n`traceId`가 로그에 남으면 장애 티켓 ↔ 로그 ↔ 트레이스를 연결할 수 있다.\n\n---\n\n## 6. 구조화 로그 (JSON)\n\n운영 로그는 텍스트보다 JSON이 검색·알람에 유리하다.\n\n예: Logback encoder (logstash-logback-encoder) 또는 Log4j2 JSON layout.\n\n남길 것:\n\n- timestamp, level, logger\n- service name, env\n- traceId, spanId\n- userId(가능하면 해시/내부 ID), requestId\n- 에러 스택(샘플링/제한)\n\n남기지 말 것:\n\n- 비밀번호, 토큰, 카드번호, 주민번호\n- 과도한 개인정보 원문\n\n---\n\n## 7. HTTP 클라이언트/DB 관측\n\n- `RestClient`/`WebClient`에 Observation/Micrometer 계측 활성화\n- HikariCP 메트릭: 커넥션 대기 시간 급증 = 풀 고갈 신호\n- JVM: heap, GC, threads\n- Tomcat/Netty 요청 큐\n\n알람 예시:\n\n- `http.server.requests` p99 \u003e 1s\n- `hikaricp.connections.pending` \u003e 0 지속\n- error rate (5xx) \u003e 1%\n- readiness fail\n\n---\n\n## 8. 프로파일별 샘플링\n\n| 환경 | sampling probability |\n|------|----------------------|\n| local | 1.0 |\n| staging | 0.5~1.0 |\n| prod | 0.05~0.2 (트래픽에 따라) |\n\n모든 요청을 트레이스하면 비용·성능 부담이 커진다.\n\n---\n\n## 9. 실무 대시보드 최소 구성\n\n1. RED: Rate, Errors, Duration (서비스/엔드포인트별)\n2. USE: Utilization, Saturation, Errors (CPU, 풀, 큐)\n3. 의존성 지연: DB, 결제, 카프카\n4. 비즈니스 KPI: 주문 성공 수, 결제 실패 수\n\n기술 메트릭만 보지 말고 **비즈니스 카운터**를 함께 심는다.\n\n---\n\n## 연습\n\n1. Actuator + Prometheus registry를 붙이고 `/actuator/prometheus`를 확인한다.\n2. 비즈니스 카운터 `order.created`를 추가한다.\n3. 로그 패턴에 `traceId`를 넣고, 요청 로그와 연결해 본다.\n4. (선택) OpenTelemetry collector + Jaeger로 트레이스를 시각화한다.\n"])</script><script>self.__next_f.push([1,"3d:T18ce,"])</script><script>self.__next_f.push([1,"# 비동기·메시징·Virtual Threads\n\n\u003e 요약: `@Async`, 이벤트, Kafka/RabbitMQ, Java 21 Virtual Threads를 상황에 맞게 선택한다.\n\n---\n\n---\n\n## 1. 동기 vs 비동기 — 언제 무엇을\n\n| 요구 | 선택 |\n|------|------|\n| 요청-응답, 단순 CRUD | 동기 MVC (+ Virtual Threads) |\n| 당장 응답 가능, 후처리는 나중 | 애플리케이션 이벤트 / 메시지 큐 |\n| 높은 동시 블로킹 I/O | Virtual Threads |\n| CPU 집약 | 플랫폼 스레드 풀 크기 제한 |\n| 서비스 간 느슨한 결합·재시도 | Kafka / RabbitMQ / SQS |\n\n“전부 리액티브(WebFlux)”가 기본값은 아니다. 팀 숙련도·라이브러리 생태계를 본다.\n\n---\n\n## 2. Virtual Threads (Spring Boot 3.2+)\n\n```yaml\nspring:\n  threads:\n    virtual:\n      enabled: true\n```\n\n효과:\n\n- 요청당 블로킹(JDBC, RestClient, 파일 I/O)이 있어도 스레드가 저렴하게 대기\n- Tomcat이 가상 스레드로 요청을 처리\n\n주의:\n\n- CPU 바운드 작업 성능 마법은 아님\n- `synchronized`로 오래 막히면 캐리어 스레드 pinning (Java 21+에서 개선 중이나 주의)\n- 스레드 로컬 대량 사용 라이브러리와 궁합 확인\n- 커넥션 풀 크기는 여전히 병목 — 가상 스레드만 켠다고 DB가 무한히 버티지 않음\n\n실무 팁: **I/O 많은 REST + JDBC 서비스**에서 먼저 효과를 보기 쉽다.\n\n---\n\n## 3. `@Async` — 간단한 백그라운드\n\n```java\n@Configuration\n@EnableAsync\npublic class AsyncConfig {\n\n    @Bean\n    TaskExecutor taskExecutor() {\n        // Virtual thread executor 예시\n        return new TaskExecutor() {\n            @Override\n            public void execute(Runnable task) {\n                Thread.startVirtualThread(task);\n            }\n        };\n    }\n}\n```\n\n```java\n@Service\npublic class MailService {\n    @Async\n    public void sendWelcome(String email) {\n        // SMTP 호출\n    }\n}\n```\n\n한계:\n\n- 실패 재시도·DLQ·순서 보장 약함\n- 프로세스 죽으면 작업 유실\n- “약간 나중에” 정도에만 사용하고, 중요한 후처리는 **메시지 브로커**로\n\n---\n\n## 4. 스프링 애플리케이션 이벤트\n\n같은 앱 내 결합도 낮추기:\n\n```java\npublic record OrderCreatedEvent(Long orderId, String email) {}\n\n@Service\n@RequiredArgsConstructor\npublic class OrderService {\n    private final ApplicationEventPublisher publisher;\n    private final OrderRepository repository;\n\n    @Transactional\n    public OrderResponse create(...) {\n        Order order = repository.save(...);\n        publisher.publishEvent(new OrderCreatedEvent(order.getId(), order.getEmail()));\n        return ...;\n    }\n}\n\n@Component\n@RequiredArgsConstructor\npublic class OrderCreatedListener {\n    private final MailService mailService;\n\n    @TransactionalEventListener(phase = TransactionPhase.AFTER_COMMIT)\n    public void on(OrderCreatedEvent event) {\n        mailService.sendWelcome(event.email());\n    }\n}\n```\n\n`@TransactionalEventListener(AFTER_COMMIT)`이 핵심이다.  \n커밋 전에 메일을 보내면 롤백된 주문에 환영 메일이 갈 수 있다.\n\n동기 이벤트는 발행 스레드에서 실행된다. 완전 분리하려면 `@Async` 또는 메시지 큐.\n\n---\n\n## 5. Kafka와의 연동 (개요)\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eorg.springframework.kafka\u003c/groupId\u003e\n  \u003cartifactId\u003espring-kafka\u003c/artifactId\u003e\n\u003c/dependency\u003e\n```\n\n```yaml\nspring:\n  kafka:\n    bootstrap-servers: ${KAFKA_BROKERS}\n    consumer:\n      group-id: demo-service\n      auto-offset-reset: earliest\n      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer\n      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer\n    producer:\n      key-serializer: org.apache.kafka.common.serialization.StringSerializer\n      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer\n```\n\n```java\n@Component\n@RequiredArgsConstructor\npublic class OrderEventPublisher {\n    private final KafkaTemplate\u003cString, OrderCreatedEvent\u003e kafkaTemplate;\n\n    public void publish(OrderCreatedEvent event) {\n        kafkaTemplate.send(\"order.created\", event.orderId().toString(), event);\n    }\n}\n\n@KafkaListener(topics = \"order.created\", groupId = \"mail-service\")\npublic void consume(OrderCreatedEvent event) {\n    mailService.sendWelcome(event.email());\n}\n```\n\n실무 체크리스트:\n\n- idempotent consumer (같은 이벤트 두 번 와도 안전)\n- 스키마 진화 (Avro/JSON Schema + 호환 규칙)\n- 재시도 + DLT (Dead Letter Topic)\n- 파티션 키로 순서 보장 범위 명확화\n- Outbox 패턴 (DB 트랜잭션과 메시지 발행 원자성)\n\n---\n\n## 6. Outbox 패턴 (중요)\n\n문제: DB 커밋 성공 후 Kafka 전송 실패 → 상태 불일치.\n\n해결 개요:\n\n1. 비즈니스 테이블 + `outbox` 테이블을 **같은 트랜잭션**에 기록\n2. 별도 퍼블리셔가 outbox를 읽어 브로커로 전송\n3. 전송 성공 시 처리 완료 마킹\n\nDebezium CDC로 outbox 테이블을 스트리밍하는 방식도 널리 쓰인다.\n\n---\n\n## 7. RabbitMQ가 잘 맞는 경우\n\n- 작업 큐 (메일, 썸네일, 리포트)\n- 라우팅 키/교환기 기반 유연한 배포\n- 비교적 단순한 경쟁 소비자 패턴\n\nKafka는 로그/이벤트 스트림·재생에 강하고, Rabbit은 작업 큐에 강하다. 목적에 맞게 고른다.\n\n---\n\n## 8. WebFlux / 반응형 — 언제 고려\n\n다음이면 검토:\n\n- 동시 연결이 매우 많고 메모리 제약이 큼\n- 다운스트림이 전부 non-blocking\n- 스트리밍(SSE, WebSocket)이 핵심\n\n다음이면 MVC + Virtual Threads가 보통 낫다:\n\n- JDBC/JPA 중심\n- 팀 대부분이 리액티브 비숙련\n- 블로킹 라이브러리가 많음\n\n---\n\n## 9. 타임아웃·취소·백프레셔\n\n- HTTP 클라이언트 connect/read timeout 명시\n- `@KafkaListener` 처리 시간 모니터링\n- 큐 적체 알람\n- 가상 스레드여도 **타임아웃 없는 무한 대기**는 위험\n\n---\n\n## 연습\n\n1. Virtual Threads를 켜고, 의도적으로 `Thread.sleep` 또는 외부 HTTP 대기가 있는 API의량 테스트를 비교한다.\n2. `OrderCreatedEvent` + `@TransactionalEventListener(AFTER_COMMIT)`로 메일 발송(로그로 대체)을 구현한다.\n3. (선택) Kafka Testcontainers로 produce/consume 통합 테스트를 작성한다.\n4. Outbox 테이블 설계를 문서/코드로 스케치한다.\n"])</script><script>self.__next_f.push([1,"3e:T146f,"])</script><script>self.__next_f.push([1,"# 캐시·Resilience·성능 최적화\n\n\u003e 요약: 캐시, 재시도, 서킷브레이커, 타임아웃으로 장애를 격리하고, 병목을 체계적으로 줄인다.\n\n---\n\n---\n\n## 1. 성능 작업의 순서\n\n1. **측정** (메트릭/트레이스/프로파일) — 감으로 최적화하지 않기\n2. 알고리즘/쿼리/N+1 제거\n3. 커넥션 풀·스레드·타임아웃 조정\n4. 캐시\n5. 스케일 아웃\n\n가장 싼 최적화는 “안 하는 일”을 줄이는 것이다 (불필요 호출, 과다 로그, 큰 페이로드).\n\n---\n\n## 2. Spring Cache\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eorg.springframework.boot\u003c/groupId\u003e\n  \u003cartifactId\u003espring-boot-starter-cache\u003c/artifactId\u003e\n\u003c/dependency\u003e\n```\n\n```java\n@Configuration\n@EnableCaching\npublic class CacheConfig {\n    @Bean\n    CacheManager cacheManager() {\n        return new ConcurrentMapCacheManager(\"products\", \"users\");\n    }\n}\n```\n\n```java\n@Cacheable(cacheNames = \"products\", key = \"#id\")\npublic ProductResponse get(Long id) { ... }\n\n@CacheEvict(cacheNames = \"products\", key = \"#id\")\npublic void update(Long id, UpdateProductRequest request) { ... }\n```\n\n로컬 캐시(`ConcurrentMap`)는 단일 인스턴스용.  \n다중 인스턴스는 **Redis** 등 분산 캐시:\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eorg.springframework.boot\u003c/groupId\u003e\n  \u003cartifactId\u003espring-boot-starter-data-redis\u003c/artifactId\u003e\n\u003c/dependency\u003e\n```\n\n주의:\n\n- 캐시 키 설계 (사용자별 데이터 섞임 금지)\n- TTL / 무효화 전략\n- stampede (캐시 만료 순간 동시 재계산) — lock/singleflight 또는 soft expire\n- 개인정보·권한 데이터 캐시 시 보안\n\n---\n\n## 3. Resilience4j — 실패에 대비\n\n의존성 예:\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eio.github.resilience4j\u003c/groupId\u003e\n  \u003cartifactId\u003eresilience4j-spring-boot3\u003c/artifactId\u003e\n\u003c/dependency\u003e\n```\n\n### 타임아웃\n\n외부 호출에는 **반드시** 타임아웃.\n\n### Retry\n\n```java\n@Retry(name = \"payment\", fallbackMethod = \"payFallback\")\npublic PaymentResult pay(PaymentRequest request) {\n    return paymentClient.charge(request);\n}\n```\n\n멱등하지 않은 POST에 무분별한 재시도는 위험.  \nIdempotency-Key 또는 “안전한 재시도 조건(네트워크/408/429/5xx)”만 재시도.\n\n### Circuit Breaker\n\n```yaml\nresilience4j:\n  circuitbreaker:\n    instances:\n      payment:\n        slidingWindowSize: 20\n        failureRateThreshold: 50\n        waitDurationInOpenState: 10s\n```\n\n실패율이 높으면 빠르게 실패(open) → 회복 시도(half-open) → 정상(close).\n\n### Bulkhead / RateLimiter\n\n동시 실행 수·호출 속도를 제한해 장애 전파를 막는다.\n\n### Fallback\n\n```java\nprivate PaymentResult payFallback(PaymentRequest request, Throwable t) {\n    return PaymentResult.failed(\"temporary unavailable\");\n}\n```\n\n폴백이 비즈니스적으로 안전한지 검토 (가짜 성공 금지).\n\n---\n\n## 4. HTTP 클라이언트 타임아웃\n\n```java\nJdkClientHttpRequestFactory factory = new JdkClientHttpRequestFactory();\nfactory.setReadTimeout(Duration.ofSeconds(3));\n\nRestClient client = RestClient.builder()\n        .requestFactory(factory)\n        .baseUrl(props.baseUrl())\n        .build();\n```\n\n타임아웃 없는 클라이언트는 스레드/가상스레드·커넥션을 잡아먹는다.\n\n---\n\n## 5. DB 성능 체크리스트\n\n- 인덱스: `WHERE`/`JOIN`/`ORDER BY` 컬럼\n- `EXPLAIN ANALYZE`로 실행 계획 확인\n- 필요 컬럼만 조회 (DTO 프로젝션)\n- 배치 사이즈, 페이지 크기 상한\n- 장시간 트랜잭션 금지 (락·커넥션 점유)\n- Hikari `maximum-pool-size` = (코어 수 기반 공식) × 인스턴스 수와 DB max_connections 균형\n\n---\n\n## 6. 페이로드·직렬화\n\n- 불필요 필드 제거 (`@JsonIgnore`, 전용 DTO)\n- 대용량 목록은 커서/키셋 페이지네이션\n- gzip (리버스 프록시)\n- 이미지/파일은 오브젝트 스토리지 + CDN\n\n오프셋 페이지네이션(`page=100000`)은 깊게 갈수록 느리다. 피드성 API는 **키셋 페이지네이션**이 유리하다.\n\n```java\nList\u003cPost\u003e findByIdLessThanOrderByIdDesc(Long cursor, Pageable pageable);\n```\n\n---\n\n## 7. JVM·런타임\n\n- 컨테이너: 메모리 한도에 맞는 heap (`-XX:+UseContainerSupport` 기본)\n- GC 로그/메트릭 관찰\n- Native Image(GraalVM)는 기동·메모리에 유리, 빌드 복잡·제한 존재 (운영 배포 문서 참고)\n\n---\n\n## 8. 동시성 이슈\n\n- 재고 차감 등: 낙관적 락 / 비관적 락 / DB 제약 / 단일화 큐\n- 분산 환경 락: Redis lock은 신중히 (오용 많음)\n- 멱등 테이블로 “한 번만 처리”\n\n```java\n@Entity\n@Table(name = \"idempotency_keys\", uniqueConstraints = @UniqueConstraint(columnNames = \"key_value\"))\npublic class IdempotencyKey { ... }\n```\n\n---\n\n## 9. 부하 테스트\n\n도구: k6, Gatling, JMeter\n\n볼 것:\n\n- RPS, p50/p95/p99\n- 에러율\n- CPU, heap, GC\n- DB CPU, 커넥션, slow query\n- 외부 의존성 지연\n\n최적화 전후를 **같은 시나리오**로 비교한다.\n\n---\n\n## 연습\n\n1. `@Cacheable`로 상품 조회 캐시를 넣고, 업데이트 시 evict한다.\n2. 외부 호출에 Resilience4j CircuitBreaker + Retry를 적용한다.\n3. RestClient read timeout을 3초로 설정한다.\n4. 느린 목록 API를 키셋 페이지네이션으로 바꾼다.\n"])</script><script>self.__next_f.push([1,"3f:T17f5,"])</script><script>self.__next_f.push([1,"# 운영 배포 — Docker, 설정, Native Image, 프로덕션 체크리스트\n\n\u003e 요약: 로컬에서 잘 되는 앱을 안전하게 빌드·배포·운영하는 최신 기본기를 정리한다.\n\n---\n\n---\n\n## 1. 12-Factor에 가까운 Spring Boot\n\n| 원칙 | 적용 |\n|------|------|\n| 설정 분리 | env / Secret / Config Server / 클라우드 설정 |\n| 백엔드 서비스 | URL로 연결 (DB, Redis, Kafka) |\n| 로그 | stdout/stderr (사이드카/에이전트가 수집) |\n| 폐기 가능 | graceful shutdown |\n| 포트 바인딩 | `SERVER_PORT` |\n\n```yaml\nserver:\n  shutdown: graceful\n\nspring:\n  lifecycle:\n    timeout-per-shutdown-phase: 30s\n```\n\n---\n\n## 2. 설정·시크릿\n\n하지 말 것:\n\n- `application-prod.yml`에 DB 비밀번호 커밋\n- 이미지에 시크릿 베이크인\n\n할 것:\n\n- 환경변수, Kubernetes Secret, AWS Secrets Manager, Vault 등\n- 프로파일은 `SPRING_PROFILES_ACTIVE=prod`\n- 민감 설정은 부팅 시 없으면 **실패**하게 (잘못된 기본값으로 기동 금지)\n\nSpring Cloud Config / Consul / Kubernetes ConfigMap은 팀 인프라에 맞게 선택.\n\n---\n\n## 3. Dockerfile (효율적인 멀티스테이지)\n\n```dockerfile\nFROM eclipse-temurin:21-jdk-alpine AS build\nWORKDIR /workspace\nCOPY . .\nRUN ./mvnw -q -DskipTests package\n\nFROM eclipse-temurin:21-jre-alpine\nWORKDIR /app\nRUN adduser -D spring\nUSER spring\nCOPY --from=build /workspace/target/demo-*.jar app.jar\nEXPOSE 8080\nENTRYPOINT [\"java\",\"-XX:MaxRAMPercentage=75.0\",\"-jar\",\"/app/app.jar\"]\n```\n\n개선 팁:\n\n- **Layered JAR**로 의존성 레이어 캐시 → 이미지 빌드/배포 가속\n- distroless / chiseled 이미지로 공격면 축소\n- non-root 사용자로 실행\n\n### Layertools 예시\n\n```bash\njava -Djarmode=layertools -jar app.jar extract\n```\n\nDockerfile에서 `dependencies` → `spring-boot-loader` → `application` 순으로 COPY.\n\n---\n\n## 4. Docker Compose (로컬 통합)\n\n```yaml\nservices:\n  app:\n    build: .\n    ports:\n      - \"8080:8080\"\n    environment:\n      SPRING_PROFILES_ACTIVE: local\n      DB_URL: jdbc:postgresql://db:5432/demo\n      DB_USER: demo\n      DB_PASSWORD: demo\n    depends_on:\n      db:\n        condition: service_healthy\n  db:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_DB: demo\n      POSTGRES_USER: demo\n      POSTGRES_PASSWORD: demo\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U demo\"]\n      interval: 5s\n      timeout: 5s\n      retries: 5\n```\n\n---\n\n## 5. Kubernetes 최소 스펙 포인트\n\n```yaml\nlivenessProbe:\n  httpGet:\n    path: /actuator/health/liveness\n    port: 8081\nreadinessProbe:\n  httpGet:\n    path: /actuator/health/readiness\n    port: 8081\nresources:\n  requests:\n    cpu: \"250m\"\n    memory: \"512Mi\"\n  limits:\n    memory: \"768Mi\"\n```\n\n- readiness 실패 → 트래픽 차단\n- liveness 실패 → 컨테이너 재시작\n- 메모리 limit 없이 JVM만 올리면 OOMKill 위험이 크다\n\n---\n\n## 6. CI/CD 파이프라인 골격\n\n1. 테스트 (단위 + Testcontainers IT)\n2. 정적 분석 (SpotBugs, Checkstyle, Spotless)\n3. SCA (의존성 취약점: Trivy, Dependabot, Snyk)\n4. 이미지 빌드·서명·스캔\n5. 스테이징 배포 → 스모크 테스트\n6. 프로덕션 (카나리/블루그린)\n\n`main`에 직접 푸시보다 PR + 필수 체크가 안전하다.\n\n---\n\n## 7. GraalVM Native Image\n\nBoot 3는 Native 지원이 정식이다.\n\n```bash\n./mvnw -Pnative native:compile\n```\n\n장점:\n\n- 매우 빠른 기동\n- 낮은 메모리\n\n비용:\n\n- 빌드 시간·복잡도 증가\n- 리플렉션/프록시 설정 필요 가능\n- 일부 라이브러리 비호환\n\n서버리스·스케일-to-zero, CLI, 사이드카에 특히 매력적.  \n상시 트래픽 큰 모놀리스는 JVM + CDS/AppCDS나 일반 최적화로도 충분한 경우가 많다.\n\n---\n\n## 8. 로깅·감사·컴플라이언스\n\n- 액세스 로그 / 감사 로그 분리\n- PII 마스킹\n- 보존 기간 정책\n- 시간대: 서버는 UTC, 표시만 로컬\n\n---\n\n## 9. 프로덕션 체크리스트\n\n### 보안\n\n- [ ] 최신 패치된 Base Image / JDK\n- [ ] Actuator·Swagger 노출 최소화\n- [ ] 시크릿 미커밋\n- [ ] HTTPS / 안전한 CORS\n- [ ] 의존성 취약점 스캔\n\n### 신뢰성\n\n- [ ] graceful shutdown\n- [ ] DB 마이그레이션(Flyway) 자동화\n- [ ] 타임아웃·재시도·서킷브레이커\n- [ ] 헬스 프로브 분리\n- [ ] 백업·복구 훈련 (DB)\n\n### 관측\n\n- [ ] 메트릭 + 알람 (5xx, p99, DB 풀)\n- [ ] 트레이스 샘플링\n- [ ] 구조화 로그 + traceId\n- [ ] 대시보드·런북\n\n### 성능\n\n- [ ] 부하 테스트 결과 문서화\n- [ ] 커넥션 풀·JVM 메모리 검증\n- [ ] 캐시/인덱스 점검\n\n---\n\n## 문서 목록\n\n| 주제 | 한 줄 |\n|------|------|\n| Boot 3 + Java 21 | 프로젝트·프로파일·현대 Java |\n| IoC / Bean | 생성자 주입·타입세이프 설정 |\n| REST | Validation·ProblemDetail·RestClient |\n| JPA | 트랜잭션·N+1·Flyway |\n| Security 6 | FilterChain·JWT/OAuth2 |\n| Test | 슬라이스·Testcontainers |\n| Observability | Actuator·Micrometer·OTel |\n| Async | Virtual Threads·이벤트·Kafka |\n| Resilience | 캐시·Resilience4j·성능 |\n| Ops | Docker·K8s·Native·체크리스트 |\n\n---\n\n## 종합 연습\n\n1. 01~09에서 만든 샘플 API를 Dockerfile로 이미지화한다.\n2. Compose로 app + Postgres를 띄운다.\n3. Actuator health가 healthy인지 확인한다.\n4. 프로덕션 체크리스트를 자신의 앱에 적용해 통과/미통과를 표시한다.\n5. (선택) Native Image 빌드 후 기동 시간을 JVM jar와 비교한다.\n\n---\n\n## 정리\n\nSpring Boot의 최신 기법은 “새 어노테이션 암기”보다 **운영 가능한 기본기**에 가깝다.\n\n- 명확한 API 계약과 에러\n- 안전한 트랜잭션·스키마 관리\n- 측정 가능한 시스템\n- 실패를 전제로 한 타임아웃/격리\n- 재현 가능한 빌드·배포\n\n이 문서들을 바탕으로, 팀 도메인에 맞게 깊이를 더하면 실무 Spring Boot 역량이 빠르게 쌓인다.\n\n추가로 파고들 주제: Spring Authorization Server, Spring Modulith, Spring Batch, R2DBC, Spring Cloud Gateway, GraalVM 심화, ArchUnit 기반 아키텍처 테스트.\n"])</script><script>self.__next_f.push([1,"10:[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"WebSite\\\",\\\"name\\\":\\\"Kaisa Blog\\\",\\\"description\\\":\\\"Development, design, and notes from Kaisa — articles on building products and tools.\\\",\\\"url\\\":\\\"https://blog.kaisa.co.kr/\\\"}\"}}],[\"$\",\"$L17\",null,{\"posts\":[{\"slug\":\"laravel-01\",\"title\":\"Laravel 11+와 현대 PHP 시작하기\",\"excerpt\":\"Laravel 11/12 + PHP 8.2/8.3 기준으로 프로젝트를 세팅하고, 슬림해진 구조와 최신 관례를 이해한다.\",\"content\":\"$18\",\"publishedAt\":\"2026-08-26\",\"category\":\"laravel\",\"categoryLabel\":\"Laravel\",\"tags\":[\"laravel\"],\"readingMinutes\":5,\"order\":1,\"filePath\":\"laravel/01-laravel-11-modern-php.md\"},{\"slug\":\"
