3edefault('draft'); // 또는 enum 컬럼\n    $table-\u003etimestamp('published_at')-\u003enullable();\n    $table-\u003etimestamps();\n    $table-\u003esoftDeletes();\n\n    $table-\u003eindex(['status', 'published_at']);\n});\n```\n\n```bash\nphp artisan migrate\nphp artisan migrate:rollback\nphp artisan migrate:fresh --seed   # 로컬만\n```\n\n운영에서 `migrate:fresh` 금지. 팀과 CI는 **마이그레이션 파일 리뷰**를 필수화한다.\n\n---\n\n## 2. 모델 기본\n\n```php\nclass Post extends Model\n{\n    use SoftDeletes;\n\n    protected $fillable = ['title', 'slug', 'body', 'status', 'published_at'];\n\n    protected function casts(): array\n    {\n        return [\n            'published_at' =\u003e 'datetime',\n            'status' =\u003e OrderStatus::class, // 예: PostStatus Enum\n        ];\n    }\n\n    public function user(): BelongsTo\n    {\n        return $this-\u003ebelongsTo(User::class);\n    }\n\n    public function tags(): BelongsToMany\n    {\n        return $this-\u003ebelongsToMany(Tag::class);\n    }\n}\n```\n\n주의:\n\n- `$guarded = []` 전면 허용은 위험 — mass assignment 신중히\n- 비즈니스 변경은 모델 메서드로 (`publish()`, `archive()`)\n- Accessor/Mutator는 `Attribute::make` 사용\n\n```php\nprotected function title(): Attribute\n{\n    return Attribute::make(\n        set: fn (string $value) =\u003e trim($value),\n    );\n}\n```\n\n---\n\n## 3. 관계 치트시트\n\n| 관계 | 메서드 |\n|------|--------|\n| 1:1 | `hasOne` / `belongsTo` |\n| 1:N | `hasMany` / `belongsTo` |\n| N:N | `belongsToMany` |\n| 다형 | `morphMany` / `morphTo` |\n| hasManyThrough | 중간 테이블 경유 |\n\n```php\n$post-\u003euser;\n$user-\u003eposts()-\u003elatest()-\u003epaginate(20);\n$post-\u003etags()-\u003esync([1, 2, 3]);\n```\n\n---\n\n## 4. 쿼리 빌더 / Eloquent 쿼리\n\n```php\nPost::query()\n    -\u003ewhere('status', PostStatus::Published)\n    -\u003ewhere('published_at', '\u003c=', now())\n    -\u003elatest('published_at')\n    -\u003epaginate(20);\n\nPost::query()\n    -\u003ewhen($search, fn ($q, $search) =\u003e $q-\u003ewhere('title', 'like', \"%{$search}%\"))\n    -\u003eget();\n```\n\n집계:\n\n```php\nUser::withCount('posts')-\u003eget();\nPost::where('user_id', $id)-\u003esum('views');\n```\n\n---\n\n## 5. N+1 문제\n\n나쁜 예:\n\n```php\n$posts = Post::all();\nforeach ($posts as $post) {\n    echo $post-\u003euser-\u003ename; // 매 루프 쿼리\n}\n```\n\n좋은 예:\n\n```php\n$posts = Post::with('user', 'tags')-\u003epaginate(20);\n```\n\n지연 로드가 필요할 때:\n\n```php\n$posts-\u003eload('user');\n```\n\n디버그:\n\n```bash\ncomposer require barryvdh/laravel-debugbar --dev\n# 또는\nDB::listen(fn ($q) =\u003e logger($q-\u003esql, $q-\u003ebindings));\n```\n\n`Model::preventLazyLoading(! app()-\u003eisProduction());`  \n→ 로컬/테스트에서 N+1을 예외로 터뜨리는 현대적 기법.\n\n---\n\n## 6. 스코프\n\n```php\npublic function scopePublished(Builder $query): void\n{\n    $query-\u003ewhere('status', PostStatus::Published)\n          -\u003ewhere('published_at', '\u003c=', now());\n}\n\nPost::published()-\u003elatest()-\u003eget();\n```\n\n글로벌 스코프는 남용하지 않기 (잊고 `withoutGlobalScopes` 하다가 사고).\n\n---\n\n## 7. 트랜잭션\n\n```php\nDB::transaction(function () use ($data) {\n    $order = Order::create([...]);\n    $order-\u003eitems()-\u003ecreateMany($data['items']);\n    $order-\u003euser-\u003edecrement('credits', $data['cost']);\n});\n```\n\n여러 쓰기 + 일관성 필요하면 반드시 트랜잭션.  \n긴 트랜잭션 안에 HTTP/메일 호출 넣지 말 것.\n\n---\n\n## 8. Factory \u0026 Seeder\n\n```php\n// database/factories/PostFactory.php\npublic function definition(): array\n{\n    return [\n        'user_id' =\u003e User::factory(),\n        'title' =\u003e fake()-\u003esentence(),\n        'slug' =\u003e fake()-\u003eunique()-\u003eslug(),\n        'body' =\u003e fake()-\u003eparagraphs(3, true),\n        'status' =\u003e PostStatus::Draft,\n    ];\n}\n\npublic function published(): static\n{\n    return $this-\u003estate(fn () =\u003e [\n        'status' =\u003e PostStatus::Published,\n        'published_at' =\u003e now()-\u003esubDay(),\n    ]);\n}\n```\n\n```php\nPost::factory()-\u003ecount(50)-\u003epublished()-\u003ecreate();\n```\n\n테스트와 데모 데이터에 필수.\n\n---\n\n## 9. 성능·인덱스\n\n- `where`/`orderBy`/`foreignId`에 인덱스\n- `select`로 필요 컬럼만\n- 대량 insert: `insert`, `upsert`, chunk\n- `chunkById` / `lazy`로 메모리 보호\n\n```php\nPost::query()-\u003ewhere('status', 'draft')-\u003echunkById(200, function ($posts) {\n    //\n});\n```\n\n---\n\n## 10. Soft delete \u0026 관찰자\n\n```php\n$post-\u003edelete();      // soft\n$post-\u003eforceDelete();\nPost::withTrashed()-\u003efind($id);\n```\n\n```bash\nphp artisan make:observer PostObserver --model=Post\n```\n\n생성 시 slug 자동 생성 등은 Observer/Model boot에서.\n\n---\n\n## 연습\n\n1. `User` 1:N `Post`, N:N `Tag`를 마이그레이션으로 만든다.\n2. `published` 스코프와 factory state를 구현한다.\n3. `preventLazyLoading`을 켜고 N+1을 `with`로 고친다.\n4. 주문 생성 시 트랜잭션으로 order + items를 저장한다."])</script><script>self.__next_f.push([1,"f:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"Eloquent ORM과 데이터베이스\\\",\\\"description\\\":\\\"마이그레이션·Eloquent 관계·쿼리·트랜잭션을 올바르게 쓰고, N+1과 스키마 관리 함정을 피한다.\\\",\\\"datePublished\\\":\\\"2026-08-26\\\",\\\"url\\\":\\\"https://blog.kaisa.co.kr/posts/laravel-03/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa Blog\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa Blog\\\",\\\"url\\\":\\\"https://blog.kaisa.co.kr/\\\"},\\\"articleSection\\\":\\\"laravel\\\",\\\"keywords\\\":\\\"laravel\\\"},{\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Kaisa Blog\\\",\\\"item\\\":\\\"https://blog.kaisa.co.kr/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Posts\\\",\\\"item\\\":\\\"https://blog.kaisa.co.kr/posts/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"Eloquent ORM과 데이터베이스\\\",\\\"item\\\":\\\"https://blog.kaisa.co.kr/posts/laravel-03/\\\"}]}]}\"
