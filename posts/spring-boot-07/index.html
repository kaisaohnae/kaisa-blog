nks/22o2e8l1llles.js\",\"/_next/static/chunks/18x8cntxsqa7x.js\"],\"ViewportBoundary\"]\n1d:I[97367,[\"/_next/static/chunks/22o2e8l1llles.js\",\"/_next/static/chunks/18x8cntxsqa7x.js\"],\"MetadataBoundary\"]\n10:[\"$\",\"script\",\"script-1\",{\"src\":\"/_next/static/chunks/1p-4hr1yu7b2y.js\",\"async\":true,\"nonce\":\"$undefined\"}]\n11:[\"$\",\"$L17\",null,{\"children\":[\"$\",\"$18\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@19\"}]}]\n1a:[]\n12:\"$W1a\"\n13:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L1b\",null,{\"children\":\"$L1c\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L1d\",null,{\"children\":[\"$\",\"$18\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L1e\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n15:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/3n6tbxvq3ysio.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n16:[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/3nvq7s-jdhde9.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"1f:I[55489,[\"/_next/static/chunks/22o2e8l1llles.js\",\"/_next/static/chunks/18x8cntxsqa7x.js\",\"/_next/static/chunks/1zc2_-8y7cq_w.js\",\"/_next/static/chunks/23376vl-bxl5y.js\",\"/_next/static/chunks/31_3thyp_teuk.js\",\"/_next/static/chunks/1jf0sqznr2yfq.js\",\"/_next/static/chunks/1p-4hr1yu7b2y.js\"],\"default\"]\n20:T166e,"])</script><script>self.__next_f.push([1,"# Observability — Actuator, Micrometer, OpenTelemetry\n\n\u003e 요약: 헬스체크·메트릭·트레이싱·구조화 로그로 “왜 느리고 어디서 깨졌는지”를 관측 가능하게 만든다.\n\n---\n\n---\n\n## 1. Observability 3本柱\n\n1. **Logs** — 이벤트 기록 (무엇을 했나)\n2. **Metrics** — 집계 수치 (얼마나/얼마나 자주)\n3. **Traces** — 요청 단위 분산 추적 (어디서 시간이 갔나)\n\nSpring Boot 3는 **Micrometer Observation API**로 메트릭과 트레이스를 같은 계측에서 뽑아낸다.\n\n---\n\n## 2. Actuator 기본\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eorg.springframework.boot\u003c/groupId\u003e\n  \u003cartifactId\u003espring-boot-starter-actuator\u003c/artifactId\u003e\n\u003c/dependency\u003e\n```\n\n```yaml\nmanagement:\n  endpoints:\n    web:\n      exposure:\n        include: health,info,metrics,prometheus,loggers\n  endpoint:\n    health:\n      show-details: when_authorized\n      probes:\n        enabled: true\n  info:\n    env:\n      enabled: true\n\ninfo:\n  app:\n    name: demo\n    version: 1.0.0\n```\n\n주요 엔드포인트:\n\n| Path | 용도 |\n|------|------|\n| `/actuator/health` | 생존/준비 |\n| `/actuator/health/liveness` | k8s liveness |\n| `/actuator/health/readiness` | k8s readiness |\n| `/actuator/metrics` | 메트릭 목록 |\n| `/actuator/prometheus` | Prometheus 스크rape |\n| `/actuator/info` | 앱 정보 |\n\n운영에서는 Actuator를 별도 포트/인증으로 보호하는 것이 일반적이다.\n\n```yaml\nmanagement:\n  server:\n    port: 8081\n```\n\n---\n\n## 3. 커스텀 Health Indicator\n\n```java\n@Component\npublic class PaymentGatewayHealthIndicator implements HealthIndicator {\n\n    private final PaymentClient client;\n\n    public PaymentGatewayHealthIndicator(PaymentClient client) {\n        this.client = client;\n    }\n\n    @Override\n    public Health health() {\n        try {\n            client.ping();\n            return Health.up().withDetail(\"payment\", \"reachable\").build();\n        } catch (Exception e) {\n            return Health.down(e).build();\n        }\n    }\n}\n```\n\n외부 의존성 실패를 readiness에 반영할지, 별도 게이지로만 볼지는 팀 정책으로 정한다.  \n과도한 외부 ping은 헬스체크 자체가 장애 포인트가 될 수 있다.\n\n---\n\n## 4. Micrometer 메트릭\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eio.micrometer\u003c/groupId\u003e\n  \u003cartifactId\u003emicrometer-registry-prometheus\u003c/artifactId\u003e\n\u003c/dependency\u003e\n```\n\n```java\n@Service\npublic class CheckoutService {\n\n    private final Counter checkoutCounter;\n    private final Timer checkoutTimer;\n\n    public CheckoutService(MeterRegistry registry) {\n        this.checkoutCounter = registry.counter(\"checkout.completed\");\n        this.checkoutTimer = registry.timer(\"checkout.latency\");\n    }\n\n    public void checkout(Order order) {\n        checkoutTimer.record(() -\u003e {\n            // business logic\n            checkoutCounter.increment();\n        });\n    }\n}\n```\n\n### Observation API (권장)\n\n```java\nservice.observe(\"order.create\", () -\u003e orderService.create(request));\n```\n\n또는:\n\n```java\nObservation.createNotStarted(\"order.create\", observationRegistry)\n    .lowCardinalityKeyValue(\"type\", \"online\")\n    .observe(() -\u003e orderService.create(request));\n```\n\nHTTP 서버/클라이언트, DataSource 등은 Boot가 기본 계측한다.\n\n---\n\n## 5. 분산 추적 (OpenTelemetry)\n\n```xml\n\u003cdependency\u003e\n  \u003cgroupId\u003eio.micrometer\u003c/groupId\u003e\n  \u003cartifactId\u003emicrometer-tracing-bridge-otel\u003c/artifactId\u003e\n\u003c/dependency\u003e\n\u003cdependency\u003e\n  \u003cgroupId\u003eio.opentelemetry\u003c/groupId\u003e\n  \u003cartifactId\u003eopentelemetry-exporter-otlp\u003c/artifactId\u003e\n\u003c/dependency\u003e\n```\n\n```yaml\nmanagement:\n  tracing:\n    sampling:\n      probability: 1.0   # 운영은 0.05~0.2부터\n  otlp:\n    tracing:\n      endpoint: http://localhost:4318/v1/traces\n\nlogging:\n  pattern:\n    level: \"%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]\"\n```\n\nZipkin/Jaeger/Grafana Tempo 등으로 트레이스를 시각화한다.  \n`traceId`가 로그에 남으면 장애 티켓 ↔ 로그 ↔ 트레이스를 연결할 수 있다.\n\n---\n\n## 6. 구조화 로그 (JSON)\n\n운영 로그는 텍스트보다 JSON이 검색·알람에 유리하다.\n\n예: Logback encoder (logstash-logback-encoder) 또는 Log4j2 JSON layout.\n\n남길 것:\n\n- timestamp, level, logger\n- service name, env\n- traceId, spanId\n- userId(가능하면 해시/내부 ID), requestId\n- 에러 스택(샘플링/제한)\n\n남기지 말 것:\n\n- 비밀번호, 토큰, 카드번호, 주민번호\n- 과도한 개인정보 원문\n\n---\n\n## 7. HTTP 클라이언트/DB 관측\n\n- `RestClient`/`WebClient`에 Observation/Micrometer 계측 활성화\n- HikariCP 메트릭: 커넥션 대기 시간 급증 = 풀 고갈 신호\n- JVM: heap, GC, threads\n- Tomcat/Netty 요청 큐\n\n알람 예시:\n\n- `http.server.requests` p99 \u003e 1s\n- `hikaricp.connections.pending` \u003e 0 지속\n- error rate (5xx) \u003e 1%\n- readiness fail\n\n---\n\n## 8. 프로파일별 샘플링\n\n| 환경 | sampling probability |\n|------|----------------------|\n| local | 1.0 |\n| staging | 0.5~1.0 |\n| prod | 0.05~0.2 (트래픽에 따라) |\n\n모든 요청을 트레이스하면 비용·성능 부담이 커진다.\n\n---\n\n## 9. 실무 대시보드 최소 구성\n\n1. RED: Rate, Errors, Duration (서비스/엔드포인트별)\n2. USE: Utilization, Saturation, Errors (CPU, 풀, 큐)\n3. 의존성 지연: DB, 결제, 카프카\n4. 비즈니스 KPI: 주문 성공 수, 결제 실패 수\n\n기술 메트릭만 보지 말고 **비즈니스 카운터**를 함께 심는다.\n\n---\n\n## 연습\n\n1. Actuator + Prometheus registry를 붙이고 `/actuator/prometheus`를 확인한다.\n2. 비즈니스 카운터 `order.created`를 추가한다.\n3. 로그 패턴에 `traceId`를 넣고, 요청 로그와 연결해 본다.\n4. (선택) OpenTelemetry collector + Jaeger로 트레이스를 시각화한다."])</script><script>self.__next_f.push([1,"f:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"Observability — Actuator, Micrometer, OpenTelemetry\\\",\\\"description\\\":\\\"헬스체크·메트릭·트레이싱·구조화 로그로 “왜 느리고 어디서 깨졌는지”를 관측 가능하게 만든다.\\\",\\\"datePublished\\\":\\\"2026-08-26\\\",\\\"url\\\":\\\"https://blog.kaisa.co.kr/posts/spring-boot-07/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa Blog\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa Blog\\\",\\\"url\\\":\\\"https://blog.kaisa.co.kr/\\\"},\\\"articleSection\\\":\\\"spring-boot\\\",\\\"keywords\\\":\\\"spring-boot\\\"},{\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Kaisa Blog\\\",\\\"item\\\":\\\"https://blog.kaisa.co.kr/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Posts\\\",\\\"item\\\":\\\"https://blog.kaisa.co.kr/posts/\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"Observability — Actuator, Micrometer, OpenTelemetry\\\",\\\"i
