hrow new IllegalArgumentException(\"name required\");\n        }\n        this.name = name;\n    }\n}\n```\n\n핵심:\n\n- 기본 생성자는 `protected`\n- setter 남발 금지 — 의미 있는 도메인 메서드 제공\n- equals/hashCode는 **식별자 기준**으로 신중히 ( Lombok `@EqualsAndHashCode` 무분별 사용 주의)\n\nAuditing 활성화:\n\n```java\n@Configuration\n@EnableJpaAuditing\npublic class JpaConfig {}\n```\n\n---\n\n## 3. Spring Data Repository\n\n```java\npublic interface UserRepository extends JpaRepository\u003cUser, Long\u003e {\n    Optional\u003cUser\u003e findByEmail(String email);\n    boolean existsByEmail(String email);\n\n    @Query(\"select u from User u where u.name like %:keyword%\")\n    List\u003cUser\u003e searchByName(@Param(\"keyword\") String keyword);\n}\n```\n\n파생 쿼리 메서드 → JPQL `@Query` → `Specification` / QueryDSL 순으로 복잡도를 올린다.\n\n### 수정·삭제 쿼리\n\n```java\n@Modifying(clearAutomatically = true, flushAutomatically = true)\n@Query(\"update User u set u.name = :name where u.id = :id\")\nint rename(@Param(\"id\") Long id, @Param(\"name\") String name);\n```\n\n벌크 업데이트 후 영속성 컨텍스트와 DB 불일치에 주의.\n\n---\n\n## 4. 트랜잭션\n\n```java\n@Service\n@RequiredArgsConstructor\n@Transactional(readOnly = true)\npublic class UserService {\n\n    private final UserRepository userRepository;\n\n    public UserResponse get(Long id) {\n        return userRepository.findById(id)\n                .map(UserMapper::toResponse)\n                .orElseThrow(() -\u003e new UserNotFoundException(id));\n    }\n\n    @Transactional\n    public UserResponse create(CreateUserRequest request) {\n        if (userRepository.existsByEmail(request.email())) {\n            throw new DuplicateEmailException(request.email());\n        }\n        User saved = userRepository.save(User.create(request.email(), request.name()));\n        return UserMapper.toResponse(saved);\n    }\n}\n```\n\n권장:\n\n- 클래스 기본: `readOnly = true`\n- 쓰기 메서드만 `@Transactional`\n- 트랜잭션 경계는 **애플리케이션 서비스**\n- 컨트롤러/`@Repository` 기본 메서드에 비즈니스 트랜잭션을 두지 않기\n\n전파(Propagation)·격리 수준은 기본값으로 대부분 충분하다. 특별한 동시성 이슈가 있을 때만 조정.\n\n---\n\n## 5. 연관관계와 지연 로딩\n\n```java\n@ManyToOne(fetch = FetchType.LAZY, optional = false)\n@JoinColumn(name = \"user_id\")\nprivate User user;\n\n@OneToMany(mappedBy = \"order\", cascade = CascadeType.ALL, orphanRemoval = true)\nprivate List\u003cOrderLine\u003e lines = new ArrayList\u003c\u003e();\n```\n\n규칙:\n\n- 모든 연관은 **LAZY**가 기본 전략\n- `EAGER`는 성능 사고의 주범\n- 양방향은 편의 메서드로 양쪽을 맞춘다\n\n```java\npublic void addLine(OrderLine line) {\n    lines.add(line);\n    line.setOrder(this);\n}\n```\n\n---\n\n## 6. N+1 문제와 해결\n\n증상: 목록 조회 후 연관 엔티티 접근 시 쿼리가 N번 추가.\n\n해결:\n\n### fetch join\n\n```java\n@Query(\"select o from Order o join fetch o.user where o.id = :id\")\nOptional\u003cOrder\u003e findWithUser(@Param(\"id\") Long id);\n```\n\n### EntityGraph\n\n```java\n@EntityGraph(attributePaths = {\"lines\"})\nOptional\u003cOrder\u003e findWithLinesById(Long id);\n```\n\n### DTO 프로젝션 (읽기 전용에 최적)\n\n```java\n@Query(\"\"\"\n    select new com.example.demo.order.OrderSummary(o.id, u.email, o.totalAmount)\n    from Order o join o.user u\n    where o.status = :status\n    \"\"\")\nList\u003cOrderSummary\u003e findSummaries(OrderStatus status);\n```\n\nOpen Session In View(`spring.jpa.open-in-view`)는 Boot 기본이 true인데, **운영에서는 false 권장**.\n\n```yaml\nspring:\n  jpa:\n    open-in-view: false\n```\n\n뷰/컨트롤러에서 지연 로딩이 터지면 설계를 고치는 편이 맞다.\n\n---\n\n## 7. 스키마 관리 — Flyway / Liquibase\n\n`ddl-auto: update`는 로컬 장난감용. 운영은 **마이그레이션 도구**가 정답.\n\n```yaml\nspring:\n  jpa:\n    hibernate:\n      ddl-auto: validate\n  flyway:\n    enabled: true\n```\n\n```\ndb/migration/\n  V1__create_users.sql\n  V2__create_orders.sql\n```\n\n```sql\n-- V1__create_users.sql\nCREATE TABLE users (\n    id BIGSERIAL PRIMARY KEY,\n    email VARCHAR(100) NOT NULL UNIQUE,\n    name VARCHAR(50) NOT NULL,\n    created_at TIMESTAMPTZ NOT NULL,\n    updated_at TIMESTAMPTZ\n);\n```\n\n---\n\n## 8. 낙관적 락\n\n동시 수정 충돌 방지:\n\n```java\n@Version\nprivate Long version;\n```\n\n충돌 시 `OptimisticLockException` → 409 또는 재시도 정책.\n\n---\n\n## 9. 성능·운영 설정\n\n```yaml\nspring:\n  datasource:\n    hikari:\n      maximum-pool-size: 10\n      minimum-idle: 2\n      connection-timeout: 3000\n  jpa:\n    properties:\n      hibernate:\n        jdbc:\n          batch_size: 50\n        order_inserts: true\n        order_updates: true\n```\n\n로컬에서 SQL 확인:\n\n```yaml\nlogging:\n  level:\n    org.hibernate.SQL: DEBUG\n    org.hibernate.orm.jdbc.bind: TRACE  # Boot 3 / Hibernate 6\n```\n\n`spring.jpa.show-sql=true`만으로는 바인딩 파라미터가 안 보인다.\n\n---\n\n## 10. Soft delete / 공통 베이스\n\n```java\n@MappedSuperclass\n@EntityListeners(AuditingEntityListener.class)\npublic abstract class BaseEntity {\n    @CreatedDate private Instant createdAt;\n    @LastModifiedDate private Instant updatedAt;\n}\n```\n\n소프트 삭제는 `@SQLRestriction` / `@SoftDelete`(Hibernate 6.4+) 또는 명시적 `deletedAt` 필드로 처리.\n\n---\n\n## 연습\n\n1. `User`, `Post` (User 1:N Post) 엔티티와 리포지토리를 만든다.\n2. 게시글 목록 + 작성자 이메일을 **fetch join 또는 DTO 쿼리**로 N+1 없이 조회한다.\n3. Flyway로 테이블을 생성하고 `ddl-auto: validate`로 맞춘다.\n4. `open-in-view: false`에서 지연 로딩 예외가 안 나는지 확인한다."])</script><script>self.__next_f.push([1,"19:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@graph\\\":[{\\\"@type\\\":\\\"BlogPosting\\\",\\\"headline\\\":\\\"Spring Data JPA와 영속성 계층\\\",\\\"description\\\":\\\"JPA 엔티티·리포지토리·트랜잭션을 올바르게 다루고, N+1·마이그레이션·성능 함정을 피한다.\\\",\\\"datePublished\\\":\\\"2026-08-26\\\",\\\"url\\\":\\\"https://blog.kaisa.co.kr/posts/spring-boot-04/\\\",\\\"author\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa Blog\\\"},\\\"publisher\\\":{\\\"@type\\\":\\\"Organization\\\",\\\"name\\\":\\\"Kaisa Blog\\\",\\\"url\\\":\\\"https://blog.kaisa.co.kr/\\\"},\\\"articleSection\\\":\\\"spring-boot\\\",\\\"keywords\\\":\\\"spring-boot\\\"},{\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":
